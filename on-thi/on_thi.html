 "Quản lý tác động môi trường", "Tính bền vững trong quá trình sản xuất", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Phụ lục 01 - Công văn 17118/VCB-CSSPBB ngày 14/08/2025 v/v Hướng dẫn tạm thời khung tiêu chí xác định Danh mục phân loại Xanh, Danh mục phân loại Chuyển đổi bền vững đối với Khách hàng tổ chức tại VCB"}, {"id": "TD.06.036", "q": "Lợi ích tổng thể mà các sản phẩm tài chính ESG của VCB mang lại cho khách hàng là gì?", "o": ["Hỗ trợ khách hàng tiếp cận nguồn vốn phù hợp cho các dự án xanh/bền vững", "Góp phần nâng cao hình ảnh, uy tín và năng lực cạnh tranh của doanh nghiệp", "Hỗ trợ khách hàng được tư vấn, kết nối giải pháp đo lường phát thải, đánh giá ESG và chuyển đổi bền vững", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Quyết định 2799/QyĐ-VCB-CSSPBB ngày 16/12/2025 v/v đánh giá, lựa chọn và tài trợ các Dự án bền vững bằng nguồn thu từ phát hành Trái phiếu bền vững tại Ngân hàng TMCP Ngoại thương Việt Nam Mục 1 - Công văn 17118/VCB-CSSPBB ngày 14/08/2025 v/v Hướng dẫn tạm thời khung tiêu chí xác định Danh mục phân loại Xanh, Danh mục phân loại Chuyển đổi bền vững đối với Khách hàng tổ chức tại VCB"}, {"id": "TD.06.037", "q": "Sản phẩm phát hành bảo lãnh theo pháp luật đấu thầu ban hành theo Quyết định 2121/QĐ-VCB-CSSPBB.PTSPBL ngày 23/09/2025 áp dụng cho các mục đích bảo lãnh nào? Chọn đáp án đúng nhất trong các đáp án sau:", "o": ["Bảo lãnh vay vốn và bảo lãnh thanh toán", "Bảo lãnh dự thầu và bảo lãnh tạm ứng", "Bảo lãnh dự thầu và bảo lãnh thực hiện hợp đồng", "Toàn bộ các loại bảo lãnh được phát hành theo quy định tại pháp luật đấu thầu"], "a": 2, "g": "Khoản 8.2 Điều 8 - Quyết định 2121/QĐ-VCB-CSSPBB.PTSPBL"}, {"id": "TD.06.038", "q": "Nhận định nào sau đây là đúng nhất khi thực hiện phát hành bảo lãnh theo pháp luật đấu thầu theo Quyết định 2121/QĐ-VCB-CSSPBB.PTSPBL ngày 23/09/2025?", "o": ["Trường hợp giao dịch phát hành bảo lãnh yêu cầu sử dụng mẫu thư bảo lãnh đáp ứng quy định sản phẩm, Đơn vị xử lý giao dịch phát hành bảo lãnh (30% tổng giá trị tiền đã được tạm ứng; 10% giá trị Hợp đồng đầu ra phát sinh nghĩa vụ bảo lãnh; phần lợi nhuận dự kiến của Hợp đồng đầu ra)", "Tổng giá trị giải tỏa tiền tạm ứng = Min (30% tổng giá trị tiền đã được tạm ứng; 15% giá trị Hợp đồng đầu ra phát sinh nghĩa vụ bảo lãnh; phần lợi nhuận dự kiến của Hợp đồng đầu ra)", "Tổng giá trị giải tỏa tiền tạm ứng = Min (20% tổng giá trị tiền đã được tạm ứng; 10% giá trị Hợp đồng đầu ra phát sinh nghĩa vụ bảo lãnh; phần lợi nhuận dự kiến của Hợp đồng đầu ra)", "Tổng giá trị giải tỏa tiền tạm ứng = Min (20% tổng giá trị tiền đã được tạm ứng; 20% giá trị Hợp đồng đầu ra phát sinh nghĩa vụ bảo lãnh; phần lợi nhuận dự kiến của Hợp đồng đầu ra)"], "a": 0, "g": "Mục 12.3.2 Điều 12 - QĐ số 2755/QyĐ/VCB-CSSPBB ngày 12/12/2025"}, {"id": "TD.06.047", "q": "Trường hợp Bên vay đáp ứng quy định sản phẩm bao thanh toán bên bán hàng có cam kết hoàn trả trong tài trợ chuỗi cung ứng, Bên vay là Doanh nghiệp có tính chất tư nhân gia đình và không phải là doanh nghiệp mới thành lập, tỷ bảo đảm tối thiểu đối với khoản bao thanh toán áp dụng cho Khách hàng có xếp hạng tín dụng PD b+ là?", "o": ["0.05", "0.1", "0.15", "0.25"], "a": 2, "g": "Điều 7 - Quy định số 1098/QyĐ-VCB-CSSPBB ngày 16/06/2026 Sản phẩm Bao thanh toán bên bán hàng có cam kết hoàn trả trong tài trợ chuỗi cung ứng"}, {"id": "TD.06.048", "q": "Đối với bao thanh toán bên bán hàng, đồng tiền bao thanh toán là đồng tiền gì?", "o": ["VND và ngoại tệ", "VNĐ hoặc đồng tiền của khoản phải thu", "Đồng tiền khoản phải thu bằng ngoại tệ phù hợp với quy định của pháp luật về quản lý ngoại hối", "Tất cả các đáp án trên đều sai"], "a": 1, "g": "Loại bỏ"}, {"id": "TD.06.049", "q": "Trường hợp khách hàng thuộc rổ cổ phiếu VN30 công bố bởi Sở Giao dịch chứng khoán Thành phố Hồ Chí Minh hoặc HNX30 công bố bởi Sở giao dịch chứng khoán Hà Nội, theo Quy định 1155/QyĐ-VCB-CSSPBB ngày 22/06/2026 về Sản phẩm thẻ tín dụng công ty dành cho Khách hàng bán buôn tiềm năng thì hạn mức tín dụng công ty của khách hàng tối đa là bao nhiêu?", "o": ["05 tỷ VND", "04 tỷ VND", "03 tỷ VND", "02 tỷ VND"], "a": 1, "g": "Điều 15 - Quy định 1155/QyĐ-VCB-CSSPBB ngày 22/06/2026 về Sản phẩm thẻ tín dụng công ty dành cho Khách hàng bán buôn tiềm năng"}, {"id": "TD.07.001", "q": "Theo quy định của VCB, Có bao nhiêu tiêu chí định danh Khách hàng Priority?", "o": ["8 (Tiền gửi, tiền vay, doanh số chi tiêu thẻ tín dụng, thu nhập, tổ hợp, bảo hiểm, vợ/chồng, đầu tư)", "9 (Tiền gửi, tiền vay, doanh số chi tiêu thẻ tín dụng, thu nhập, tổ hợp, bảo hiểm, vợ/chồng, đầu tư, AUM)", "10 (Tiền gửi, tiền vay, doanh số chi tiêu thẻ tín dụng, thu nhập, tổ hợp, bảo hiểm, vợ/chồng, đầu tư, AUM, CASA)", "12 (Tiền gửi, tiền vay, doanh số chi tiêu thẻ tín dụng, thu nhập, tổ hợp, bảo hiểm, vợ/chồng, đầu tư, AUM, CASA, gia đình, gián tiếp)"], "a": 3, "g": "- Chương II, Điều 5 - 20230817_QĐ 1681_Ban hành Quy định về Chính sách KH ưu tiên VCB; - Mục 1 - 20250815_CV 17159_Bổ sung, điều chỉnh tiêu chí định danh KH Priority; - Mục 1 - CV3385 v/v định danh KH Priority đầu tư"}, {"id": "TD.07.002", "q": "Theo quy định của VCB, Tiêu chí định danh Khách hàng Priority tiền gửi là gì?", "o": ["Khách hàng cá nhân của VCB có số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn và có kỳ hạn bình quân trong 12 tháng liền trước tính đến thời điểm xét định danh từ 02 tỷ VND trở lên", "Khách hàng cá nhân của VCB có số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn và có kỳ hạn bình quân trong 12 tháng liền trước hoặc cam kết duy trì trong 6 tháng tính từ thời điểm xét định danh, từ 02 tỷ VND trở lên", "Khách hàng cá nhân của VCB có số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn và có kỳ hạn bình quân từ 02 tỷ VND trở lên", "Khách hàng cá nhân của VCB có số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn và có kỳ hạn bình quân từ 05 tỷ VND trở lên"], "a": 1, "g": "Chương II, Điều 5, khoản 1.a - 20230817_QĐ 1681_Ban hành Quy định về Chính sách KH ưu tiên VCB"}, {"id": "TD.07.003", "q": "Theo quy định của VCB, Tiêu chí định danh Khách hàng Priority tiền vay là gì?", "o": ["Khách hàng cá nhân có dư nợ quy VND bình quân trong 12 tháng liền trước (loại trừ dư nợ đang được hưởng lãi suất cho vay theo Chính sách lãi suất cho vay áp dụng đối với cán bộ VCB do Tổng Giám đốc VCB quy định từng thời kỳ ) tính đến thời điểm xét định danh từ 03 tỷ VND trở lên", "Khách hàng cá nhân có dư nợ quy VND (loại trừ dư nợ đang được hưởng lãi suất cho vay theo Chính sách lãi suất cho vay áp dụng đối với cán bộ VCB do Tổng Giám đốc VCB quy định từng thời kỳ) từ 03 tỷ VND trở lên tại thời điểm xét định danh và cam kết duy trì tổng dư nợ tối thiểu 03 tỷ VND trong vòng 06 tháng tiếp theo.", "Tại thời điểm xét định danh và trong suốt thời gian được định danh Khách hàng Priority, Khách hàng không có nợ được phân loại vào nợ nhóm 2 trở lên theo quy định của pháp luật tại các Tổ chức tín dụng. Trong vòng 12 tháng tính đến thời điểm xét định danh Khách hàng Priority, Khách hàng không có nợ được phân loại vào nợ nhóm 3 trở lên theo quy định của pháp luật tại các Tổ chức tín dụng.", "A&B&C"], "a": 3, "g": "Chương II, Điều 5, khoản 1.b - 20230817_QĐ 1681_Ban hành Quy định về Chính sách KH ưu tiên VCB"}, {"id": "TD.07.004", "q": "Theo quy định của VCB, Tiêu chí định danh Khách hàng Priority thẻ là gì?", "o": ["Khách hàng là chủ thẻ tín dụng quốc tế cá nhân còn hiệu lực (ngoại trừ thẻ tín dụng cá nhân do công ty/tổ chức ủy quyền sử dụng) có Hạn mức tín dụng tại thời điểm xét định danh từ hạn mức tối thiểu của thẻ tín dụng hạng Platinum trở lên và có tổng doanh số chi tiêu thẻ tín dụng (bao gồm doanh số của tất cả các loại thẻ tín dụng, ngoại trừ thẻ tín dụng cá nhân do công ty/tổ chức ủy quyền sử dụng) tích lũy trong 12 tháng liền trước tính đến thời điểm xét định danh từ 250 triệu VND trở lên.", "Khách hàng là chủ thẻ tín dụng quốc tế cá nhân còn hiệu lực (ngoại trừ thẻ tín dụng cá nhân do công ty/tổ chức ủy quyền sử dụng) có Hạn mức tín dụng tại thời điểm xét định danh từ hạn mức tối thiểu của thẻ tín dụng hạng Platinum trở lên và có tổng doanh số chi tiêu thẻ tín dụng (bao gồm doanh số của tất cả các loại thẻ tín dụng, ngoại trừ thẻ tín dụng cá nhân do công ty/tổ chức ủy quyền sử dụng) tích lũy trong 12 tháng liền trước tính đến thời điểm xét định danh từ 150 triệu VND trở lên.", "Khách hàng là chủ thẻ tín dụng quốc tế cá nhân còn hiệu lực (bao gồm thẻ tín dụng cá nhân do công ty/tổ chức ủy quyền sử dụng) có Hạn mức tín dụng tại thời điểm xét định danh từ hạn mức tối thiểu của thẻ tín dụng hạng Platinum trở lên và có tổng doanh số chi tiêu thẻ tín dụng (bao gồm doanh số của tất cả các loại thẻ tín dụng, bao gồm thẻ tín dụng cá nhân do công ty/tổ chức ủy quyền sử dụng) tích lũy trong 12 tháng liền trước tính đến thời điểm xét định danh từ 250 triệu VND trở lên.", "Khách hàng là chủ thẻ tín dụng quốc tế cá nhân còn hiệu lực và có tổng doanh số chi tiêu thẻ tín dụng tích lũy trong 12 tháng liền trước tính đến thời điểm xét định danh từ 150 triệu VND trở lên."], "a": 0, "g": "Mục 1.5 - 20250815_CV 17159_Bổ sung, điều chỉnh tiêu chí định danh KH Priority"}, {"id": "TD.07.005", "q": "Theo quy định của VCB, Tiêu chí định danh Khách hàng Priority thu nhập là gì?", "o": ["Khách hàng nhận thu nhập qua tài khoản thanh toán mở tại VCB có thu nhập bình quân hàng tháng (VND và ngoại tệ) quy VND trong 12 tháng liền trước tính đến thời điểm xét định danh từ 70 triệu VND trở lên", "Khách hàng nhận thu nhập qua tài khoản thanh toán mở tại VCB có thu nhập bình quân hàng tháng (VND và ngoại tệ) quy VND trong 12 tháng liền trước tính đến thời điểm xét định danh từ 30 triệu VND trở lên", "Khách hàng nhận thu nhập qua tài khoản thanh toán mở tại VCB có thu nhập bình quân hàng tháng (VND và ngoại tệ) quy VND trong 12 tháng liền trước tính đến thời điểm xét định danh từ 50 triệu VND trở lên", "Khách hàng nhận thu nhập qua tài khoản thanh toán mở tại VCB có thu nhập bình quân hàng tháng (VND và ngoại tệ) quy VND trong 12 tháng liền trước tính đến thời điểm xét định danh từ 200 triệu VND trở lên"], "a": 2, "g": "Chương II, Điều 5, khoản 1.d - 20230817_QĐ 1681_Ban hành Quy định về Chính sách KH ưu tiên VCB"}, {"id": "TD.07.007", "q": "Theo quy định của VCB, Tiêu chí định danh Khách hàng Priority CASA là gì?", "o": ["Số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn bình quân trong 12 tháng liền trước từ 1 tỷ VND trở lên", "Số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn bình quân trong 12 tháng liền trước từ 2 tỷ VND trở lên", "Số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn bình quân trong 12 tháng liền trước từ 3 tỷ VND trở lên", "Số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn bình quân trong 12 tháng liền trước từ 500 triệu VND trở lên"], "a": 3, "g": "Mục 1.2 - 20250815_CV 17159_Bổ sung, điều chỉnh tiêu chí định danh KH Priority"}, {"id": "TD.07.008", "q": "Phân hạng Khách hàng Priority tại VCB hiện tại gồm mấy phân hạng?", "o": ["4 phân hạng Titan, Vàng, Kim cương, Kim cương Elite", "4 phân hạng: Titan, Vàng, Bạch kim, Elite", "3 phân hạng: Titan, Vàng, Kim cương", "3 phân hạng: Titan, Vàng, Kim cương Elite"], "a": 0, "g": "Chương II, Điều 13 - 20230817_QĐ 1681_Ban hành Quy định về Chính sách KH ưu tiên VCB"}, {"id": "TD.07.009", "q": "Tiêu chí định danh Khách hàng Priority theo tổng tài sản (AUM) của VCB là gì?", "o": ["Tổng giá trị tài sản của Khách hàng – AUM bình quân trong 12 tháng liền trước từ 2 tỷ VND trở lên hoặc tại thời điểm xét định danh từ 2 tỷ VND trở lên và cam kết duy trì AUM tối thiểu 2 tỷ VND trong vòng 06 tháng tiếp theo", "Số dư tiền gửi (VND và ngoại tệ) quy VND không kỳ hạn và có kỳ hạn bình quân 12 tháng liền trước hoặc tại thời điểm xét định danh từ 1 tỷ VND trở lên", "Khách hàng đã liên kết tài khoản ngân hàng tại VCB với tài khoản giao dịch chứng chỉ quỹ /tài khoản giao dịch chứng khoán tại các đối tác & đồng ý chia sẻ thông tin với VCB", "A&B&C"], "a": 3, "g": "Mục 1.1 - 20250815_CV 17159_Bổ sung, điều chỉnh tiêu chí định danh KH Priority"}, {"id": "TD.07.014", "q": "Đâu không phải là đặc điểm hành vi/nhu cầu đặc trưng của 1 Khách hàng trẻ thuộc phân khúc Young Professionals?", "o": ["Hứng thú với công nghệ số", "Ảnh hưởng lớn bởi Internet và đặc biệt là mạng xã hội và những người nổi tiếng (KOL)", "Lo sợ rủi ro, không dám mạo hiểm", "Muốn được thể hiện cá tính, màu sắc riêng của bản thân"], "a": 2, "g": ""}, {"id": "TD.07.015", "q": "Khách hàng trẻ chia sẻ thường xuyên bị chi tiêu vượt kế hoạch, chưa biết xây dựng và quản lý mục tiêu tiết kiệm cho bản thân. Theo bạn, Khách hàng này nên sử dụng sản phẩm nào phù hợp?", "o": ["Quản lý tài chính cá nhân", "Quản lý nhóm", "Tiết kiệm tích lũy", "A&C"], "a": 3, "g": ""}, {"id": "TD.07.016", "q": "Khách hàng trả tiền cho bữa ăn tối cùng 1 nhóm bạn và muốn Digibank hỗ trợ nhắc mọi người đóng tiền cho Khách hàng với 1 thao tác đồng ý và không cần nhập lại số tài khoản hay số tiền. Tính năng nào trên Digibank của VCB hỗ trợ cho Khách hàng làm việc này?", "o": ["Quản lý tài chính cá nhân", "Quản lý nhóm", "Chuyển tiền", "VCB Digibank chưa có tính năng này"], "a": 1, "g": ""}, {"id": "TD.07.017", "q": "Một Khách hàng trẻ đang tìm kiếm cách để tăng thu nhập nhưng vẫn ái ngại về rủi ro phát sinh, chưa biết đầu tư như nào. Nếu bạn được lựa chọn 1 trong 4 phương án dưới đây để tư vấn cho Khách hàng, bạn sẽ chọn phương án nào?", "o": ["Giới thiệu Khách hàng mở và giao dịch chứng chỉ quỹ trên Digibank", "Giới thiệu Khách hàng tham gia khóa học đầu tư để hiểu cách quản lý tài chính cá nhân và đầu tư", "Giới thiệu Khách hàng mở Tài khoản giao dịch chứng khoán trên Digibank và chủ động lựa chọn mã chứng khoán để đầu tư", "Cả 2 phương án A&B"], "a": 3, "g": ""}, {"id": "TD.07.019", "q": "Đối tượng Khách hàng ưu tiên của VCB DigiBiz là gì?", "o": ["Khách hàng tổ chức bán buôn", "Khách hàng tổ chức bán lẻ", "Khách hàng cá nhân", "Cả A,B"], "a": 1, "g": "Điều 5 - QĐ2622/QĐ-VCB.PTKSĐT"}, {"id": "TD.07.020", "q": "Theo CV 4995/VCB-CSSPBB.CSKHBL.PTSP&GSGDV ngày 29/03/2024 v/v Quy định định danh khách hàng trong hệ thống VCB, trường hợp Khách hàng đã mở CIF tại VCB và không có thông tin về Báo cáo tài chính của Khách hàng, Khách hàng nào sau đây là Khách hàng SME:", "o": ["Tiền gửi bình quân năm tại VCB đạt 12 tỷ VND", "Doanh số thanh toán xuất nhập khẩu năm gần nhất qua VCB đạt 4 triệu USD", "Tiền gửi bình quân năm tại VCB đạt 10 tỷ VND", "Doanh số thanh toán xuất nhập khẩu năm gần nhất qua VCB đạt 3 triệu USD"], "a": 3, "g": "Điều 4 - CV 4995/VCB-CSSPBB.CSKHBL.PTSP&GSGDV"}, {"id": "TD.07.021", "q": "Theo công văn 8411/VCB-CSKHBL-PTSPBL v/v Quy định định danh phân khúc/ phân nhóm Khách hàng SME, Tiêu chí định danh Khách hàng SME nhỏ/siêu nhỏ tín dụng là:", "o": ["Là Khách hàng SME đáp ứng đồng thời các điều kiện: 1. Doanh thu thuần năm gần nhất ≤ 20 tỷ VND 2. Tổng giá trị cấp tín dụng và giá trị bảo lãnh cho bên thứ ba ≤ 5 tỷ VND (không bao gồm KH đã xác định GHTD > 5 tỷ đồng)", "Là Khách hàng SME đáp ứng đồng thời các điều kiện: 1. Doanh thu thuần năm gần nhất > 20 tỷ VND 2. Tổng giá trị cấp tín dụng và giá trị bảo lãnh cho bên thứ ba ≤ 5 tỷ VND (không bao gồm KH đã xác định GHTD > 5 tỷ đồng)", "Là Khách hàng SME đáp ứng đồng thời các điều kiện: 1. Doanh thu thuần năm gần nhất > 20 tỷ VND 2. Tổng giá trị cấp tín dụng và giá trị bảo lãnh cho bên thứ ba >5 tỷ VND 3. Không bao gồm Khách hàng thuộc các đối tượng: Cơ quan nhà nước, đơn vị hành chính sự nghiệp, tổ chức chính trị - xã hội; Trường công lập các cấp; Các DN thành lập để triển khai dự án đầu tư", "Là Khách hàng SME đáp ứng đồng thời các điều kiện: 1. Doanh thu thuần năm gần nhất ≤ 20 tỷ VND 2. Tổng giá trị cấp tín dụng và giá trị bảo lãnh cho bên thứ ba ≤ 5 tỷ VND (không bao gồm Khách hàng đã xác định GHTD > 5 tỷ đồng) 3. Không bao gồm Khách hàng thuộc các đối tượng: Cơ quan nhà nước, đơn vị hành chính sự nghiệp, tổ chức chính trị - xã hội; Trường công lập các cấp; Các DN thành lập để triển khai dự án đầu tư"], "a": 3, "g": "Điều 2 - CV 8411/VCB-CSKHBL-PTSPBL"}, {"id": "TD.07.022", "q": "Các loại mã truy cập trên VCB DigiBiz?", "o": ["Mã quản trị", "Mã lập lệnh", "Mã duyệt lệnh", "Cả A,B,C"], "a": 3, "g": "Điều 9 - QĐ2622/QĐ-VCB.PTKSĐT"}, {"id": "TD.08.001", "q": "Theo Điều 10 của Thông tư 31/2024/TT-NHNN ngày 30/06/2024 của Ngân hàng Nhà nước Việt Nam, khoản nợ được điều chỉnh kỳ hạn trả nợ lần đầu còn trong hạn thì được phân loại vào nhóm nợ nào?", "o": ["Nhóm 1", "Nhóm 2", "Nhóm 3", "Nhóm 4"], "a": 1, "g": "Thông tư 31/2024/TT-NHNN, Điều 10"}, {"id": "TD.08.002", "q": "Theo Thông tư 31/2024/TT-NHNN ngày 30/06/2024 của Ngân hàng Nhà nước Việt Nam, khoản trả thay theo cam kết ngoại bảng nếu quá hạn từ 30 đến dưới 90 ngày được phân loại vào nhóm nào?", "o": ["Nhóm 2", "Nhóm 3", "Nhóm 4", "Nhóm 5"], "a": 2, "g": "Thông tư 31/2024/TT-NHNN, Điều 10"}, {"id": "TD.08.003", "q": "Theo Thông tư 31/2024/TT-NHNN ngày 30/06/2024 của Ngân hàng Nhà nước Việt Nam, khoản nợ bị quá hạn được phân loại nợ có mức độ rủi ro thấp hơn (kể cả nhóm 1) khi khách hàng đã trả đầy đủ phần nợ gốc và nợ lãi bị quá hạn (kể cả lãi áp dụng đối với nợ gốc quá hạn) và nợ gốc, lãi của các kỳ hạn trả nợ tiếp theo (nếu có) trong thời gian tối thiểu là bao lâu?", "o": ["03 tháng không phân biệt nợ ngắn hạn hay trung hạn, dài hạn", "01 tháng đối với nợ ngắn hạn", "03 tháng đối với nợ trung hạn, dài hạn", "01 tháng đối với nợ ngắn hạn và 03 tháng đối với nợ trung hạn, dài hạn"], "a": 3, "g": "Thông tư 31/2024/TT-NHNN, Điều 10"}, {"id": "TD.08.006", "q": "Theo Thông tư 31/2024/TT-NHNN ngày 30/06/2024 của Ngân hàng Nhà nước Việt Nam, Khoản nợ quá hạn từ 181 ngày đến 360 ngày được phân loại vào nhóm mấy?", "o": ["Nhóm 1", "Nhóm 2", "Nhóm 3", "Nhóm 4"], "a": 3, "g": "Thông tư 31/2024/TT-NHNN, Điều 9"}, {"id": "TD.08.008", "q": "Theo quy định của Nghị định 86/2024/NĐ-CP ngày 11/07/2024 của Chính Phủ, tỷ lệ trích lập dự phòng rủi ro cụ thể đối với nợ được phân loại nhóm 3 bao nhiêu phần trăm?", "o": ["0.05", "0.2", "0.5", "1"], "a": 1, "g": "Nghị định 86/2024/NĐ-CP, Điều 4"}, {"id": "TD.08.010", "q": "Theo quy định của Nghị định 86/2024/NĐ-CP ngày 11/07/2024 của Chính Phủ, mức trích lập dự phòng chung đối với khoản mua trái phiếu, chứng chỉ tiền gửi do tổ chức tín dụng chi nhánh ngân hàng nước ngoài khác phát hành trong nước là bao nhiêu phần trăm?", "o": ["0", "0.005", "0.0075", "0.01"], "a": 0, "g": "Nghị định 86/2024/NĐ-CP, Điều 7"}, {"id": "TD.08.017", "q": "Theo quy định tại Nghị định số 21/2021/NĐ-CP ngày 19/03/2021, văn bản thông báo về việc xử lý tài sản bảo đảm có nội dung chủ yếu nào sau đây:", "o": ["a) Lý do xử lý tài sản bảo đảm b) Tài sản bảo đảm sẽ bị xử lý c) Thời gian, địa điểm xử lý tài sản bảo đảm", "a) Nghĩa vụ được bảo đảm b) Tài sản bảo đảm sẽ bị xử lý c) Thời gian xử lý tài sản bảo đảm", "a) Tài sản bảo đảm sẽ bị xử lý b) Phương thức xử lý tài sản bảo đảm c) Thời gian xử lý tài sản bảo đảm", "a) Nghĩa vụ được bảo đảm b) Tài sản bảo đảm sẽ bị xử lý c) Phương thức, thời gian, địa điểm xử lý tài sản bảo đảm"], "a": 0, "g": "Nghị định số 21/2021/NĐ-CP - Điều 51"}, {"id": "TD.08.018", "q": "Theo quy định tại Nghị định số 21/2021/NĐ-CP ngày 19/03/2021, trường hợp các bên không có thỏa thuận về phương thức xử lý tài sản bảo đảm mà tài sản bảo đảm là chứng khoán niêm yết thì bên nhận bảo đảm được xử lý như thế nào?", "o": ["Bên nhận bảo đảm được bán theo giá tại thị trường giao dịch chứng khoán nhưng phải thông báo cho bên bảo đảm và các bên cùng nhận bảo đảm khác (nếu có) biết trước khi bán.", "Bên nhận bảo đảm được bán theo giá tại thị trường giao dịch chứng khoán nhưng phải thông báo cho bên bảo đảm và các bên cùng nhận bảo đảm khác (nếu có) biết sau khi bán.", "Bên nhận bảo đảm được bán theo giá tại thị trường giao dịch chứng khoán và không phải thông báo cho bên bảo đảm và các bên cùng nhận bảo đảm khác (nếu có) biết.", "Không đáp án nào phù hợp"], "a": 0, "g": "Nghị định số 21/2021/NĐ-CP - Điều 52"}, {"id": "TD.08.021", "q": "Theo quy định tại Nghị định số 21/2021/NĐ-CP ngày 19/03/2021, Bên bảo đảm được nhận lại tài sản bảo đảm trong trường hợp nào sau đây:", "o": ["Hoàn thành nghĩa vụ quy định tại Điều 302 của Bộ luật Dân sự", "Tài sản bảo đảm đã được thay thế, được trao đổi bằng tài sản khác 21", "Trường hợp khác theo thỏa thuận hoặc do Bộ luật Dân sự, luật khác liên quan quy định tài sản bảo đảm không bị xử lý", "Tất cả các đáp án trên"], "a": 3, "g": "Nghị định số 21/2021/NĐ-CP ngày 19/03/2021 Khoản 1 Điều 57"}, {"id": "TD.08.022", "q": "Theo quy định tại Nghị định số 21/2021/NĐ-CP ngày 19/03/2021, trường hợp bên bảo đảm thay đổi địa chỉ mà không thông báo cho bên nhận bảo đảm biết thì địa chỉ của bên bảo đảm để gửi thông báo xử lý tài sản bảo đảm được xác định theo địa chỉ nào?", "o": ["Địa chỉ của bên bảo đảm theo hợp đồng bảo đảm", "Địa chỉ của bên bảo đảm theo thông tin được lưu trữ tại cơ quan đăng ký biện pháp bảo đảm", "Đáp án A và B", "Không đáp án nào phù hợp"], "a": 2, "g": "Nghị định số 21/2021/NĐ-CP ngày 19/03/2021 Khoản 2 Điều 51"}, {"id": "TD.08.025", "q": "Theo quy định tại Luật đấu giá tài sản số 01/2016/QH14 ngày 17/11/2016 và các luật sửa đổi, bổ sung, trường hợp nào sau đây là trường hợp đấu giá không thành:", "o": ["Đã hết thời hạn đăng ký mà không có người đăng ký tham gia đấu giá", "Tất cả những người đã đăng ký tham gia đấu giá hợp lệ nhưng không tham dự phiên đấu giá", "Tại phiên đấu giá không có người trả giá", "Tất cả các đáp án trên"], "a": 3, "g": "Luật đấu giá tài sản số 01/2016/QH14 ngày 17/11/2016 và các luật sửa đổi, bổ sung Khoản 1 Điều 52"}, {"id": "TD.08.026", "q": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của NHNN và Thông tư số 18/2022-NHNN ngày 26/12/2022 của NHNN sửa đổi Thông tư 09/2015/TT-NHNN ngày 17/7/2015 về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài, điều nào sau đây là đúng nhất?", "o": ["Đồng tiền sử dụng trong mua bán nợ là đồng tiền của khoản nợ", "Đồng tiền sử dụng trong mua bán nợ là đồng tiền theo thỏa thuận giữa bên mua nợ và bên nợ", "Đồng tiền sử dụng trong mua bán nợ là đồng Việt Nam. Việc sử dụng ngoại tệ làm đồng thanh toán trong giao dịch mua bán nợ chỉ thực hiện trong trường hợp tổ chức tín dụng, chi nhánh ngân hàng nước ngoài bán khoản nợ cho bên mua nợ là người không cư trú", "Đồng tiền sử dụng trong mua bán nợ là đồng Việt Nam. Việc sử dụng ngoại tệ làm đồng thanh toán trong giao dịch mua bán nợ chỉ thực hiện trong trường hợp tổ chức tín dụng, chi nhánh ngân hàng nước ngoài bán khoản nợ bằng ngoại tệ cho bên mua nợ là người không cư trú"], "a": 3, "g": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của NHNN và Thông tư số 18/2022-NHNN ngày 26/12/2022 của NHNN sửa đổi Thông tư 09/2015/TT-NHNN ngày 17/7/2015 về hoạt động mua, bán nợ của TCTD - Khoản 1 - Điều 8. Đồng tiền giao dịch quy định: \"1, Đồng tiền sử dụng trong mua bán nợ là đồng Việt Nam. Việc sử dụng ngoại tệ làm đồng thanh toán trong giao dịch mua bán nợ chỉ thực hiện trong trường hợp tổ chức tín dụng, chi nhánh ngân hàng nước ngoài bán khoản nợ bằng ngoại tệ cho bên mua nợ là người không cư trú\""}, {"id": "TD.08.027", "q": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của NHNN và Thông tư số 18/2022-NHNN ngày 26/12/2022 của NHNN sửa đổi Thông tư 09/2015/TT-NHNN ngày 17/7/2015 về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài, đồng tiền bên mua nợ thu hồi bên nợ là:", "o": ["Đồng tiền của khoản nợ", "Đồng tiền khác theo thỏa thuận giữa bên mua nợ và bên nợ phù hợp với quy định của pháp luật về hạn chế sử dụng ngoại hối trên lãnh thổ Việt Nam", "Đáp án A và B", "Đồng Việt Nam"], "a": 2, "g": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của NHNN và Thông tư số 18/2022-NHNN ngày 26/12/2022 của NHNN sửa đổi Thông tư 09/2015/TT-NHNN ngày 17/7/2015 về hoạt động mua, bán nợ của TCTD - Khoản 2 Điều 8. Đồng tiền giao dịch quy định: \"2. Đồng tiền thu hồi nợ là đồng tiền của khoản nợ hoặc đồng tiền khác theo thỏa thuận giữa bên mua nợ và bên nợ phù hợp với quy định của pháp luật về hạn chế sử dụng ngoại hối trên lãnh thổ Việt Nam\""}, {"id": "TD.08.028", "q": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam (NHNN) về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài (Thông tư 09) và Thông tư 18/2022/TT-NHNN ngày 26/12/2022 của NHNN v/v sửa đổi một số điều của Thông tư 09, TCTD, Chi nhánh ngân hàng nước ngoài xem xét lựa chọn việc định giá khoản nợ theo các phương thức sau:", "o": ["Tự xác định", "Thuê doanh nghiệp thẩm định giá để thực hiện định giá khoản nợ được mua, bán", "Đáp án A và B đều đúng.", "Không đáp án nào đúng"], "a": 2, "g": "Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài Thông tư 18/2022/TT-NHNN ngày 26/12/2022 của NHNN v/v sửa đổi một số điều của Thông tư 09/2015/TT-NHNN Khoản 6 Điều 1 Thông tư 18 sửa đổi Điều 12 của Thông tư 09/2015/TT-NHNN"}, {"id": "TD.08.032", "q": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài, khi thực hiện bán toàn bộ khoản nợ, thì kể từ thời điểm bên mua nợ nhận chuyển giao quyền sở hữu khoản nợ từ bên bán nợ, các quyền, nghĩa vụ đối với biện pháp bảo đảm của khoản nợ được Bên bán nợ xử,lý như thế nào?", "o": ["Hết hiệu lực", "Được chuyển giao cho Bên mua nợ", "Bên bán nợ vẫn giữ quyền đối với các biện pháp bảo đảm của khoản nợ", "Được chuyển giao cho Bên mua nợ nếu Bên nợ và các bên liên quan đồng ý"], "a": 1, "g": "Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài, Điều 14 khoản 2 quy định: \"Bên bán nợ chuyển giao quyền, nghĩa vụ liên quan đến khoản nợ cho bên mua nợ bao gồm cả quyền, nghĩa vụ đối với các biện pháp bảo đảm (nếu có)...\""}, {"id": "TD.08.033", "q": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài, điều kiện khoản nợ được mua bán phải đáp ứng điều kiện nào sau đây:", "o": ["Hồ sơ, chứng từ và các tài liệu có liên quan của khoản nợ được mua, bán, hợp đồng bảo đảm (nếu có) do bên bán nợ cung cấp phải phản ánh đầy đủ, chính xác thực trạng khoản nợ theo đúng quy định của pháp luật.", "Không có thỏa thuận bằng văn bản về việc không được mua, bán khoản nợ.", "Khoản nợ không được sử dụng để bảo đảm thực hiện nghĩa vụ dân sự tại thời điểm mua, bán nợ trừ trường hợp bên nhận bảo đảm đồng ý bằng văn bản về việc bán nợ.", "Tất cả các đáp án nêu trên"], "a": 3, "g": "Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài - Điều 4."}, {"id": "TD.08.034", "q": "Theo quy định tại Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam (NHNN) về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài (Thông tư 09) và Thông tư 18/2022/TT-NHNN ngày 26/12/2022 của NHNN v/v sửa đổi một số điều của Thông tư 09, TCTD có được bán nợ cho công ty con của chính tổ chức tín dụng đó không?", "o": ["Có", "Không", "Không, trừ các trường hợp sau: a) Bán nợ cho công ty quản lý nợ và khai thác tài sản theo phương án tái cơ cấu được cấp có thẩm quyền phê duyệt, b) Tổ chức tín dụng là bên nhận chuyển giao bắt buộc bán nợ đủ tiêu chuẩn cho ngân hàng thương mại được chuyển giao bắt buộc theo phương án chuyển giao bắt buộc đã được phê duyệt.", "Không có đáp án nào đúng"], "a": 2, "g": "Thông tư 09/2015/TT-NHNN ngày 17/7/2015 của Ngân hàng Nhà nước Việt Nam về hoạt động mua, bán nợ của TCTD, Chi nhánh ngân hàng nước ngoài Thông tư 18/2022/TT-NHNN ngày 26/12/2022 của NHNN v/v sửa đổi một số điều của Thông tư 09 Khoản 1 Điều 1 Thông tư 18"}, {"id": "TD.08.038", "q": "Theo quy định tại Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 về quy định về hoạt động cho vay của TCTD, chi nhánh ngân hàng nước ngoài, đối với khách hàng, điều nào là quy định bắt buộc khi TCTD, chi nhánh ngân hàng nước ngoài xem xét giảm miễn lãi cho khách hàng:", "o": ["TCTD, chi nhánh ngân hàng nước ngoài xem xét giảm, miễn lãi vốn vay đối với khách hàng bị tổn thất về tài sản", "TCTD, chi nhánh ngân hàng nước ngoài xem xét giảm, miễn lãi vốn vay đối với khách hàng bị tổn thất về tài sản dẫn đến khó khăn về tài chính 22", "TCTD, chi nhánh ngân hàng nước ngoài xem xét giảm, miễn lãi vốn vay đối với khách hàng bị tổn thất về tài sản liên quan đến vốn vay dẫn đến bị khó khăn về tài chính", "TCTD có toàn quyền quyết định miễn, giảm lãi tiền vay, phí cho khách hàng theo quy định nội bộ của TCTD"], "a": 3, "g": "Thông tư số 39/2016/TT-NHNN - Điều 21"}, {"id": "TD.08.039", "q": "Theo quy định tại Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 quy định về hoạt động cho vay của TCTD, chi nhánh ngân hàng nước ngoài, đối với khách hàng, TCTD không được giảm, miễn lãi vốn vay đối với khách hàng nào sau đây:", "o": ["Tổ chức kiểm toán, kiểm toán viên đang kiểm toán tại TCTD", "Thanh tra viên đang thanh tra tại TCTD", "Cổ đông sở hữu trên 10% vốn điều lệ của TCTD", "Không đáp án nào đúng"], "a": 3, "g": "Thông tư số 39/2016/TT-NHNN - Điều 21"}, {"id": "TD.08.042", "q": "Theo quy định tại Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 về quy định về hoạt động cho vay của TCTD, chi nhánh ngân hàng nước ngoài và các văn bản sửa, đổi bổ sung, trường hợp khách hàng không trả đúng hạn tiền lãi theo quy định, thì phải trả lãi chậm trả tính trên số dư lãi chậm trả tương ứng với thời gian chậm trả theo mức lãi suất tối đa là bao nhiêu?", "o": ["5%/năm", "10%/năm", "15%/năm", "Tùy theo thỏa thuận của TCTD và khách hàng, không có mức tối đa"], "a": 1, "g": "Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 quy định về hoạt động cho vay - Điều 13"}, {"id": "TD.08.043", "q": "Theo quy định tại Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 về quy định về hoạt động cho vay của TCTD, chi nhánh ngân hàng nước ngoài và các văn bản sửa, đổi bổ sung, trường hợp khoản nợ vay bị chuyển nợ quá hạn, thì khách hàng phải trả lãi trên dư nợ gốc bị quá hạn tương ứng với thời gian chậm trả với mức lãi suất tối đa là bao nhiêu?", "o": ["150% lãi suất cho vay trong hạn tại thời điểm ký kết hợp đồng tín dụng", "200% lãi suất cho vay trong hạn tại thời điểm chuyển nợ quá hạn", "150% lãi suất cho vay trong hạn tại thời điểm chuyển nợ quá hạn", "Tùy theo thỏa thuận của TCTD và khách hàng, không có mức tối đa"], "a": 2, "g": "Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 quy định về hoạt động cho vay - Điều 13"}, {"id": "TD.08.045", "q": "Theo quy định tại Thông tư 18/2024/TT-NHNN ngày 28/06/2024 của Ngân hàng Nhà nước Việt Nam quy định về hoạt động thẻ ngân hàng, việc TCTD giảm, miễn lãi đổi với khách hàng thẻ tín dụng được thực hiện", "o": ["Theo quy định của các TCTD", "Theo thỏa thuận giữa TCTD và khách hàng", "A và B", "Chưa có quy định cụ thể"], "a": 3, "g": "Thông tư 18/2024/TT-NHNN ngày 28/06/2024 của Ngân hàng Nhà nước Việt Nam quy định về hoạt động thẻ ngân hàng - không có quy định"}, {"id": "TD.08.046", "q": "Theo quy định tại Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 về quy định về hoạt động cho vay của TCTD, định nghĩa \"khách hàng\" bao gồm:", "o": ["Khách hàng pháp nhân và khách hàng cá nhân", "Khách hàng tổ chức và khách hàng cá nhân", "Khách hàng tổ chức, doanh nghiệp tư nhân và khách hàng cá nhân", "Không có đáp án nào đúng"], "a": 0, "g": "Thông tư số 39/2016/TT-NHNN ngày 30/12/2016 quy định về hoạt động cho vay - Điều 2"}, {"id": "TD.08.048", "q": "Thông tư 83/2025/TT-NHNN ngày 31/12/2025 của Ngân hàng nhà nước quy định về hệ thống kiểm soát nội bộ của ngân hàng thương mại, chi nhánh ngân hàng nước ngoài, nội dung nào phải có trong Báo cáo nội bộ về rủi ro tín dụng của ngân hàng thương mại, chi nhánh ngân hàng nước ngoài:", "o": ["Khoản cấp tín dụng có vấn đề, các biện pháp xử lý khoản cấp tín dụng có vấn đề", "Chất lượng tín dụng đối với các khoản cấp tín dụng, danh mục cấp tín dụng theo đối tượng khách hàng, ngành kinh tế", "Tình hình trích lập dự phòng rủi ro, sử dụng dự phòng rủi ro để xử lý rủi ro tín dụng", "Tất cả các đáp án trên"], "a": 3, "g": "Thông tư 83/2025/TT-NHNN - Điều 34"}, {"id": "TD.08.049", "q": "Thông tư 83/2025/TT-NHNN ngày 31/12/2025 của Ngân hàng nhà nước quy định về hệ thống kiểm soát nội bộ của ngân hàng thương mại, chi nhánh ngân hàng nước ngoài quy định việc quản lý khoản cấp tín dụng có vấn đề tối thiểu bao gồm:", "o": ["- Có quy định nội bộ quy định rõ tiêu chí, phương pháp để xác định khoản cấp tín dụng có vấn đề; - Tăng cường đánh giá khả năng trả nợ của khách hàng, khả năng thu hồi nợ từ các biện pháp bảo đảm; - Có biện pháp xử lý, cơ cấu lại đối với các khoản cấp tín dụng có vấn đề, kế hoạch thu hồi nợ", "- Tăng cường theo dõi, giám sát, thu hồi nợ; - Xác định trách nhiệm để có biện pháp xử lý cá nhân, bộ phận liên quan đến khoản nợ xấu (nếu có)", "A và B", "Các đáp án trên đều sai"], "a": 2, "g": "Thông tư 83/2025/TT-NHNN - Điều 32"}, {"id": "TD.08.051", "q": "Thông tư 83/2025/TT-NHNN ngày 31/12/2025 của Ngân hàng nhà nước quy định về hệ thống kiểm soát nội bộ của ngân hàng thương mại, chi nhánh ngân hàng nước ngoài quy định Ngân hàng thực hiện thẩm định tín dụng đảm bảo tối thiểu bao gồm:", "o": ["- Thẩm định khả năng đáp ứng các điều kiện để khách hàng được cấp tín dụng; - Xác định người có liên quan của khách hàng thuộc đối tượng phải cung cấp thông tin người có liên quan theo quy định của pháp luật về cấp tín dụng; tổng mức dư nợ cấp tín dụng (bao gồm cả mức dư nợ cấp tín dụng mà khách hàng đang đề nghị) của khách hàng, khách hàng và người có liên quan của khách hàng thuộc đối tượng phải cung cấp thông tin người có liên quan theo quy định của pháp luật về cấp tín dụng", "- Việc sử dụng kết quả xếp hạng khách hàng, bao gồm cả xếp hạng tại các tổ chức tín dụng, chi nhánh ngân hàng nước ngoài khác (nếu có). - Đánh giá tính đầy đủ về hồ sơ, tình trạng pháp lý của tài sản bảo đảm và khả năng thu hồi nợ từ việc xử lý tài sản bảo đảm đối với trường hợp cấp tín dụng có tài sản bảo đảm. - Thẩm định khả năng thực hiện các nghĩa vụ cam kết của bên bảo lãnh đối với các khoản cấp tín dụng có bảo lãnh", "A và B", "Các đáp án trên đều sai"], "a": 2, "g": "Thông tư 83/2025/TT-NHNN - Điều 29"}, {"id": "TD.09.001", "q": "Theo Công văn số 11410/VCB-PTSPBL ngày 28/06/2024 v/v Bộ điều kiện tín dụng tối thiểu áp dụng với các sản phẩm tài trợ vốn lưu động dành cho Khách hàng tổ chức bán lẻ, cổ đông/thành viên góp vốn chính của Khách hàng là ai?", "o": ["Là bất kỳ cổ đông/thành viên góp vốn nào sở hữu từ 25% vốn điều lệ của Khách hàng trở lên.", "Là cổ đông/thành viên góp vốn sở hữu từ 51% vốn điều lệ của Khách hàng trở lên.", "Là cổ đông/thành viên góp vốn chiếm tỷ trọng lớn nhất trong cơ cấu vốn điều lệ của Khách hàng.", "Không có đáp án đúng."], "a": 0, "g": "Mục 1.2, Phụ lục 01, Công văn số 11410/VCB-PTSPBL ngày 28/06/2024 v/v Bộ điều kiện tín dụng tối thiểu áp dụng với các sản phẩm tài trợ vốn lưu động dành cho Khách hàng tổ chức bán lẻ -"}, {"id": "TD.09.002", "q": "Theo Công văn số 11410/VCB-PTSPBL ngày 28/06/2024 v/v Bộ điều kiện tín dụng tối thiểu áp dụng với các sản phẩm tài trợ vốn lưu động dành cho Khách hàng tổ chức bán lẻ, lĩnh vực kinh doanh chính của Khách hàng là gì?", "o": ["Là lĩnh vực kinh doanh đóng góp từ 50% doanh thu trở lên.", "Là lĩnh vực kinh doanh đóng góp từ 40% doanh thu trở lên và/hoặc có tỷ lệ doanh thu cao nhất trong tổng doanh thu năm gần nhất của Khách hàng.", "Là lĩnh vực kinh doanh có tỷ lệ doanh thu cao nhất trong tổng doanh thu năm gần nhất của Khách hàng.", "Là lĩnh vực kinh doanh chính được ghi trong Giấy chứng nhận đăng ký kinh doanh của Khách hàng."], "a": 1, "g": "Mục 1.10, Phụ lục 1, Công văn số 11410/VCB-PTSPBL ngày 28/06/2024 v/v Bộ điều kiện tín dụng tối thiểu áp dụng với các sản phẩm tài trợ vốn lưu động dành cho Khách hàng tổ chức bán lẻ"}, {"id": "TD.09.003", "q": "Có thể xem xét cho vay Khách hàng theo sản phẩm Tài trợ vốn lưu động đối với Khách hàng tổ chức bán lẻ ban hành theo Quyết định 2529/QĐ-VCB-PTSPBL ngày 24/12/2024 trong các trường hợp nào sau đây:", "o": ["Lĩnh vực kinh doanh chính của Khách hàng thuộc ngành/tiểu ngành mà Vietcombank đã xây dựng quy định sản phẩm riêng nhưng cấp thẩm quyền phê duyệt tín dụng quyết định không áp dụng quy định sản phẩm riêng đó.", "Lĩnh vực kinh doanh chính của Khách hàng thuộc ngành/tiểu ngành mà Vietcombank đã xây dựng quy định sản phẩm riêng nhưng Khách hàng không đáp ứng quy định sản phẩm riêng đó.", "Lĩnh vực kinh doanh chính của Khách hàng không thuộc ngành/tiểu ngành mà Vietcombank đã xây dựng quy định sản phẩm riêng.", "A và C"], "a": 2, "g": "Mục 2.1, Phụ lục 1, Sản phẩm Tài trợ vốn lưu động đối với Khách hàng tổ chức bán lẻ ban hành theo Quyết định 2529/QĐ-VCB-PTSPBL ngày 24/12/2024"}, {"id": "TD.09.004", "q": "Theo Sản phẩm Tài trợ Khách hàng tổ chức bán lẻ ngành thương mại thực phẩm, đồ uống bao gói sẵn ban hành theo Quyết định 2532/QĐ-VCB-PTSPBL ngày 24/12/2024, quy định về thời gian hoạt động của Khách hàng như thế nào (Khách hàng không thuộc chuỗi ngành thương mại thực phẩm, đồ uống bao gói sẵn và khoản cấp tín dụng không được bảo đảm đầy đủ bằng tài sản có tính thanh khoản cao)?", "o": ["Khách hàng đã hoạt động trong lĩnh vực thương mại thực phẩm, đồ uống bao gói sẵn tối thiểu 01 năm liên tục tính đến thời điểm thẩm định, đề xuất cấp tín dụng theo Sản phẩm.", "Trường hợp Khách hàng chuyển đổi từ hộ kinh doanh/doanh nghiệp tư nhân: tổng thời gian hoạt động của Khách hàng và hộ kinh doanh/doanh nghiệp tư nhân trong lĩnh vực thương mại thực phẩm, đồ uống bao gói sẵn tối thiểu 01 năm liên tục tính đến thời điểm thẩm định, đề xuất cấp tín dụng theo Sản phẩm.", "Trường hợp cổ đông/thành viên góp vốn chính của Khách hàng có kinh nghiệm trong lĩnh vực thương mại thực phẩm, đồ uống bao gói sẵn: tổng thời gian hoạt động của Khách hàng và cổ đông/thành viên góp vốn chính của Khách hàng trong lĩnh vực thương mại thực phẩm, đồ uống bao gói sẵn tối thiểu 01 năm liên tục tính đến thời điểm thẩm định, đề xuất cấp tín dụng theo Sản phẩm.", "A và B và C."], "a": 3, "g": "Mục 3.2.2, Phụ lục 1, Sản phẩm Tài trợ Khách hàng tổ chức bán lẻ ngành thương mại thực phẩm, đồ uống bao gói sẵn ban hành theo Quyết định 2532/QĐ-VCB-PTSPBL ngày 24/12/2024"}, {"id": "TD.09.005", "q": "Theo Sản phẩm Tài trợ Khách hàng tổ chức bán lẻ ngành thương mại dược ban hành theo Quyết định 2531/QĐ-VCB-PTSPBL ngày 24/12/2024, quy định về thời hạn cho vay của mỗi khoản giải ngân (đối với cho vay theo hạn mức) như thế nào?", "o": ["Thời hạn cho vay phù hợp với dòng tiền của phương án vay vốn/thời gian 1 vòng quay vốn lưu động của KH nhưng không vượt quá 3 tháng.", "Thời hạn cho vay phù hợp với dòng tiền của phương án vay vốn/thời gian 1 vòng quay vốn lưu động của KH nhưng không vượt quá 6 tháng.", "Thời hạn cho vay phù hợp với dòng tiền của phương án vay vốn/thời gian 1 vòng quay vốn lưu động của KH nhưng không vượt quá 9 tháng.", "Thời hạn cho vay phù hợp với dòng tiền của phương án vay vốn/thời gian 1 vòng quay vốn lưu động của KH nhưng không vượt quá 12 tháng."], "a": 2, "g": "Mục 9, Phụ lục 1, Sản phẩm Tài trợ Khách hàng tổ chức bán lẻ ngành thương mại dược ban hành theo Quyết định 2531/QĐ-VCB-PTSPBL ngày 24/12/2024"}, {"id": "TD.09.006", "q": "Theo quy định của VCB, Chi nhánh đánh giá lại khả năng trả nợ của Khách hàng và thực hiện các biện pháp xử lý (điều chỉnh giảm hạn mức vay, yêu cầu bổ sung biện pháp bảo đảm, thu nợ trước hạn…) trong trường hợp nào sau đây:", "o": ["Khách hàng vay tín chấp theo lương dừng nhận lương qua TKTT tại VCB", "Khách hàng vay tín chấp theo lương bị giảm thu nhập so với thời điểm thẩm định và đề xuất cho vay", "Khách hàng vay tín chấp theo lương phát sinh nợ nhóm 2 tại TCTD khác", "Cả 3 phương án trên"], "a": 3, "g": "Điều 16, phụ lục 1, Bộ Sản phẩm cho vay tín chấp theo lương, QĐ 727/QĐ-VCB-PTSPBL ngày 08/04/2025"}, {"id": "TD.09.008", "q": "Đối với phương thức cho vay theo hạn mức thấu chi dành cho KHCN của VCB, nhận định nào sau đây là sai?", "o": ["Khách hàng không được thấu chi bằng tiền mặt dưới bất kỳ hình thức nào", "Số tiền sử dụng hạn mức thấu chi được chuyển khoản vào tài khoản thanh toán của bên thụ hưởng", "Khách hàng được hưởng lãi tiền gửi theo quy định về lãi tiền gửi của VCB theo số dư khả dụng (bao gồm hạn mức thấu chi và số dư có của khách hàng)", "Lãi vay thấu chi được tính cộng dồn trên số tiền thấu chi ghi nhận trên tài khoản tiền vay, lãi suất cho vay thấu chi, số ngày vay thấu chi thực tế"], "a": 2, "g": "Khoản 6 Phụ lục 1 QĐ 1554/QĐ-VCB-CSSPBL ngày 18/08/2020"}, {"id": "TD.09.009", "q": "Đối với phương thức cho vay theo hạn mức thấu chi dành cho KHCN của VCB, điều kiện nào sau đây không phải là điều kiện đối với tài khoản thấu chi:", "o": ["Tài khoản thấu chi không thuộc loại tài khoản chung", "Tài khoản thấu chi của khách hàng không được cài đặt để thu nợ tự động thanh toán thẻ tín dụng", "Tài khoản thấu chi không thuộc loại tài khoản chỉ ghi có", "Tài khoản thấu chi không thuộc loại tài khoản mở thông qua người giám hộ"], "a": 1, "g": "Khoản 7 Phụ lục 1 QĐ 1554/QĐ-VCB-CSSPBL ngày 18/08/2020; QĐ 1788/QĐ-VCB-PTSPBL ngày 31/8/2023"}, {"id": "TD.09.011", "q": "Theo quy định của Bộ luật Dân sự năm 2015, tài sản dùng để bảo đảm thực hiện nghĩa vụ phải đáp ứng điều kiện nào sau đây?", "o": ["Phải là bất động sản", "Phải thuộc quyền sở hữu của bên bảo đảm, trừ trường hợp cầm giữ tài sản, bảo lưu quyền sở hữu", "Phải có giấy chứng nhận quyền sở hữu hoặc quyền sử dụng", "Phải được định giá bởi tổ chức thẩm định giá độc lập"], "a": 1, "g": "Điều 295 Bộ luật Dân sự năm 2015"}, {"id": "TD.09.012", "q": "Theo khoản 2 Điều 15 Thông tư 83/2025/TT-NHNN ngày 31/12/2025 quy định về hệ thống kiếm soát nội bộ của NHTM, Chi nhánh NHNNg, Để kiểm soát xung đột lợi ích (trừ hoạt động CTD bằng phương tiện điện tử), cá nhân hoặc bộ phận có chức năng thẩm định tín dụng phải độc lập với cá nhân hoặc bộ phận có chức năng nào sau đây?", "o": ["(i) Phê duyệt quyết định cấp tín dụng; (ii) Quản trị rủi ro hoạt động.", "(i) Quản lý khoản cấp tín dụng có vấn đề; (ii) Kiểm toán nội bộ", "(i) Phê duyệt quyết định cấp tín dụng; (ii) Quan hệ khách hàng theo quy định nội bộ của ngân hàng.", "(i) Quan hệ khách hàng; (ii) Quản trị rủi ro hoạt động"], "a": 2, "g": "Khoản 2 Điều 15 Thông tư 83/2025/TT-NHNN"}, {"id": "TD.09.013", "q": "Theo QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ Giải ngân trực tuyến dành cho KHCN, Bộ phận nào có trách nhiệm kiểm tra chữ ký số trên Giấy nhận nợ?", "o": ["Bộ phận Khách hàng", "Bộ phận Dịch vụ Khách hàng", "Cấp thẩm quyền phê duyệt khoản giải ngân", "Bộ phận Quản lý nợ"], "a": 3, "g": "Khoản 10.1, Điều 10, QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ GNTT dành cho KHCN"}, {"id": "TD.09.014", "q": "Theo QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ Giải ngân trực tuyến dành cho KHCN, điều kiện nào sau đây không do Hệ thống GNTT tự động kiểm tra, sàng lọc?", "o": ["Phân loại nợ Nhóm 1 tại VCB và/hoặc các TCTD khác (nếu có) tại thời điểm giải ngân.", "Mục đích cho vay từng lần giải ngân phù hợp với quy định tại Hợp đồng tín dụng", "Khoản cấp tín dụng được khởi tạo, phê duyệt trên hệ thống RLOS", "Hợp đồng cho vay còn hiệu lực giải ngân."], "a": 1, "g": "Điều 7, QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ GNTT dành cho KHCN"}, {"id": "TD.09.015", "q": "Theo QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ Giải ngân trực tuyến dành cho KHCN, mục đích nào sau đây không thuộc phạm vi giải ngân trực tuyến đối với khoản vay ngắn hạn phục vụ sản xuất kinh doanh?", "o": ["Thanh toán hóa đơn điện nước phục vụ SXKD &", "Thanh toán tiền lương, tiền công cho người lao động.", "Thanh toán tiền thuê địa điểm kinh doanh trong ngắn hạn.", "Thanh toán tiền mua nguyên vật liệu cho nhà cung cấp trong nước."], "a": 0, "g": "Khoản 7.4.1, điều 7, QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ GNTT dành cho KHCN"}, {"id": "TD.09.016", "q": "Theo Quyết định 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ Giải ngân trực tuyến dành cho KHCN, phát biểu nào sau đây đúng về Thông báo tác nghiệp đối với khoản giải ngân trực tuyến?", "o": ["Chi nhánh lập, in và ký tay Thông báo tác nghiệp theo Quy trình tín dụng hiện hành", "Chi nhánh không phải lập, và lưu trữ bản giấy Thông báo tác nghiệp; khi có nhu cầu có thể chiết xuất và in Thông báo tác nghiệp giải ngân trực tuyến từ Hệ thống", "Hệ thống hỗ trợ chiết xuất mẫu Thông báo tác nghiệp, Chi nhánh phải in ra, ký tay và lưu hồ sơ giấy", "Hệ thống hỗ trợ chiết xuất mẫu Thông báo tác nghiệp, Chi nhánh phải in ra và lưu hồ sơ giấy"], "a": 1, "g": "Khoản 6.9 điều 6 và Phụ lục 02, QĐ 1250/QĐ-VCB ngày 23/6/2026 về Quy định dịch vụ GNTT dành cho KHCN"}, {"id": "TD.09.027", "q": "Chi nhánh Vietcombank đang xem xét đề nghị vay vốn của Khách hàng A để phục vụ hoạt động Sản xuất kinh doanh hàng tạp hóa của Hộ kinh doanh A theo sản phẩm Kinh doanh tài lộc. Theo bạn đề xuất cho vay Khách hàng A của Chi nhánh với thời hạn duy trì hạn mức 24 tháng và số tiền vay 6 tỷ đồng có phù hợp không? chọn đáp án đúng nhất", "o": ["Không phù hợp do thời gian duy trì hạn mức tối đa tại Sản phẩm là 12 tháng", "Không phù hợp do không đáp ứng điều kiện tổng giá trị cấp tín dụng của khách hàng tại VCB để phục vụ hoạt động sản xuất kinh doanh của Hộ kinh doanh tối đa 5 tỷ đồng.", "Không phù hợp do không đáp ứng điều kiện về ngành nghề kinh doanh", "Phù hợp do Sản phẩm không có quy định cụ thể về nội dung này"], "a": 1, "g": "Khoản 9.1.1 Điều 9 QĐ 1167/QĐ-VCB-PTSPBL ngày 28/6/2024 v/v sửa đổi QĐ 2876/QĐ-VCB-PTSPBL ngày 27/12/2023"}, {"id": "TD.09.028", "q": "Theo Sản phẩm cho Khách hàng cá nhân vay mua ô tô tại đối tác theo QĐ 1123/QĐ-VCB-PTSPBL ngày 28/6/2024, Mức cấp tín dụng tối đa trên giá trị TSBĐ (BoA) đối với trường hợp TSBĐ là Tài sản hình thành từ vốn vay có xuất xứ thương hiệu từ Hàn Quốc là bao nhiêu?", "o": ["0.7", "0.75", "0.8", "0.6"], "a": 2, "g": "Điều 5 Mục III Phụ lục QĐ 1123/QĐ-VCB-PTSPBL ngày 28/6/2024"}, {"id": "TD.09.029", "q": "Thời hạn cho vay tối đa trong trường hợp Khách hàng vay khoản vay thuộc thẩm quyền quyết định là lãnh đạo phòng PDTD với mục đích vay bù đắp tài chính nhằm thực hiện phương án đầu tư/phương án hoạt động sản xuất kinh doanh trung, dài hạn theo CV 10715/VCB-PTSPBL ngày 05/06/2025?", "o": ["Tối đa không quá 60 tháng kể từ ngày phát sinh chi phí hình thành nên tài sản thuộc phương án vay bù đắp đến thời điểm VCB giải ngân vốn vay bù đắp", "Tối đa không quá 36 tháng kể từ ngày phát sinh chi phí hình thành nên tài sản thuộc phương án vay bù đắp đến thời điểm VCB giải ngân vốn vay bù đắp", "Tối đa không quá 24 tháng kể từ ngày phát sinh chi phí hình thành nên tài sản thuộc phương án vay bù đắp đến thời điểm VCB giải ngân vốn vay bù đắp", "Tối đa không quá 12 tháng kể từ ngày phát sinh chi phí hình thành nên tài sản thuộc phương án vay bù đắp đến thời điểm VCB giải ngân vốn vay bù đắp"], "a": 0, "g": "Mục 3.2 Phần A CV 10715/VCB-PTSPBL ngày 05/06/2025"}, {"id": "TD.09.030", "q": "Khách hàng A có nhu cầu vay số tiền 10 tỷ thuộc thẩm quyền quyết định của Chi nhánh đồng để bù đắp tài chính phục vụ hoạt động sản xuất kinh doanh theo CV 10715/VCB-PTSPBL ngày 05/06/2025, những mục đích sau đây là hợp lệ? Chọn đáp án chính xác nhất", "o": ["- Xây mới, thuê địa điểm kinh doanh để phục vụ hoạt động sản xuất kinh doanh của cá nhân tự kinh doanh/Hộ kinh doanh/Doanh nghiệp tư nhân. - Mua địa điểm kinh doanh là nhà xưởng,cửa hàng, sạp hàng - Mua sắm Tài sản cố định để phục vụ hoạt động Sản xuất kinh doanh.", "- Xây mới, thuê địa điểm kinh doanh để phục vụ hoạt động sản xuất kinh doanh của cá nhân tự kinh doanh/Hộ kinh doanh/Doanh nghiệp tư nhân. - Mua địa điểm kinh doanh là nhà xưởng,cửa hàng, sạp hàng - Vốn lưu động trung dài hạn", "- Xây mới, thuê địa điểm kinh doanh để phục vụ hoạt động sản xuất kinh doanh của cá nhân tự kinh doanh/Hộ kinh doanh/Doanh nghiệp tư nhân. - Mua sắm Tài sản cố định để phục vụ hoạt động sản xuất kinh doanh", "- Xây mới, thuê địa điểm kinh doanh để phục vụ hoạt động sản xuất kinh doanh của cá nhân tự kinh doanh/Hộ kinh doanh/Doanh nghiệp tư nhân. - Mua địa điểm kinh doanh là nhà xưởng,cửa hàng, sạp hàng. - Mua sắm Tài sản cố định để phục vụ hoạt động sản xuất kinh doanh. - Vốn lưu động trung dài hạn"], "a": 0, "g": "Mục 2 Phụ lục B.2 Phần B CV 10715/VCB-PTSPBL ngày 05/06/2025"}, {"id": "TD.09.031", "q": "Theo sản phẩm cho vay bù đắp cho Khách hàng cá nhân theo CV 10715/VCB-PTSPBL ngày 05/06/2025: Các Sản phẩm tín dụng cho vay Khách hàng cá nhân nào không cho phép mục đích vay vốn bù đắp", "o": ["Sản phẩm Cho vay Khách hàng cá nhân mua nhà dự án Vingroup theo QĐ 1459/QĐ-VCB-PTSPBL ngày 07/07/2025 và các văn bản điều chỉnh/bổ sung có liên quan", "Sản phẩm Cho vay Khách hàng cá nhân nhận chuyển nhượng quyền sử dụng đất ở theo QĐ 2264/QĐ-VCB-PTSPBL ngày 08/10/2025 và các văn bản điều chỉnh/bổ sung có liên quan", "Sản phẩm Cho vay Khách hàng cá nhân xây sửa nhà ở theo QĐ 1291/QĐ-VCB-PTSPBL ngày 30/06/2023 và các văn bản điều chỉnh/bổ sung có liên quan", "Sản phẩm Ngôi nhà đầu tiên cho Khách hàng trẻ theo QĐ 696/QĐ-VCB-PTSPBL ngày 15/04/2025 và các văn bản điều chỉnh/bổ sung có liên quan"], "a": 3, "g": "- Mục 6.1.1 - CV 10715/VCB-PTSPBL; - Quy định về Mục đích vay vốn tại Phụ lục 01 các QĐ 1459/QĐ-VCB-PTSPBL; QĐ 2264/QĐ-VCB-PTSPBL; QĐ 1291/QĐ-VCB-PTSPBL; QĐ 696//QĐ-VCB-PTSPBL)"}, {"id": "TD.09.032", "q": "Theo sản phẩm cho vay mua, xây sửa nhà ở kết hợp kinh doanh theo QĐ 355 ngày 28/02/2025, nguồn thu nhập từ sử dụng nhà để ở kết hợp kinh doanh của phương án vay vốn phải thỏa mãn điều kiện gì?", "o": ["Tỷ trọng nguồn thu nhập này trên tổng nguồn thu nhập để trả nợ khoản vay không quá 50%", "Tỷ trọng nguồn thu nhập này trên tổng nguồn thu nhập để trả nợ khoản vay không quá 30%", "Tỷ trọng nguồn thu nhập này trên tổng nguồn thu nhập để trả nợ khoản vay chiếm tối thiểu 50%", "Tỷ trọng nguồn thu nhập này trên tổng nguồn thu nhập để trả nợ khoản vay chiếm tối thiểu 30%"], "a": 0, "g": "Mục B.I.1 - Phụ lục 1 - QĐ 355/QĐ-VCB-PTSPBL ngày 28/02/2025"}, {"id": "TD.09.033", "q": "Theo bộ điều kiện cho vay tối thiểu theo CV 2496/VCB-PTSPBL ngày 23/02/2024 (sửa đổi bởi CV 23662/VCB-PTSPBL ngày 27/12/2024), Bên bảo đảm bao gồm những ai?", "o": ["Khách hàng", "Bên thứ ba", "Riêng vợ/riêng chồng", "- KH và/hoặc Bên thứ ba - Riêng vợ/riêng chồng"], "a": 3, "g": "PL 01 mục I.4 CV 2496/VCB-PTSPBL ngày 23/02/2024 (sửa đổi bởi CV 23662/VCB-PTSPBL ngày 27/12/2024)"}, {"id": "TD.09.034", "q": "Theo quy định của VCB, Số tiền cho vay tối đa theo sản phẩm Thấu chi có TSBĐ đối với Khách hàng cá nhân là bao nhiêu?", "o": ["Tối đa 1 tỷ đồng/Khách hàng", "Tối đa 2 tỷ đồng/Khách hàng", "Tối đa 3 tỷ đồng/Khách hàng", "- Tối đa 2 tỷ đồng/Khách hàng - Đối với KH đặc thù (KH Payroll và cơ quan công tác của KH thuộc danh sách KHBB được phân hạng Kim Cương, Tiềm năng, Vàng, Bạc): tối đa 3 tỷ đồng/Khách hàng"], "a": 3, "g": "Điểm 6 Mục B.II Phụ lục 01 - Quyết định 241/QĐ-VCB-PTSPBL ngày 23/2/2024 (sửa đổi, bổ sung bởi QĐ 2492/QĐ-VCB-PTSPBL ngày 27/12/2024)"}, {"id": "TD.09.035", "q": "Số tiền cho vay tối đa theo sản phẩm Cho vay thấu chi có TSBĐ của VCB dành cho Lãnh đạo Doanh nghiệp/Cổ đông/Người có cổ phần vốn góp/Priority là bao nhiêu?", "o": ["Tối đa 5 tỷ đồng/Khách hàng", "Tối đa 10 tỷ đồng/Khách hàng", "Tối đa 15 tỷ đồng/Khách hàng", "Tối đa 20 tỷ đồng/Khách hàng"], "a": 2, "g": "Điểm 6 Mục B.III Phụ lục 01 - Quyết định 593/QĐ-VCB-PTSPBL ngày 28/3/2025"}, {"id": "TD.09.036", "q": "Hệ số trả nợ theo sản phẩm Cho vay thấu chi có TSBĐ của VCB dành cho Lãnh đạo Doanh nghiệp/ Cổ đông/Người có cổ phần vốn góp/Priority là bao nhiêu?", "o": ["Không áp dụng", "DTI tối đa 60%", "DTI tối đa 70%", "DTI tối đa 80%"], "a": 0, "g": "Điểm 8 Mục B.III Phụ lục 01 Quyết định 593/QĐ-VCB-PTSPBL ngày 28/3/2025"}, {"id": "TD.09.037", "q": "Theo Quyết định 1458/QĐ-VCB-PTSPBL ngày 7/7/2025 vv ban hành quy định về Sản phẩm cho vay mua, hoàn thiện nhà dự án dành cho Khách hàng cá nhân, nhà dự án thuộc phạm vi sản phẩm phải đáp ứng điều kiện nào sau đây?", "o": ["Là bất động sản để ở, thời hạn sử dụng lâu dài, thuộc dự án bất động sản đủ điều kiện đưa vào kinh doanh theo quy định pháp luật; bao gồm nhà đang hình thành trong tương lai hoặc nhà có sẵn đã nghiệm thu, bàn giao nhưng chưa nộp hồ sơ cấp Giấy chứng nhận.", "Là bất động sản để ở, thời hạn sử dụng lâu dài, thuộc dự án bất động sản đủ điều kiện đưa vào kinh doanh theo quy định pháp luật; bao gồm nhà đang hình thành trong tương lai,chưa được nghiệm thu hoặc bàn giao.", "Là bất động sản để ở, thời hạn sử dụng lâu dài, thuộc dự án bất động sản đủ điều kiện đưa vào kinh doanh theo quy định pháp luật; chỉ bao gồm nhà đang hình thành trong tương lai.", "Là bất động sản thuộc dự án bất động sản đủ điều kiện đưa vào kinh doanh theo quy định pháp luật; bao gồm nhà đang hình thành trong tương lai hoặc nhà có sẵn đã nghiệm thu, bàn giao nhưng chưa nộp hồ sơ cấp Giấy chứng nhận."], "a": 0, "g": "Theo Phần Quy định chung Điều 4 Điểm 2 Quyết định 1458/QĐ-VCB-PTSPBL ngày 7/7/2025,"}, {"id": "TD.09.038", "q": "Theo Quyết định 1458/QĐ-VCB-PTSPBL ngày 7/7/2025 vv ban hành quy định về Sản phẩm cho vay mua, hoàn thiện nhà dự án dành cho Khách hàng cá nhân, giá trị phương án vay vốn mua nhà được hiểu như thế nào?", "o": ["Là giá trị ghi trên Hợp đồng mua bán trực tiếp từ Chủ đầu tư", "Là tổng số tiền khách hàng đề nghị vay vốn, không phụ thuộc giá trị giao dịch thực tế.", "Là giá trị nêu tại phương án sử dụng vốn của Khách hàng, cụ thể: (i) giá trị ghi trên HĐMB nếu mua trực tiếp từ CĐT; và/hoặc (ii) giá trị ghi tại HĐCN HĐMB Nhà nếu mua lại từ Bên bán thứ cấp; và/hoặc (iii) giá trị để thực hiện Hoàn thiện Nhà theo các hồ sơ chứng minh và được VCB thẩm định và chấp thuận.", "Là giá trị nêu tại phương án sử dụng vốn của Khách hàng, cụ thể: (i) giá trị ghi trên HĐMB nếu mua trực tiếp từ CĐT; và/hoặc (ii) giá trị ghi tại HĐCN HĐMB Nhà nếu mua lại từ Bên bán thứ cấp theo các hồ sơ chứng minh và được VCB thẩm định và chấp thuận."], "a": 3, "g": "Điểm f khoản 2 Điều 4 Phần Quy định Quyết định 1458/QĐ-VCB-PTSPBL ngày 7/7/2025"}, {"id": "TD.09.039", "q": "Theo Quyết định 1458/QĐ-VCB-PTSPBL ngày 7/7/2025 vv ban hành quy định về Sản phẩm cho vay mua, hoàn thiện nhà dự án dành cho Khách hàng cá nhân, số tiền cho vay tối đa đối với mục đích vay thanh toán/bù đắp tiền hoàn thiện nhà là bao nhiêu?", "o": ["Đối với căn hộ chung cư: Tối đa 150 tỷ đồng tại dự án có vị trí tại Hà Nội, TP Hồ Chí Minh và các dự án được Thành viên Ban Điều hành phụ trách Khối Bán lẻ phê duyệt; hoặc Đối với nhà thấp tầng: Tối đa 200 tỷ đồng tại dự án có vị trí tại thành phố trực thuộc trung ương và các dự án được Thành viên Ban Điều hành phụ trách Khối Bán lẻ phê duyệt.", "Tối đa 50 tỷ đồng", "Tối đa 20 tỷ đồng", "Tối đa 200 tỷ đồng tại dự án có vị trí tại thành phố trực thuộc trung ương và các dự án được Thành viên Ban Điều hành phụ trách Khối Bán lẻ phê duyệt."], "a": 1, "g": "Theo Phụ lục 02.C. II.1.1 Quyết định 1458/QĐ-VCB-PTSPBL ngày 7/7/2025"}, {"id": "TD.09.040", "q": "Theo quy định tại Sản phẩm cho vay mua/ nhận chuyển nhượng Bất động sản thương mại dành cho Khách hàng cá nhân theo QĐ 2410/QĐ-VCB.PTSPBL ngày 19/12/2024, kỳ trả nợ gốc được quy định như thế nào?", "o": ["Phù hợp với nguồn trả nợ của Khách hàng nhưng chu kỳ trả nợ gốc là tròn tháng và không quá 03 tháng/lần", "06 tháng/lần phù hợp với nguồn trả nợ của Khách hàng", "Phù hợp với nguồn trả nợ của Khách hàng nhưng chu kỳ trả nợ gốc là tròn tháng và không quá 03 tháng/lần. Trường hợp khoản vay thuộc cấp thẩm quyền phê duyệt tín dụng từ chuyên gia phê duyệt cấp 3 trở lên:Cấp phê duyệt khoản vay xác định phù hợp với nguồn trả nợ nhưng chu kỳ trả nợ gốc là tròn tháng và không quá 06 tháng/lần", "Phù hợp với nguồn trả nợ của Khách hàng nhưng chu kỳ trả nợ gốc là tròn tháng và không quá 03 tháng/lần. Trường hợp khoản vay thuộc cấp thẩm quyền phê duyệt tín dụng từ chuyên gia phê duyệt cấp 3 trở lên: Cấp phê duyệt khoản vay xác định phù hợp với nguồn trả nợ nhưng chu kỳ trả nợ gốc là tròn tháng và không quá 06 tháng/lần. Đối với trường hợp thời gian vay vốn trên 30 năm, số tiền trả nợ Khách hàng phải trả trong 25 năm đầu tiên tối thiểu bằng 80% giá trị khoản vay"], "a": 0, "g": "Điều 10 phần II Phụ lục 01 QĐ 2410/QĐ-VCB.PTSPBL ngày 19/12/2024"}, {"id": "TD.10.001", "q": "Hình thức của thỏa thuận cho vay của tổ chức tín dụng đối với khách hàng", "o": ["Bằng lời nói", "Lập thành văn bản", "Bằng hành vi cụ thể", "Cả ba phương án trên đều đúng"], "a": 1, "g": "Khoản 1 Điều 23 Thông tư số 39/2016/TT-NHNN"}, {"id": "TD.10.002", "q": "Nội dung nào không phải nội dung tối thiểu phải có của thỏa thuận cho vay?", "o": ["Số tiền cho vay", "Biện pháp bảo đảm", "Thời hạn cho vay", "Mục đích sử dụng vốn vay"], "a": 1, "g": "Khoản 1 Điều 23 Thông tư số 39/2016/TT-NHNN"}, {"id": "TD.10.003", "q": "Tổ chức tín dụng có trách nhiệm cung cấp thông tin gì cho khách hàng trước khi xác lập thỏa thuận cho vay?", "o": ["Lãi suất cho vay; nguyên tắc và các yếu tố xác định, thời điểm xác định lãi suất cho vay đối với trường hợp áp dụng lãi suất cho vay có điều chỉnh; lãi suất áp dụng đối với dư nợ gốc bị quá hạn; lãi suất áp dụng đối với lãi chậm trả", "Phương pháp tính lãi tiền vay; loại phí và mức phí áp dụng đối với khoản vay", "Các tiêu chí xác định khách hàng vay vốn theo lãi suất cho vay quy định tại khoản 2 Điều 13 Thông tư 39/2016/TT-NHNN (quy định về lãi suất cho vay ngắn hạn bằng đồng Việt Nam ưu đãi nhằm đáp ứng một số nhu cầu vốn)", "Cả ba phương án trên đều đúng"], "a": 3, "g": "Điều 16 Thông tư số 39/2016/TT-NHNN"}, {"id": "TD.10.004", "q": "Đối tượng khách hàng nào được tổ chức tín dụng xem xét, quyết định cho vay?", "o": ["Pháp nhân có năng lực pháp luật dân sự theo quy định của pháp luật", "Cá nhân đủ 18 tuổi trở lên có năng lực hành vi dân sự đầy đủ theo quy định của pháp luật", "Cá nhân từ đủ 15 tuổi đến chưa đủ 18 tuổi không bị mất hoặc hạn chế năng lực hành vi dân sự theo quy định của pháp luật", "Cả ba phương án trên đều đúng"], "a": 3, "g": "Khoản 1 Điều 7 Thông tư số 39/2016/TT-NHNN"}, {"id": "TD.10.005", "q": "Thỏa thuận cho vay phải quy định nội dung gì liên quan đến lãi suất?", "o": ["Lãi suất cho vay theo thỏa thuận và mức lãi suất quy đổi theo tỷ lệ %/năm tính theo số dư nợ cho vay thực tế và thời gian duy trì số dư nợ cho vay thực tế đó", "Nguyên tắc và các yếu tố xác định lãi suất, thời điểm xác định lãi suất cho vay đối với trường hợp áp dụng lãi suất cho vay có điều chỉnh", "Lãi suất áp dụng đối với dư nợ gốc bị quá hạn; lãi suất áp dụng đối với lãi chậm trả; loại phí liên quan đến khoản vay và mức phí áp dụng", "Cả ba phương án trên đều đúng"], "a": 3, "g": "Điểm g khoản 1 Điều 23 Thông tư số 39/2016/TT-NHNN"}, {"id": "TD.10.006", "q": "Nội dung nào không bắt buộc phải có trong thỏa thuận cho vay?", "o": ["Xử lý nợ vay", "Phạt vi phạm", "Thời hạn ân hạn", "Bồi thường thiệt hại"], "a": 2, "g": "Khoản 1 Điều 23 Thông tư số 39/2016/TT-NHNN"}, {"id": "TD.10.007", "q": "Nhận định nào sau đây sai?", "o": ["Phụ lục hợp đồng có điều khoản trái với nội dung các điều khoản trong hợp đồng thì Phụ lục hợp đồng bị coi là vô hiệu", "Phụ lục hợp đồng có hiệu lực như hợp đồng.", "Nội dung của phụ lục hợp đồng không được trái với nội dung của hợp đồng.", "Hợp đồng có thể có phụ lục kèm theo để quy định chi tiết một số điều khoản của hợp đồng."], "a": 0, "g": "Khoản 2 Điều 403 Bộ luật dân sự"}, {"id": "TD.10.009", "q": "Hợp đồng nào không phải là hợp đồng bảo đảm?", "o": ["Hợp đồng cầm cố tài sản", "Hợp đồng mua bán tài sản có bảo lưu quyền sở hữu", "Thỏa thuận cấp bảo lãnh", "Hợp đồng ký quỹ"], "a": 2, "g": "Khoản 5 Điều 3 Nghị định số 21/2021/NĐ-CP"}, {"id": "TD.10.011", "q": "Lựa chọn đáp án phù hợp nhất về tài sản dùng để bảo đảm thực hiện nghĩa vụ là:", "o": ["Tài sản hiện có hoặc tài sản hình thành trong tương lai, trừ trường hợp Bộ luật Dân sự, luật khác liên quan cấm mua bán, cấm chuyển nhượng hoặc cấm chuyển giao khác về quyền sở hữu tại thời điểm xác lập hợp đồng bảo đảm, biện pháp bảo đảm.", "Tài sản bán trong hợp đồng mua bán tài sản có bảo lưu quyền sở hữu; Tài sản thuộc đối tượng của nghĩa vụ trong hợp đồng song vụ bị vi phạm đối với biện pháp cầm giữ.", "Tài sản thuộc sở hữu toàn dân trong trường hợp pháp luật liên quan có quy định.", "Cả 03 đáp án trên"], "a": 3, "g": "Điều 8 Nghị định số 21/2021/NĐ-CP"}, {"id": "TD.10.012", "q": "Hợp đồng bảo đảm được công chứng, chứng thực theo quy định của pháp luật có hiệu lực từ thời điểm nào?", "o": ["Từ thời điểm được công chứng, chứng thực", "Từ thời điểm ký kết", "Từ thời điểm tài sản bảo đảm hình thành trong tương lai đã hình thành", "Theo thỏa thuận của các bên"], "a": 0, "g": "Khoản 1 Điều 22 Nghị định số 21/2021/NĐ-CP"}, {"id": "TD.10.014", "q": "Nhận định nào sau đây về cầm cố tài sản là sai", "o": ["Cầm cố tài sản là việc một bên giao tài sản thuộc quyền sở hữu của mình cho bên kia để bảo đảm thực hiện nghĩa vụ", "Hợp đồng cầm cố tài sản có hiệu lực từ thời điểm giao kết, trừ trường hợp có thỏa thuận khác hoặc luật có quy định khác.", "Cầm cố tài sản có hiệu lực đối kháng với người thứ ba kể từ thời điểm bên nhận cầm cố nắm giữ tài sản cầm cố. Trường hợp bất động sản là đối tượng của cầm cố theo quy định của luật thì việc cầm cố bất động sản có hiệu lực đối kháng với người thứ ba kể từ thời điểm đăng ký.", "Cầm cố tài sản có hiệu lực đối kháng với người thứ ba kể từ thời điểm Hợp đồng cầm cố tài sản có hiệu lực."], "a": 3, "g": "Điều 309, 310 Bộ luật dân sự"}, {"id": "TD.10.015", "q": "Lựa chọn đáp án phù hợp nhất:", "o": ["Tài sản thế chấp do bên thế chấp giữ. Các bên có thể thỏa thuận giao cho người thứ ba giữ tài sản thế chấp", "Hợp đồng thế chấp tài sản có hiệu lực từ thời điểm giao kết, trừ trường hợp có thỏa thuận khác hoặc luật có quy định khác.", "Thế chấp tài sản phát sinh hiệu lực đối kháng với người thứ ba kể từ thời điểm đăng ký.", "Cả ba đáp án trên đều đúng."], "a": 3, "g": "Điều 317, 319 Bộ luật dân sự"}, {"id": "TD.10.018", "q": "Bên thế chấp có các quyền nào sau đây:", "o": ["Khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản thế chấp, trừ trường hợp hoa lợi, lợi tức cũng là tài sản thế chấp theo thỏa thuận.", "Đầu tư để làm tăng giá trị của tài sản thế chấp.", "Nhận lại tài sản thế chấp do người thứ ba giữ và giấy tờ liên quan đến tài sản thế chấp do bên nhận thế chấp giữ khi nghĩa vụ được bảo đảm bằng thế chấp chấm dứt hoặc được thay thế bằng biện pháp bảo đảm khác.", "Cả 03 đáp án trên."], "a": 3, "g": "Khoản 1, 2, 3 Điều 321 Bộ luật Dân sự."}, {"id": "TD.10.019", "q": "Văn bản thông báo về việc xử lý tài sản bảo đảm phải có nội dung chủ yếu nào sau đây:", "o": ["Lý do xử lý tài sản bảo đảm.", "Tài sản bảo đảm sẽ bị xử lý.", "Thời gian, địa điểm xử lý tài sản bảo đảm.", "Cả 03 đáp án trên."], "a": 3, "g": "Khoản 1 Điều 51 Nghị định số 21/2021/NĐ-CP"}, {"id": "TD.10.020", "q": "Lựa chọn đáp án đúng nhất về thời hạn ủy quyền trong hợp đồng ủy quyền theo quy định pháp luật:", "o": ["Thời hạn ủy quyền do các bên thỏa thuận hoặc do pháp luật quy định.", "Thời hạn ủy quyền do các bên thỏa thuận hoặc do pháp luật quy định; nếu không có thỏa thuận và pháp luật không có quy định thì hợp đồng ủy quyền có hiệu lực 01 năm, kể từ ngày xác lập việc ủy quyền.", "Thời hạn ủy quyền do các bên thỏa thuận.", "Thời hạn ủy quyền do pháp luật quy định."], "a": 1, "g": "Điều 563 Bộ luật dân sự"}, {"id": "TD.10.021", "q": "Bên được ủy quyền được ủy quyền lại cho người khác trong trường hợp nào?", "o": ["Có sự đồng ý của bên ủy quyền.", "Do sự kiện bất khả kháng nếu không áp dụng ủy quyền lại thì mục đích xác lập, thực hiện giao dịch dân sự vì lợi ích của người ủy quyền không thể thực hiện được.", "Cả A và B đều đúng.", "Cả A và B đều sai."], "a": 2, "g": "Khoản 1 Điều 564 Bộ luật dân sự"}, {"id": "TD.10.022", "q": "Nhận định nào sau đât đúng đối với \"Hình thức ủy quyền lại\"?", "o": ["Hình thức hợp đồng ủy quyền lại phải phù hợp với hình thức ủy quyền ban đầu.", "Hình thức hợp đồng ủy quyền lại theo thỏa thuận của các bên.", "Hợp đồng ủy quyền lại phải được công chứng.", "Hợp đồng ủy quyền lại phải được hợp pháp hóa lãnh sự."], "a": 0, "g": "Khoản 3 Điều 564 Bộ luật dân sự"}, {"id": "TD.10.023", "q": "Bên nhận bảo đảm có quyền và nghĩa vụ nào trong thời gian tài sản bảo đảm chưa bị xử lý?", "o": ["Bên nhận bảo đảm có trách nhiệm bảo quản, giữ gìn tài sản bảo đảm trong trường hợp giữ tài sản bảo đảm để xử lý.", "Trong thời gian chờ xử lý tài sản bảo đảm, bên nhận bảo đảm được khai thác, sử dụng tài sản bảo đảm hoặc cho phép bên bảo đảm hoặc ủy quyền cho người thứ ba khai thác, sử dụng tài sản bảo đảm theo đúng tính năng và công dụng của tài sản. Việc cho phép, ủy quyền hoặc xử lý hoa lợi, lợi tức phát sinh từ việc khai thác, sử dụng tài sản bảo đảm phải được lập thành văn bản.", "Hoa lợi, lợi tức phát sinh từ việc khai thác, sử dụng tài sản bảo đảm được dùng để thanh toán nghĩa vụ được bảo đảm cho bên nhận bảo đảm sau khi trừ các chi phí cần thiết cho việc khai thác, sử dụng tài sản.", "Cả 03 đáp án trên."], "a": 2, "g": "Điều 53 Nghị định 21/2021/NĐ-CP"}, {"id": "TD.10.026", "q": "Chọn đáp án đúng:", "o": ["Việc ủy quyền lại không được vượt quá phạm vi ủy quyền ban đầu", "Việc ủy quyền lại được vượt quá phạm vi ủy quyền ban đầu", "Phạm vi ủy quyền lại theo thỏa thuận của các bên, không phụ thuộc phạm vi ủy quyền ban đầu", "Cả ba phương án trên đều sai"], "a": 0, "g": "Khoản 2 Điều 564 Bộ luật dân sự"}, {"id": "TD.10.028", "q": "Trong trường hợp nào dưới đây cơ quan đăng ký không được từ chối đăng ký biện pháp bảo đảm:", "o": ["Không thuộc thẩm quyền của cơ quan đăng ký.", "Tên của hợp đồng bảo đảm không thể hiện tên tài sản nhận bảo đảm.", "Hồ sơ đăng ký không hợp lệ.", "Tài sản không đủ điều kiện dùng để bảo đảm thực hiện nghĩa vụ theo quy định của Luật Đất đai, Luật Nhà ở, luật khác có liên quan."], "a": 1, "g": "Điểm a, b, c Khoản 1 Điều 15 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.029", "q": "Trường hợp nào dưới đây không phải thực hiện đăng ký thay đổi:", "o": ["Thay đổi bên bảo đảm hoặc bên nhận bảo đảm do được rút bớt, được bổ sung, được thay thế, được kế thừa do pháp nhân được tổ chức lại, được thừa kế theo quy định của Bộ luật Dân sự", "Thay đổi tên hoặc họ, tên của bên bảo đảm", "Thay đổi tên hoặc họ, tên của bên được bảo đảm.", "Thay đổi tên hoặc họ, tên của bên nhận bảo đảm"], "a": 2, "g": "Điểm a Khoản 1 Điều 18 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.030", "q": "Theo quy định của pháp luật về đăng ký biện pháp bảo đảm, người yêu cầu đăng ký nộp hồ sơ đăng ký thay đổi khi nào?", "o": ["Bổ sung việc đăng ký đối với tài sản bảo đảm đã được thỏa thuận trong hợp đồng bảo đảm nhưng nội dung đã được đăng ký trước đó không bao gồm tài sản này", "Bổ sung tài sản mới, tài sản được thay thế mà tài sản này trở thành tài sản bảo đảm theo thỏa thuận trong văn bản thỏa thuận sửa đổi, bổ sung hợp đồng bảo đảm hoặc theo quy định của pháp luật và nội dung đã được đăng ký trước đó không bao gồm tài sản này", "Rút bớt tài sản bảo đảm", "Cả ba đáp án trên đều đúng"], "a": 3, "g": "Khoản 1 Điều 18 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.031", "q": "Theo quy định của pháp luật về đăng ký biện pháp bảo đảm, trường hợp nào không xóa đăng ký?", "o": ["Toàn bộ nghĩa vụ được bảo đảm bị chấm dứt", "Toàn bộ nội dung hoặc một phần nội dung hợp đồng bảo đảm bị hủy bỏ mà nội dung bị hủy bỏ có biện pháp bảo đảm đã được đăng ký", "Rút bớt tài sản bảo đảm", "Theo thỏa thuận giữa bên bảo đảm và bên nhận bảo đảm"], "a": 2, "g": "Khoản 1 Điều 20 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.032", "q": "Theo quy định của pháp luật về đăng ký biện pháp bảo đảm, việc hủy đăng ký được thực hiện trong trường hợp nào?", "o": ["Biện pháp bảo đảm đã được đăng ký mà cơ quan đăng ký nhận được bản án, quyết định của Tòa án có hiệu lực pháp luật có quyết định về việc đăng ký phải bị hủy toàn bộ hoặc một phần", "Biện pháp bảo đảm đã được đăng ký mà cơ quan đăng ký phát hiện thuộc trường hợp từ chối đăng ký", "Xử lý đăng ký trùng lặp", "Cả ba đáp án trên đều đúng"], "a": 3, "g": "Khoản 1 Điều 21 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.034", "q": "Người yêu cầu đăng ký có thể nộp đồng thời hồ sơ đăng ký biện pháp bảo đảm với hồ sơ đăng ký biến động đất đai, tài sản gắn liền với đất hoặc thực hiện đăng ký biến động đất đai, tài sản gắn liền với đất trước khi đăng ký biện pháp bảo đảm trong trường hợp có sự thay đổi thông tin sau đây:", "o": ["Thay đổi về số hiệu tờ bản đồ, số hiệu thửa đất, địa chỉ thửa đất không phù hợp với thông tin trên Giấy chứng nhận do sắp xếp lại các đơn vị hành chính, dồn điền đổi thửa, đo đạc xác định lại hình dạng, kích thước, diện tích thửa đất", "Thay đổi hiện trạng về loại nhà (hoặc loại công trình xây dựng), tên tòa nhà (hoặc tên công trình xây dựng), số tầng hoặc thông tin về tài sản khác gắn liền với đất dẫn đến không còn phù hợp với thông tin trên Giấy chứng nhận", "Thay đổi thông tin về tên hoặc họ, tên của bên bảo đảm, bao gồm cả thay đổi do có văn bản của cơ quan có thẩm quyền", "Cả ba đáp án trên đều đúng"], "a": 3, "g": "Khoản 1 Điều 36 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.035", "q": "Trường hợp nào sau đây, ngoài việc đăng ký thay đổi, người yêu cầu đăng ký còn có thể đề nghị được đăng ký biện pháp bảo đảm mới thay cho việc đăng ký thay đổi:", "o": ["Rút bớt tài sản bảo đảm.", "Bổ sung nghĩa vụ được bảo đảm trong trường hợp hợp đồng bảo đảm ban đầu không có nội dung về việc bảo đảm cho nghĩa vụ trong tương lai.", "Chỉnh lý thông tin có sai sót trong nội dung đã được kê khai trên Phiếu yêu cầu đăng ký do lỗi của người yêu cầu đăng ký.", "Thay đổi bên bảo đảm hoặc bên nhận bảo đảm do được rút bớt, được bổ sung, được thay thế, được kế thừa do pháp nhân được tổ chức lại, được thừa kế theo quy định của Bộ luật Dân sự"], "a": 1, "g": "Khoản 1 Điều 18 Nghị định số 99/2022/NĐ-CP"}, {"id": "TD.10.037", "q": "Theo quy định của Thông tư 39/2016/TT-NHNN (đã sửa đổi, bổ sung), phương án sử dụng vốn phải có các thông tin nào?", "o": ["Tổng nguồn vốn cần sử dụng, chi tiết các loại nguồn vốn trong tổng nguồn vốn cần sử dụng (trong đó có nguồn vốn cần vay tại tổ chức tín dụng); mục đích sử dụng vốn; thời gian sử dụng vốn.", "Nguồn trả nợ của khách hàng.", "Phương án, dự án thực hiện hoạt động kinh doanh hoặc phương án, dự án phục vụ nhu cầu đời sống để mua nhà ở; xây dựng, cải tạo nhà ở; nhận chuyển nhượng quyền sử dụng đất để xây nhà ở.", "Cả ba đáp án trên đều đúng"], "a": 3, "g": "Khoản 6 Điều 2 Thông tư số 39/2016/TT-NHNN (đã sửa đổi, bổ sung)"}, {"id": "TD.10.038", "q": "Theo quy định của Thông tư 39/2016/TT-NHNN (đã sửa đổi, bổ sung), tổ chức tín dụng xem xét cho vay khi khách hàng đáp ứng điều kiện:", "o": ["Khách hàng là pháp nhân có năng lực pháp luật dân sự theo quy định của pháp luật. Khách hàng là cá nhân từ đủ 18 tuổi trở lên có năng lực hành vi dân sự đầy đủ theo quy định của pháp luật hoặc từ đủ 15 tuổi đến chưa đủ 18 tuổi không bị mất hoặc hạn chế năng lực hành vi dân sự theo quy định của pháp luật", "Nhu cầu vay vốn để sử dụng vào mục đích hợp pháp. Có khả năng tài chính để trả nợ.", "Có phương án sử dụng vốn khả thi. Điều kiện này không bắt buộc đối với khoản cho vay có mức giá trị nhỏ.", "Khách hàng đáp ứng đủ 03 điều kiện nêu trên."], "a": 3, "g": "Điều 7 Thông tư số 39/2016/TT-NHNN (đã sửa đổi, bổ sung)"}, {"id": "TD.11.001", "q": "Cán bộ phê duyệt tín dụng nhận được đề nghị “bồi dưỡng” từ khách hàng để đẩy nhanh phê duyệt khoản vay. Cách xử lý phù hợp nhất là gì?", "o": ["Nhận quà nhưng không ưu tiên xử lý hồ sơ", "Nhận quà nếu có giá trị nhỏ", "Từ chối khéo léo, báo cáo cấp có thẩm quyền và xử lý hồ sơ đúng quy trình", "Nhờ đồng nghiệp nhận thay"], "a": 2, "g": ""}, {"id": "TD.11.002", "q": "Cán bộ ngân hàng vô tình nhận được email chứa thông tin nội bộ và quan trọng của khách hàng không thuộc phạm vi công việc của mình. Cách xử lý phù hợp nhất là gì?", "o": ["Chuyển tiếp cho đồng nghiệp để tham khảo", "Lưu lại để sử dụng khi cần", "Xóa hoặc báo bộ phận liên quan theo quy định bảo mật", "Trao đổi với khách hàng khác"], "a": 2, "g": ""}, {"id": "TD.11.003", "q": "Trong quá trình xử lý hồ sơ của khách hàng, cán bộ phát hiện đồng nghiệp bỏ qua một bước kiểm tra bắt buộc để kịp tiến độ theo yêu cầu của khách hàng. Cách xử lý phù hợp nhất là gì?", "o": ["Im lặng để tránh ảnh hưởng tới khách hàng và đồng nghiệp", "Báo cáo và đề nghị thực hiện đúng quy trình kiểm soát", "Hỗ trợ hoàn thiện hồ sơ sau khi giải ngân", "Để khách hàng tự chịu trách nhiệm"], "a": 1, "g": ""}, {"id": "TD.11.004", "q": "Trong cuộc họp với khách hàng lớn, cán bộ phát hiện thông tin trình bày có sai sót ảnh hưởng đến quyết định tín dụng. Hành động phù hợp nhất là gì?", "o": ["Im lặng để tránh ảnh hưởng uy tín đơn vị", "Đổ trách nhiệm cho bộ phận khác", "Đợi sau cuộc họp mới thông báo", "Chủ động trao đổi, làm rõ và điều chỉnh thông tin kịp thời"], "a": 3, "g": ""}, {"id": "TD.11.005", "q": "Trong cuộc họp với đối tác, khách hàng phản ánh thái độ phục vụ chưa chuyên nghiệp của bạn và đánh giá kém chất lượng dịch vụ của VCB. Hành động phù hợp nhất của bạn là gì?", "o": ["Tranh luận để bảo vệ quan điểm cá nhân", "Tiếp thu ý kiến, giải thích nếu có ý kiến của khách hàng chưa đúng, xin lỗi nếu cần và chủ động cải thiện", "Đổ lỗi cho quy trình nội bộ", "Phớt lờ phản ánh của khách hàng"], "a": 1, "g": ""}, {"id": "TD.11.006", "q": "Cán bộ ngân hàng phát hiện khách hàng có dấu hiệu sử dụng hồ sơ giả mạo để vay vốn. Hành động phù hợp nhất là gì?", "o": ["Tiếp tục xử lý để tránh mất khách", "Ngừng xử lý hồ sơ và báo cáo theo quy định", "Tự xác minh mà không báo cáo", "Chỉ cảnh báo riêng với khách hàng"], "a": 1, "g": ""}, {"id": "TD.11.007", "q": "Cán bộ ngân hàng sử dụng email cá nhân để gửi hồ sơ tín dụng cho khách hàng nhằm thuận tiện xử lý công việc. Việc này được đánh giá thế nào?", "o": ["Phù hợp nếu khách hàng đồng ý", "Không phù hợp vì vi phạm nguyên tắc bảo mật thông tin", "Được phép ngoài giờ làm việc", "Phù hợp nếu lãnh đạo phòng cho phép"], "a": 1, "g": ""}, {"id": "TD.11.008", "q": "Khách hàng đề nghị cán bộ xác nhận thông tin tài chính chưa được kiểm chứng để phục vụ công việc kinh doanh riêng của khách hàng. Cán bộ nên xử lý thế nào?", "o": ["Hỗ trợ khách hàng để giữ quan hệ", "Nhờ Lãnh đạo phụ trách ký xác nhận", "Xác nhận bằng email cá nhân", "Từ chối và chỉ xác nhận thông tin đúng quy định"], "a": 3, "g": ""}, {"id": "TD.11.009", "q": "Theo bộ chuẩn mực đạo đức nghề nghiệp và quy tắc ứng xử của cán bộ ngân hàng, tính chủ động, sáng tạo và thích ứng thể hiện qua biểu hiện nào?", "o": ["Rèn luyện tính tự giác và chủ động, luôn tìm tòi, sáng tạo để nâng cao năng suất, chất lượng và hiệu quả công việc; rèn luyện khả năng thích ứng cao trước sự thay đổi của môi trường và yêu cầu trong tình hình mới; không ngừng cải tiến phương pháp làm việc, nâng cao các kỹ năng mềm của bản thân.", "Sẵn sàng chia sẻ, giúp đỡ, truyền lại kinh nghiệm của mình cho đồng nghiệp vì công việc chung; tận tâm, chu đáo, làm vừa lòng khách hàng, từ đó đem lại lợi ích và danh tiếng cho ngân hàng.", "Tuân thủ nghiêm ngặt các quy định của pháp luật và của tổ chức về bảo mật an toàn thông tin nội bộ và thông tin khách hàng; không đưa ra thông tin sai lệch, thiếu chính xác, mang tính chủ quan cá nhân gây tổn hại đến tài sản, thương hiệu, uy tín của tổ chức, của ngành, gây hoang mang, lo ngại, ảnh hưởng đến lòng tin của khách hàng đối với ngân hàng.", "Tất cả các phương án trên"], "a": 0, "g": ""}, {"id": "TD.11.010", "q": "Khi bắt tay, quyền chủ động dành cho:", "o": ["Cấp trên", "Người cao tuổi hơn", "Cấp dưới", "A và B"], "a": 3, "g": ""}, {"id": "TD.11.011", "q": "Trách nhiệm đối với cộng đồng:", "o": ["Tham gia công tác xã hội", "Hết mình với công việc", "Quan tâm tới khách hàng và đối tác", "Làm việc chuyên nghiệp, lịch sự, tận tình"], "a": 0, "g": ""}, {"id": "TD.11.012", "q": "Điều nào sau đây thuộc phẩm chất đạo đức người Vietcombank?", "o": ["Tôn trọng pháp luật và các quy định nội bộ", "Trung thành, luôn vì lợi ích Vietcombank", "Nhân ái, hoà đồng cùng tập thể, tích cực tham gia các hoạt động cộng đồng", "Tất cả các phương án trên"], "a": 3, "g": ""}, {"id": "TD.11.013", "q": "Phương châm hành động của Vietcombank năm 2026 là gì?", "o": ["Phát triển - Bền vững - Nhân văn", "Đột phá - Phát triển - Hiệu quả - Bền Vững", "Chuyển đổi - Phát triển - Nhân văn", "Chuyển đổi - Nhân văn - Bền vững"], "a": 1, "g": ""}, {"id": "TD.11.014", "q": "Phát biểu nào sau đây đúng về trách nhiệm của cán bộ Vietcombank đối với khách hàng, đối tác?", "o": ["Có thể cung cấp một số thông tin cơ bản của khách hàng cho người quen", "Giữ gìn chữ tín mọi lúc mọi nơi", "Luôn đảm bảo lợi ích của Vietcombank lớn hơn lợi ích của đối tác, khách hàng", "Không có phương án đúng"], "a": 1, "g": ""}, {"id": "TD.11.015", "q": "Trong chuẩn mực hành vi ứng xử của người Vietcombank, khi gặp đối tác lần đầu,nội dung tự giới thiệu và giới thiệu người đi cùng (nếu có) bao gồm:", "o": ["Họ và tên", "Chức vụ", "Sở thích", "A và B"], "a": 3, "g": ""}, {"id": "TD.11.016", "q": "Đối tượng nào sau đây phải tuân thủ Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB?", "o": ["Các cán bộ làm công tác khách hàng hoặc giao dịch trực tiếp với khách hàng", "Các cán bộ được phân quyền hạch toán các khoản thu, chi của ngân hàng", "Toàn thể CBNV làm việc tại VCB, bao gồm TSC, CN, VPĐD, Đơn vị sự nghiệp, CBNV do VCB cử đi làm việc tại các đơn vị thành viên, không phân biệt loại và hình thức hợp đồng lao động, hợp đồng dịch vụ, kể cả trong thời gian thử việc, học việc", "Hội đồng quản trị, Ban điều hành, các Phòng Ban TSC và Chi nhánh"], "a": 2, "g": ""}, {"id": "TD.11.017", "q": "Theo Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB, người có quan hệ của CBNV VCB không bao gồm đối tượng nào sau đây?", "o": ["Vợ, chồng, bố đẻ, mẹ đẻ, bố nuôi, mẹ nuôi, bố chồng, mẹ chồng, bố vợ, mẹ vợ, bố dượng, mẹ kế", "Ông, bà, cô, dì, chú, bác, cháu của CBNV hoặc của vợ/ chồng của CBNV", "Anh/chị/em ruột, anh/chị/em cùng bố khác mẹ hoặc cùng mẹ khác bố, anh/em rể, chị/em dâu, anh/chị/em ruột của vợ hoặc chồng", "Con đẻ, con nuôi, con riêng của vợ hoặc chồng, con rể, con dâu"], "a": 1, "g": ""}, {"id": "TD.11.018", "q": "Hành vi nào sau đây là không vi phạm Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB?", "o": ["Cán bộ cố ý nghỉ việc mà không báo cáo lãnh đạo đơn vị", "Cán bộ bận việc gia đình nên xin phép lãnh đạo phòng cho đến muộn", "Cán bộ kế toán cố tình hạch toán các khoản thanh toán hóa đơn đầu vào của đơn vị vi phạm quy định về thuế", "Cán bộ thực hiện công việc riêng bên ngoài trong giờ làm việc mà không báo cáo và được sự đồng ý của cấp lãnh đạo"], "a": 1, "g": ""}, {"id": "TD.11.019", "q": "Trong mối quan hệ giữa cấp trên và cấp dưới, CBNV cần ứng xử như thế nào (lựa chọn đáp án đúng nhất)?", "o": ["Cán bộ cấp dưới chấp hành sự phân công nhiệm vụ; tôn trọng, ứng xử đúng mực với cấp trên, không có hành vi gây tổn hại đến uy tín của cấp trên; không được có đơn thư nặc danh liên quan đến cấp trên; thực hiện đúng chức trách, nhiệm vụ được giao; cán bộ cấp dưới có quyền đưa ra ý kiến tham mưu, thuyết phục cán bộ cấp trên khi cần thiết nhằm tránh phát sinh rủi ro, sai sót trong quá trình xử lý công việc", "Cán bộ cấp dưới chấp hành sự phân công nhiệm vụ; tôn trọng, ứng xử đúng mực với cấp trên, không có hành vi gây tổn hại đến uy tín của cấp trên; được phép gửi đơn thư nặc danh liên quan đến cấp trên", "Cán bộ cấp dưới chấp hành sự phân công nhiệm vụ; tôn trọng, ứng xử đúng mực với cấp trên, không có hành vi gây tổn hại đến uy tín của cấp trên; không được có đơn thư nặc danh liên quan đến cấp trên; cán bộ cấp dưới phải thực hiện nhiệm vụ do cấp trên giao dù đang không tuân thủ quy định", "Không có đáp án nào đúng với quy định"], "a": 0, "g": ""}, {"id": "TD.11.020", "q": "Theo Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB, trong quan hệ với đồng nghiệp, cán bộ nên làm gì?", "o": ["Phân biệt đối xử với cán bộ mới/cán bộ lao động giản đơn tại đơn vị", "Thiên vị một vài cá nhân có kết quả hoàn thành tốt chỉ tiêu trong đơn vị dẫn tới không phát hiện biểu hiện suy thoái đạo đức", "Giữ gìn đoàn kết nội bộ, tôn trọng lẫn nhau. Tuyệt đối không có hành vi gièm pha, bè phái, lợi dụng, trù dập và phân biệt đối xử với đồng nghiệp, cũng như có hành vi làm tổn hại đến danh dự và uy tín của đồng nghiệp", "Lôi kéo đồng nghiệp cùng tẩy chay một đồng nghiệp mà mình không ưa"], "a":
