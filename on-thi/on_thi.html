2, "g": ""}, {"id": "TD.11.021", "q": "CBNV có hành vi sau có được coi là vi phạm Quy định về lợi ích cá nhân theo Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB?", "o": ["Gợi ý, đòi hỏi các khoản lợi ích cá nhân từ khách hàng đang có nhu cầu giao dịch tại Ngân hàng", "Nhận những món quà có giá trị cao, sau đó hứa giúp đỡ công ty ký hợp đồng trở thành nhà cung cấp với ngân hàng", "Lãnh đạo kế toán được tặng cổ phiếu có quyền biểu quyết của đối tác là nhà cung cấp dịch vụ cho ngân hàng", "Tất cả các hành vi đều vi phạm quy định"], "a": 3, "g": ""}, {"id": "TD.11.022", "q": "Trường hợp CBNV bị cán bộ cấp trên lợi dụng vị trí công tác để chỉ đạo, ra lệnh thực hiện các công việc vi phạm các quy định nội bộ, vi phạm pháp luật, theo Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB, CBNV cần làm gì?", "o": ["Chia sẻ với các đồng nghiệp khác tại đơn vị và không báo cáo lãnh đạo/TSC", "Báo cáo kịp thời tới Phòng QLRRHĐ TSC hoặc báo cáo TSC thông qua Hòm thư tố giác trên website của VCB", "Chia sẻ thông tin lên trang mạng cá nhân", "Không cần báo cáo"], "a": 1, "g": ""}, {"id": "TD.11.023", "q": "Giá trị Sẵn sàng đổi mới trong bản sắc văn hóa Vietcombank được hiểu là:", "o": ["Sẵn sàng đổi mới hình ảnh", "Luôn hướng đến cái mới hiện đại và văn minh", "Sẵn sàng đổi mới dịch vụ", "Sẵn sàng đổi mới con người"], "a": 1, "g": ""}, {"id": "TD.11.024", "q": "Giá trị Nhân văn trong bản sắc văn hóa Vietcombank được hiểu là:", "o": ["Biết quan tâm chia sẻ", "Vì sự phát triển của xã hội", "Đạo đức, trách nhiệm", "Trọng đức, gần gũi và biết thông cảm sẻ chia"], "a": 3, "g": ""}, {"id": "TD.11.025", "q": "Nguyên tắc ứng xử của cấp dưới đối với cấp trên:", "o": ["Tin tưởng, tôn trọng và tuân thủ ý kiến chỉ đạo của cấp trên; Giữ thái độ lễ phép, ứng xử đúng mực, không xu nịnh", "Có ý thức giữ gìn, bảo vệ uy tín và danh dự của cấp trên, nhất là khi tiếp xúc làm việc với bên ngoài", "Được quyền bày tỏ ý kiến riêng của bản thân một cách có tổ chức, thẳng thắn với thái độ xây dựng và chân thành", "Tất cả các đáp án trên"], "a": 3, "g": ""}, {"id": "TD.11.026", "q": "Theo bộ chuẩn mực đạo đức nghề nghiệp và quy tắc ứng xử của cán bộ ngân hàng, sự liêm chính được quy định như thế nào?", "o": ["Luôn tu dưỡng, rèn luyện, xây dựng bản lĩnh nghề nghiệp; Giữ gìn sự liêm chính, minh bạch trong các mối quan hệ liên quan đến lợi ích tài chính và tiền bạc", "Trung thực, thẳng thắn, nghiêm túc với bản thân và với những người xung quanh", "Phải có tinh thần trách nhiệm bảo vệ tài sản và lợi ích hợp pháp của tổ chức, tránh lãng phí; không được tham ô, vụ lợi hoặc tiếp tay cho hành vi tham ô, vụ lợi; không làm lơ khi thấy các hiện tượng sai trái xung quanh, báo cáo kịp thời với cấp có thẩm quyền khi phát hiện hành vi vi phạm và gây hại cho lợi ích chung", "Tất cả các phương án trên"], "a": 3, "g": ""}, {"id": "TD.11.027", "q": "Khi thực hiện thẩm định tái cấp tín dụng, cán bộ vô tình phát hiện ra một số thông tin nội bộ mang tính bất lợi về tình hình tài chính của một tập đoàn lớn (là khách hàng của VCB) chưa được công bố ra thị trường. Hành vi nào sau đây tuân thủ đúng quy định bảo mật thông tin và đạo đức nghề nghiệp VCB?", "o": ["Chia sẻ thông tin này cho người thân để kịp thời bán cổ phiếu của tập đoàn đó nhằm tránh thua lỗ.", "Chỉ sử dụng thông tin cho mục đích đánh giá rủi ro tín dụng trong nội bộ VCB, tuyệt đối không tiết lộ ra bên ngoài hoặc sử dụng cho lợi ích cá nhân dưới mọi hình thức.", "Đăng tải thông tin lên hội nhóm chuyên môn kín để tham khảo ý kiến của các chuyên gia ngân hàng khác.", "Trao đổi với các khách hàng khác của ngân hàng để họ cảnh giác khi làm ăn với tập đoàn này."], "a": 1, "g": ""}, {"id": "TD.11.028", "q": "Trong mối quan hệ giữa cấp trên và cấp dưới, cán bộ cấp trên cần ứng xử như thế nào (lựa chọn đáp án đúng nhất)?", "o": ["Cán bộ cấp trên cần tôn trọng, lắng nghe, khuyến khích cấp dưới bày tỏ quan điểm, ý kiến, gương mẫu trong cư xử, tạo không khí hòa đồng, cởi mở, động viên, khích lệ, đối xử công bằng, bình đẳng đối với cấp dưới", "Cán bộ cấp trên cần tôn trọng, lắng nghe, khuyến khích cấp dưới bày tỏ quan điểm, ý kiến, gương mẫu trong cư xử, tạo không khí hòa đồng, cởi mở, động viên, khích lệ, đối xử công bằng, bình đẳng đối với cấp dưới, không trù dập, phân biệt đối xử, không lợi dụng chức vụ để làm tổn hại đến ngân hàng", "Cán bộ cấp trên cần tôn trọng, lắng nghe, khuyến khích cấp dưới bày tỏ quan điểm, ý kiến, gương mẫu trong cư xử, tạo không khí hòa đồng, cởi mở, động viên, khích lệ, đối xử công bằng, bình đẳng, hỗ trợ cấp dưới giải quyết khó khăn, bảo vệ quyền lợi chính đáng của cấp dưới, không trù dập, phân biệt đối xử, không lợi dụng chức vụ, địa vị, sử dụng thông tin, bí quyết, cơ hội kinh doanh và tài sản để thu lợi cá nhân hoặc làm tổn hại đến ngân hàng", "Cán bộ cấp trên cần tôn trọng, lắng nghe, khuyến khích cấp dưới bày tỏ quan điểm, ý kiến, gương mẫu trong cư xử, tạo không khí hòa đồng, cởi mở, động viên, khích lệ, đối xử công bằng, bình đẳng, hỗ trợ cấp dưới giải quyết khó khăn, bảo vệ quyền lợi chính đáng của cấp dưới, không trù dập, phân biệt đối xử, không lợi dụng chức vụ để làm tổn hại đến ngân hàng"], "a": 2, "g": ""}, {"id": "TD.11.029", "q": "Để thuận tiện cho việc xử lý tiếp hồ sơ của khách hàng vào ngày nghỉ cuối tuần tại nhà, cán bộ Ngân hàng đã chủ động sao chép một số file scan hồ sơ pháp lý và phương án kinh doanh của khách hàng vào USB cá nhân mà chưa có sự phê duyệt của Trưởng phòng. Nhận định nào sau đây là đúng?", "o": ["Vi phạm vì đã không lưu trữ, bảo quản hồ sơ, tài liệu của ngân hàng theo đúng quy định và có nguy cơ gây sơ hở thông tin", "Không vi phạm vì cán bộ thể hiện tính tự giác, chủ động, sáng tạo nâng cao năng suất để kịp tiến độ công việc", "Không vi phạm vì cán bộ chỉ xử lý dữ liệu phục vụ mục đích công việc của ngân hàng, không cung cấp cho bên thứ ba.", "Chỉ vi phạm quy định về thời gian làm việc, không vi phạm quy định về bảo mật thông tin"], "a": 0, "g": ""}, {"id": "TD.11.030", "q": "Khi cán bộ cấp dưới nhận được một nhiệm vụ từ cấp trên mà bản thân thấy chưa thực sự tối ưu, cán bộ cần ứng xử như thế nào?", "o": ["Nghiêm túc chấp hành sự phân công nhiệm vụ, đồng thời chủ động nghiên cứu, đề xuất cải tiến phương pháp làm việc một cách văn minh với cấp trên.", "Tự ý thay đổi phương pháp thực hiện theo ý mình để chứng minh năng lực sáng tạo mà không cần báo cáo.", "Từ chối thực hiện nhiệm vụ cho đến khi cấp trên đồng ý sửa đổi quy trình theo ý của mình.", "Chấp hành nhưng làm với thái độ đối phó, ỷ lại và đẩy các phần việc khó cho các nhân sự khác trong nhóm."], "a": 0, "g": ""}, {"id": "TD.12.001", "q": "Một chi nhánh lớn của Vietcombank đang trình đề xuất Trụ sở chính cơ cấu lại thời hạn trả nợ và giữ nguyên nhóm nợ cho một doanh nghiệp sản xuất xuất khẩu chủ lực gặp khó khăn thanh khoản tạm thời. Tuy nhiên, qua phân tích báo cáo CIC, chuyên viên phát hiện doanh nghiệp này có một khoản vay khác đã quá hạn 45 ngày tại một ngân hàng khác. Giám đốc Chi nhánh liên tục gọi điện đề nghị bộ phận Phê duyệt tín dụng tại Trụ sở chính duyệt nhanh hồ sơ cơ cấu nợ để bảo vệ chỉ tiêu nợ xấu của chi nhánh trước kỳ báo cáo quý. Anh/ Chị sẽ xử lý tình huống này như thế nào?", "o": ["Trình phê duyệt cơ cấu lại nợ ngay lập tức theo yêu cầu của Giám đốc Chi nhánh, đồng thời gửi một email lưu ý nội bộ rằng Chi nhánh phải chịu hoàn toàn trách nhiệm nếu cơ quan thanh tra giám sát của Ngân hàng Nhà nước phát hiện và xử lý vi phạm sau này.", "Từ chối thẳng thừng qua điện thoại với Giám đốc Chi nhánh. Giải thích rõ cho Giám đốc Chi nhánh quy định của Ngân hàng Nhà nước về nguyên tắc phân loại nợ theo nhóm rủi ro cao nhất của một khách hàng trong hệ thống các tổ chức tín dụng.", "Tổ chức họp với Ban Giám đốc Chi nhánh, trình bày rõ dữ liệu nợ của doanh nghiệp và quy định phân loại nợ của Ngân hàng Nhà nước, đề xuất hỗ trợ Chi nhánh xây dựng lại phương án cơ cấu nợ.", "Gửi báo cáo trình lên Ban Giám đốc Trụ sở chính để phản ánh áp lực từ Giám đốc Chi nhánh, đề xuất xử lý cán bộ làm trái với quy định về phân loại nợ, đồng thời từ chối giải quyết hồ sơ của khách hàng cho đến khi có quyết định của Ban Giám đốc."], "a": 2, "g": "Văn bản hợp nhất số 17/VBHN-NHNN của NHNN, Thông tư 31/2024/TT-NHNN của NHNN"}, {"id": "TD.12.003", "q": "Hồ sơ vay của một hộ kinh doanh có dấu hiệu doanh thu qua tài khoản ngân hàng không khớp với doanh thu trong báo cáo. Anh/ Chị sẽ giải quyết trường hợp này như thế nào?", "o": ["Kết luận ngay hồ sơ của khách hàng thiếu trung thực và yêu cầu chi nhánh dừng quan hệ với khách hàng này.", "Đề nghị chi nhánh gọi điện cho khách hàng và gửi email giải trình cho Trụ sở chính. Sau đó, dùng email này làm căn cứ phê duyệt tín dụng.", "Chỉ rõ điểm không khớp, yêu cầu chi nhánh làm việc với khách hàng để bổ sung chứng từ đối chiếu và giữ thông điệp trung tính với khách hàng.", "Đề nghị chi nhánh bỏ qua chênh lệch nhỏ này để giữ quan hệ với khách hàng và đảm bảo chỉ tiêu KPI cuối quý."], "a": 2, "g": "Luật Các TCTD 2024, Văn bản hợp nhất 06/VBHN-NHNN năm 2026 hợp nhất Thông tư quy định về hoạt động cho vay của tổ chức tín dụng, Chi nhánh ngân hàng nước ngoài đối với khách hàng."}, {"id": "TD.12.005", "q": "Một cá nhân kinh doanh (tiểu thương tại chợ đầu mối) đến phòng giao dịch Vietcombank đề xuất vay xx tỷ đồng nhằm bổ sung vốn lưu động phục vụ mùa cao điểm cuối năm. Khách hàng ngần ngại khi được giới thiệu bộ giải pháp VCB DigiShop vì lo lắng việc kết nối tự động với hệ thống eTax của Cục Thuế sẽ làm lộ lọt thông tin doanh thu thực tế. Trong trường hợp này, anh/ chị sẽ tư vấn cho cán bộ phòng giao dịch Vietcombank để giải thích cho Khách hàng như thế nào?", "o": ["Cam kết hệ thống bảo mật của Vietcombank sẽ hoàn toàn ẩn danh các giao dịch bán hàng trực tuyến trước cơ quan thuế để khách hàng yên tâm.", "Khẳng định việc kết nối với hệ thống của Cục thuế là nghĩa vụ bắt buộc của mọi cá nhân kinh doanh và từ chối cấp tín dụng nếu không đăng ký DigiShop.", "Tư vấn cho khách hàng chuyển sang đăng ký khoản vay tiêu dùng tín chấp cá nhân để không phải chứng minh dòng tiền kinh doanh.", "Với lịch sử dòng tiền minh bạch trên hệ thống sẽ giúp khách hàng dễ tiếp cận khoản vay với lãi suất ưu đãi và cơ hội để tăng hạn mức vay sau này."], "a": 3, "g": ""}, {"id": "TD.12.006", "q": "Một Trung tâm định giá tài sản của Vietcombank nhận được yêu cầu định giá lại một khách sạn 5 sao đang thế chấp cho khoản vay trung hạn. Chuyên viên định giá tại Trung tâm đề xuất giá trị khách sạn giảm 25% so với năm trước do doanh thu ngành du lịch trong khu vực bị suy giảm kéo dài. Chi nhánh quản lý hồ sơ của khách hàng kịch liệt phản đối vì điều này sẽ dẫn đến việc khách hàng phải bổ sung thêm TSBĐ hoặc bị hạ hạn mức vay. Anh/ Chị sẽ giải quyết vấn đề này như thế nào?", "o": ["Đề nghị giữ nguyên kết quả định giá giảm 25% vì đây là phán quyết kỹ thuật độc lập mang tính bắt buộc của Trung tâm định giá.", "Tổ chức họp, trình bày báo cáo phân tích thị trường và đề xuất điều chỉnh tỷ suất chiết khấu dòng tiền phù hợp với thực tế.", "Đề xuất gửi hồ sơ TSBĐ này cho một công ty định giá độc lập bên ngoài thực hiện định giá lại và các đơn vị bắt buộc sử dụng kết quả định giá đó.", "Đồng ý với yêu cầu của Chi nhánh, giữ nguyên giá trị TSBĐ như cũ để hỗ trợ chỉ tiêu tăng trưởng tín dụng chung của toàn khu vực."], "a": 1, "g": ""}, {"id": "TD.12.007", "q": "Trong quá trình thẩm định khoản vay hợp vốn trị giá xx tỷ đồng tài trợ dự án đường cao tốc ven biển, một Chuyên viên phê duyệt tín dụng tại Trụ sở chính phát hiện ra công ty mẹ của bên đi vay có tỷ lệ sở hữu chéo phức tạp với một loạt công ty con liên quan đến hoạt động trong lĩnh vực chứng khoán, vi phạm quy định về sở hữu chéo và giới hạn cấp tín dụng của Luật Các tổ chức tín dụng 2024. Chủ tịch Tập đoàn là một tỷ phú có ảnh hưởng lớn và liên tục dùng áp lực quan hệ ngoại giao để thúc ép phê duyệt tín dụng nhanh. Anh/ Chị sẽ giải quyết trường hợp này như thế nào?", "o": ["Phê duyệt khoản vay theo đề nghị nhưng yêu cầu khách hàng ký cam kết về việc sẽ thoái toàn bộ vốn tại công ty chứng khoán trong vòng một năm.", "Từ chối cấp tín dụng cho khách hàng và công khai thông tin sở hữu chéo của doanh nghiệp lên cổng thông tin CIC của Ngân hàng Nhà nước để cảnh báo hệ thống ngân hàng.", "Giải thích cho khách hàng lộ trình giảm dần giới hạn cấp tín dụng theo quy định và tư vấn khách hàng cơ cấu lại danh mục cổ đông.", "Đề xuất chuyển toàn bộ khoản vay này của khách hàng sang một chi nhánh Vietcombank tại vùng sâu vùng xa để tránh sự giám sát của Trụ sở chính."], "a": 2, "g": "Luật Các tổ chức tín dụng 2024"}, {"id": "TD.12.008", "q": "Khi một doanh nghiệp thủy sản SME bị hệ thống CIC chuyển nợ từ Nhóm 1 sang Nhóm 2 do khoản vay ngắn hạn bổ sung vốn lưu động quá hạn 15 ngày, kế toán trưởng của doanh nghiệp liên tục gọi điện phàn nàn và yêu cầu giải thích tại sao Vietcombank không thông báo trước cho họ khi thực hiện chuyển nhóm nợ trên hệ thống CIC. Anh/ Chị sẽ giải quyết vấn đề này như thế nào?", "o": ["Phân loại nợ là quy trình tự động hóa dựa trên các tiêu chí định lượng nghiêm ngặt về số ngày quá hạn theo quy định của Ngân hàng Nhà nước.", "Thừa nhận sai sót của cán bộ quản lý hồ sơ đã quên gửi thông báo bằng văn bản cho khách hàng và cam kết sẽ thu hồi lệnh chuyển nhóm nợ trên CIC.", "Tư vấn khách hàng nhanh chóng nộp đơn đề nghị cơ cấu lại thời hạn trả nợ và hứa hẹn hệ thống sẽ tự động đưa nhóm nợ về lại Nhóm 1 ngay lập tức.", "Đề nghị khách hàng làm việc trực tiếp với Ngân hàng Nhà nước (NHNN) vì hệ thống phân loại nợ CIC là do NHNN quản lý, vận hành độc lập."], "a": 0, "g": "Thông tư 31/2024/TT-NHNN"}, {"id": "TD.12.010", "q": "Một doanh nghiệp FDI lớn đề xuất Vietcombank tài trợ dự án nhà máy xử lý rác thải sinh hoạt sử dụng công nghệ đốt phát điện sinh học. Tập đoàn này đề nghị Vietcombank phải phê duyệt khoản vay dài hạn x.000 tỷ đồng trong vòng 3 ngày, nếu không họ sẽ rút toàn bộ danh mục tiền gửi không kỳ hạn (CASA) quy mô lớn tại ngân hàng. Anh/ Chị sẽ giải quyết vấn đề này như thế nào ?", "o": ["Chấp nhận phê duyệt nhanh khoản vay dựa trên quy mô tài sản lớn của tập đoàn mẹ ở nước ngoài để bảo vệ nguồn tiền CASA hiện tại của Ngân hàng.", "Phân tích rủi ro pháp lý của dự án, giải thích quy trình thẩm định tín dụng bắt buộc của Ngân hàng và đề xuất cấu trúc vay hợp vốn để chia sẻ rủi ro.", "Từ chối tài trợ dự án vì tiến độ thẩm định và phê duyệt quá ngắn, đề xuất doanh nghiệp tìm kiếm nguồn tài trợ từ các tổ chức tài chính quốc tế.", "Đề xuất ký biên bản ghi nhớ hợp tác (MOU) không ràng buộc pháp lý ngay lập tức với khách hàng để giữ CASA và có thời gian thẩm định thực tế."], "a": 1, "g": "Văn bản hợp nhất 06/VBHN-NHNN 2026"}, {"id": "TD.12.013", "q": "Một dự án xây cao ốc văn phòng thế chấp cho khoản vay trung hạn xxx tỷ đồng của một doanh nghiệp bất động sản tại Vietcombank bị dừng thi công hoàn toàn do chủ đầu tư dính vào kiện tụng pháp lý nội bộ. Khoản vay bị chuyển sang Nhóm 4. Doanh nghiệp đề xuất Vietcombank tự thực hiện quyền chuyển nhượng một phần dự án cao ốc dở dang này cho một tập đoàn phát triển bất động sản uy tín khác để cấn trừ toàn bộ dư nợ gốc lãi. Anh/ Chị sẽ giải quyết vấn đề này như thế nào ?", "o": ["Đề xuất Ban lãnh đạo Ngân hàng từ chối phương án chuyển nhượng vì Ngân hàng không có chức năng kinh doanh bất động sản thương mại trực tiếp.", "Đề xuất thiết lập phương án thẩm định kỹ thuật, kiểm tra điều kiện chuyển nhượng dự án theo quy định để phê duyệt chuyển nhượng.", "Tiến hành các thủ tục khởi kiện tranh chấp ranh giới đất đai ra tòa án nhân dân để phát mãi cưỡng chế toàn bộ dự án qua đấu giá công khai.", "Yêu cầu chủ đầu tư cũ phải tự hoàn thiện toàn bộ pháp lý xây dựng cao ốc văn phòng trước khi Vietcombank xem xét phương án cấn trừ nợ."], "a": 1, "g": "Luật Các tổ chức tín dụng 2024"}, {"id": "TD.12.015", "q": "Một doanh nghiệp sản xuất bao bì giấy SME đang đề xuất Vietcombank gia hạn hạn mức vay vốn lưu động ngắn hạn trị giá xx tỷ đồng. Tuy nhiên, qua phân tích tài chính doanh nghiệp, nhân viên Ngân hàng phát hiện chu kỳ tiền mặt của doanh nghiệp bị kéo dài từ 60 ngày lên 120 ngày do đối tác chậm thanh toán, làm xuất hiện nguy cơ thâm hụt vốn lưu động trầm trọng. Anh/ chị đề xuất giải pháp tháo gỡ vấn đề này cho doanh nghiệp như thế nào?", "o": ["Từ chối gia hạn hạn mức vay vốn và đề xuất doanh nghiệp tự cắt giảm quy mô sản xuất để tự cân đối dòng tiền nội bộ.", "Đồng ý gia hạn hạn mức vay vốn đồng thời đề xuất doanh nghiệp sử dụng giải pháp tài trợ chuỗi cung ứng hoặc bao thanh toán.", "Đề xuất doanh nghiệp chuyển đổi toàn bộ tài sản cố định nhà xưởng sang hình thức thuê tài chính dài hạn để lấy tiền trả nợ ngắn hạn.", "Tư vấn doanh nghiệp chủ động tăng giá bán sản phẩm lên hai mươi phần trăm để nhanh chóng thu hồi vốn từ khách hàng hiện hữu."], "a": 1, "g": ""}, {"id": "TD.12.017", "q": "Một hệ thống siêu thị điện máy SME đang sử dụng gói dịch vụ ngân hàng số VCB DigiBiz của Vietcombank gặp sự cố tấn công mạng vào hệ thống ERP nội bộ của doanh nghiệp, làm đóng băng toàn bộ dữ liệu kế toán và thanh toán. Doanh nghiệp không thể thực hiện các lệnh chuyển tiền chi lương cho x.000 nhân viên qua DigiBiz đúng hạn. Anh/ Chị sẽ xử lý trường hợp này như thế nào?", "o": ["Yêu cầu doanh nghiệp chủ động giải quyết sự cố tấn công mạng và từ chối mọi yêu cầu giao dịch ngoại tuyến để tránh lây nhiễm mã độc.", "Hướng dẫn doanh nghiệp sử dụng thiết bị Hard Token của Vietcombank để phê duyệt giải ngân chi lương tự động trên một máy tính độc lập.", "Đề xuất Ban giám đốc cho phép doanh nghiệp thực hiện chi lương cho nhân viên qua bảng kê bằng giấy nộp trực tiếp tại quầy.", "Đề xuất cung cấp cho doanh nghiệp một khoản vay thấu chi khẩn cấp trị giá xx tỷ đồng để thực hiện rút tiền mặt chi trả lương trực tiếp cho nhân viên."], "a": 2, "g": "Thông tư 50/2024/TT-NHNN"}, {"id": "TD.12.018", "q": "Một khách hàng cá nhân VIP đang sử dụng ứng dụng VCB Digibank trình báo tài khoản bị bốc hơi xx tỷ đồng sau khi nhận được một cuộc gọi mạo danh cán bộ Vietcombank yêu cầu cập nhật thông tin sinh trắc học khuôn mặt. Khách hàng đòi hỏi Vietcombank phải bồi thường toàn bộ thiệt hại và đe dọa sẽ đưa thông tin này lên truyền thông và mạng xã hội. Anh/ Chị sẽ xử lý trường hợp này như thế nào?", "o": ["Đồng ý bồi thường ngay lập tức xx tỷ đồng cho khách hàng VIP để bảo vệ uy tín thương hiệu của Vietcombank trước truyền thông và không làm ảnh hưởng mối quan hệ với khách hàng.", "Trình báo cơ quan công an, phân tích nhật ký hệ thống để chứng minh lỗi bảo mật thuộc về khách hàng và hỗ trợ phong tỏa tài khoản thụ hưởng.", "Từ chối giải quyết khiếu nại vì giao dịch được thực hiện bằng mã OTP đúng quy trình xác thực hai kênh độc lập của khách hàng.", "Đề xuất khách hàng VIP thực hiện nâng cấp tài khoản bảo mật lên chuẩn FIDO để hệ thống tự động hoàn trả lại số tiền đã mất."], "a": 1, "g": "Thông tư 50/2024/TT-NHNN"}, {"id": "TD.12.019", "q": "Một doanh nghiệp SME chuyên sản xuất phân bón hữu cơ đang đề xuất Vietcombank tài trợ vốn trung hạn xx tỷ đồng để xây dựng nhà máy sấy bùn thải công nghiệp. Nhà máy mới đang trong thời gian xây dựng. Doanh nghiệp đã được cấp Giấy chứng nhận quyền sử dụng (QSD) đất (Sổ đỏ) cho toàn bộ diện tích đất đang xây dựng nhà máy. Dự án được đánh giá là có hiệu quả tài chính tốt. Anh/ Chị sẽ giải quyết trường hợp này như thế nào?", "o": ["Từ chối cấp tín dụng cho đến khi doanh nghiệp hoàn tất thủ tục đăng ký quyền sở hữu tài sản gắn liền với đất trên sổ đỏ.", "Đồng ý nhận thế chấp quyền sử dụng đất sạch hiện tại và áp dụng hệ số rủi ro an toàn vốn CAR ưu đãi dành cho dự án xanh.", "Nhận thế chấp QSD đất và tài sản gắn liền với đất (nếu đủ điều kiện), giải ngân theo tiến độ xây dựng công trình.", "Yêu cầu chủ doanh nghiệp thế chấp bổ sung toàn bộ cổ phần của cá nhân tại các công ty con liên quan để thay thế TSBĐ là quyền sử dụng đất."], "a": 2, "g": "Văn bản hợp nhất 06/VBHN-NHNN 2026, Thông tư 14/2025/TT-NHNN."}, {"id": "TD.12.021", "q": "Một tập đoàn đa quốc gia hoạt động trong lĩnh vực sản xuất linh kiện bán dẫn đang đề xuất Vietcombank cấp một khoản tín dụng trung dài hạn trị giá xx triệu USD để xây dựng nhà máy thông minh tại Việt Nam. Doanh nghiệp cung cấp phương án tài chính của dự án với cơ cấu nguồn vốn: 70% nợ vay và 30% vốn tự có. Chi nhánh trình hồ sơ thẩm định sử dụng chi phí sử dụng vốn bình quân (WACC) cố định là yy % cho toàn bộ thời gian dự án để tính giá trị hiện tại thuần (NPV). Tuy nhiên, qua phân tích cấu trúc vốn, chuyên viên Trụ sở nhận thấy tập đoàn có kế hoạch trả nợ gốc nhanh trong 3 năm đầu, khiến tỷ lệ nợ/vốn (D/V) giảm mạnh qua từng năm. Theo Anh/Chị thì phương án phân tích tài chính doanh nghiệp nào dưới đây là đúng nhất?", "o": ["Chấp nhận phương án tính toán sử dụng WACC cố định của chi nhánh vì phương pháp này đơn giản, dễ hiểu và đã được áp dụng phổ biến trong hầu hết các hồ sơ thẩm định tài trợ dự án trước đây.", "Đề nghị chi nhánh tính toán lại NPV bằng phương pháp giá trị hiện tại điều chỉnh (APV) để tách biệt giá trị của dự án không sử dụng nợ vay và giá trị hiện tại của lá chắn thuế lãi vay.", "Bác bỏ phương án tài chính của dự án vì cơ cấu nợ vay/ vốn tự có ban đầu quá cao, yêu cầu doanh nghiệp phải duy trì tỷ lệ D/V cố định ở mức 40% trong suốt vòng đời dự án để kiểm soát rủi ro tài chính.", "Đề xuất tăng tỷ lệ vốn tự có của doanh nghiệp lên gấp rưỡi để bù đắp cho rủi ro đòn bẩy tài chính thay đổi, giữ nguyên công thức tính WACC đã được áp dụng phổ biến của chi nhánh."], "a": 1, "g": "Luật Các tổ chức tín dụng 2024, Thông tư 14/2025/TT-NHNN"}, {"id": "TD.12.022", "q": "Một doanh nghiệp tư nhân hoạt động trong lĩnh vực sản xuất thép đang đề xuất Vietcombank gia hạn hạn mức vay ngắn hạn bổ sung vốn lưu động xx tỷ đồng. Qua phân tích báo cáo tài chính của doanh nghiệp, chuyên viên phát hiện biên lợi nhuận hoạt động (EBIT margin) sụt giảm mạnh, hệ số thanh toán nhanh rơi xuống mức 0,8 và điểm số Altman Z-score hiệu chỉnh của họ giảm xuống còn 1,6 (vùng rủi ro vỡ nợ cao). Anh/ Chị sẽ xử lý vấn đề này như thế nào?", "o": ["Đồng ý phê duyệt gia hạn hạn mức tín dụng theo đề xuất của chi nhánh vì doanh nghiệp có lịch sử trả nợ tốt tại Vietcombank trong 5 năm qua.", "Từ chối gia hạn hạn mức vay ngắn hạn của doanh nghiệp, đề xuất chi nhánh tiến hành các thủ tục xử lý nợ xấu, thu hồi nợ trước hạn ngay lập tức.", "Phân tích rủi ro vỡ nợ theo mô hình Z-score, đề xuất chi nhánh yêu cầu khách hàng bổ sung TSBĐ và giảm quy mô hạn mức cho vay xuống còn yy tỷ đồng.", "Tư vấn doanh nghiệp chuyển đổi cơ cấu vốn sang sử dụng hoàn toàn nợ vay dài hạn để cải thiện lập tức hệ số thanh toán nhanh trên báo cáo tài chính."], "a": 2, "g": ""}, {"id": "TD.12.024", "q": "Một doanh nghiệp tư nhân hoạt động trong lĩnh vực cơ khí chính xác SME đang đề xuất Vietcombank tài trợ trung hạn xx tỷ đồng để đầu tư robot hàn tự động nhập khẩu từ Nhật Bản. Doanh nghiệp có báo cáo tài chính năm đã được kiểm toán tốt, hệ số nợ trên vốn chủ sở hữu (D/E) là 1,5 và hệ số thanh toán lãi vay đạt 3,5 lần. Anh/ Chị sẽ xử lý khoản vay này như thế nào?", "o": ["Phê duyệt giải ngân khoản vay trung hạn thế chấp bằng chính robot hàn nhập khẩu hình thành từ vốn vay với lãi suất chỉ từ yy%/năm", "Từ chối cấp tín dụng vì hệ số nợ trên vốn chủ sở hữu đã vượt quá giới hạn an toàn tín dụng trung bình của ngành cơ khí chế tạo.", "Yêu cầu doanh nghiệp phải thế chấp bổ sung TSBĐ bằng sổ đỏ của người đại diện pháp luật trước khi xem xét giải ngân tiền mua robot.", "Đề xuất doanh nghiệp chuyển đổi mục đích sử dụng vốn sang vay lưu động ngắn hạn để hưởng mức lãi suất cực kỳ ưu đãi chỉ từ zz%/năm"], "a": 0, "g": ""}, {"id": "TD.12.027", "q": "Một Chuyên viên định giá tài sản đề xuất áp dụng phương pháp định giá dựa trên phương pháp chi phí thay thế đối với một bất động sản thương mại cho thuê thế chấp có địa điểm tại trung tâm thành phố. Anh/ chị hãy giải thích cho chuyên viên này tại sao phương pháp định giá dựa trên khả năng sinh lời lại chính xác hơn đối với loại bất động sản thương mại này?", "o": ["Giải thích bất động sản thương mại cho thuê có giá trị kinh tế trực tiếp phát sinh từ dòng tiền cho thuê thực tế, bám sát nguyên lý dòng tiền chiết khấu", "Đồng ý áp dụng phương pháp chi phí thay thế vì đây là phương pháp định giá an toàn nhất, tránh hoàn toàn rủi ro bong bóng thị trường.", "Giải thích rằng phương pháp chi phí thay thế luôn luôn cho ra kết quả định giá thấp hơn phương pháp chiết khấu dòng tiền.", "Yêu cầu chuyên viên bắt buộc phải sử dụng phương pháp so sánh giá thị trường dựa trên giá bán của các khu đất sạch đã có sổ đỏ lân cận."], "a": 0, "g": ""}, {"id": "TD.12.028", "q": "Một chi nhánh Vietcombank đề xuất chấp thuận cho một khách hàng cá nhân nhận lương qua tài khoản Vietcombank vay thấu chi 50 triệu đồng thế chấp bằng sổ tiết kiệm trị giá 500 triệu đồng mở tại Vietcombank . Tuy nhiên, qua phân tích hồ sơ, chuyên viên thẩm định tín dụng bán lẻ phát hiện khách hàng có một khoản nợ thẻ tín dụng quá hạn Nhóm 2 trị giá 1 triệu đồng ở một ngân hàng khác mới phát sinh. Anh/ Chị sẽ xử lý trường hợp này như thế nào?", "o": ["Đồng ý phê duyệt giải ngân khoản vay vì giá trị sổ tiết kiệm thế chấp hoàn toàn đủ lớn để bảo đảm an toàn cho khoản thấu chi năm mươi triệu", "Giải thích quy định pháp lý và hướng dẫn khách hàng nhanh chóng tất toán khoản nợ thẻ tín dụng quá hạn tại ngân hàng khác để được giải ngân", "Giải thích quy định pháp lý và từ chối cấp tín dụng cho khách hàng này do có nợ quá hạn nhóm 2", "Tư vấn khách hàng chuyển mục đích vay sang đầu tư chứng khoán để được áp dụng quy trình duyệt nhanh đặc thù"], "a": 1, "g": ""}, {"id": "TD.12.029", "q": "Quyết định 21/2025/QĐ-TTg ban hành Danh mục Phân loại xanh đầu tiên tại Việt Nam yêu cầu các tổ chức tín dụng phải thiết lập hệ thống định giá tài sản bảo đảm có tích hợp các tiêu chí môi trường và phát triển bền vững để phục vụ hoạt động cấp tín dụng xanh. Quy trình định giá hiện tại của Ngân hàng đang coi các yếu tố môi trường là thứ yếu. Anh/ Chị sẽ đề xuất phương án cải tiến hệ thống định giá TSBĐ xanh này như thế nào?", "o": ["Đề xuất giữ nguyên quy trình định giá cũ và chỉ thực hiện cộng thêm một tỷ lệ ưu đãi mười phần trăm vào giá trị cuối cùng của TSBĐ xanh", "Đề xuất tích hợp các chỉ số hiệu suất môi trường (chứng nhận LEED, hiệu suất tiết kiệm năng lượng,...) vào mô hình định giá", "Đề xuất từ chối tự định giá các TSBĐ thuộc dự án xanh và đề nghị thuê các công ty định giá độc lập ngoài hệ thống", "Đề xuất phương án chỉ nhận TSBĐ là sổ đỏ hoặc sổ tiết kiệm đối với toàn bộ các dự án tín dụng xanh"], "a": 1, "g": "Quyết định 21/2025/QĐ-TTg"}, {"id": "TD.12.030", "q": "Một doanh nghiệp FDI đề xuất Vietcombank tài trợ dự án xây dựng nhà máy điện rác thông minh có tổng mức đầu tư 5.000 tỷ đồng. Dự án nhận được khoản tài trợ ưu đãi dài hạn trị giá 1.500 tỷ đồng từ nguồn tài khóa hỗ trợ môi trường của Chính phủ với mức lãi suất ưu đãi chỉ 5%/năm trong 15 năm. Anh/ chị cần xây dựng một mô hình thẩm định tài chính chuyên sâu như thế nào để đánh giá chính xác giá trị gia tăng thực tế mà khoản vay ưu đãi này mang lại cho tổng giá trị dự án nhằm trình Hội đồng tín dụng quyết định phê duyệt cấp tín dụng?", "o": ["Tính toán chi phí vốn bình quân gia quyền (WACC) điều chỉnh bằng cách lấy trung bình cộng giữa lãi suất ưu đãi và lãi suất thương mại.", "Chiết khấu toàn bộ dòng tiền tự do của dự án theo tỷ suất sinh lời đòi hỏi của vốn cổ phần có sử dụng đòn bẩy tài chính.", "Áp dụng mô hình Giá trị hiện tại điều chỉnh (APV) để tách biệt giá trị dự án cơ sở và giá trị hiện tại của khoản nợ vay ưu đãi.", "Sử dụng phương pháp tỷ số hoàn vốn nội bộ (IRR) điều chỉnh để loại bỏ hoàn toàn tác động của lá chắn thuế thu nhập doanh nghiệp."], "a": 2, "g": ""}, {"id": "TD.12.031", "q": "Chi nhánh triển khai áp dụng công nghệ Rô bốt (RPA) tự động đọc Tờ trình phê duyệt tín dụng để tạo Hợp đồng tín dụng và Danh mục các điều kiện giải ngân. Khi anh/ chị thực hiện kiểm tra Khế ước giải ngân do RPA tạo ra, anh/ chị phát hiện RPA đã bỏ sót một điều kiện phê duyệt đặc biệt: \"Khách hàng phải nộp Giấy phép về môi trường trước khi ngân hàng thực hiện giải ngân đợt 2\". Nguyên nhân là do điều kiện này được ghi ở phần ghi chú, không nằm trong các nội dung chính của Tờ trình. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Phê duyệt Hợp đồng tín dụng và cho phép giải ngân bình thường vì cho rằng RPA thực hiện thì chắc chắn là chính xác và không cần kiểm tra lại.", "Yêu cầu loại bỏ hoàn toàn kết quả do RPA thực hiện và bắt buộc tất cả chuyên viên soạn thảo Hợp đồng tín dụng và Danh mục các điều kiện giải ngân thủ công bằng tay 100%.", "Bổ sung điều kiện \"Giấy phép về môi trường\" vào Danh mục kiểm soát giải ngân và yêu cầu khách hàng cung cấp trước khi giải ngân, gửi phản hồi cho bộ phận công nghệ .", "Phê duyệt Hợp đồng tín dụng và yêu cầu Cán bộ Quan hệ khách hàng tự chịu trách nhiệm nếu sau này thanh tra phát hiện thiếu Giấy phép về môi trường."], "a": 2, "g": ""}, {"id": "TD.12.032", "q": "Một Chuyên viên Định giá tài sản đang xử lý hồ sơ định giá một tài sản bảo đảm là Quyền sử dụng đất. Hệ thống bốc tách dữ liệu tự động bằng công nghệ nhận dạng ký tự quang học (OCR) được Vietcombank triển khai để trích xuất thông tin từ Giấy chứng nhận Quyền sử dụng đất (Sổ đỏ). Tuy nhiên, đối với phần \"Sơ đồ thửa đất\" và \"Nội dung thay đổi, bổ sung\" ở trang 4 bị mờ nhòe do bản quét (scan) chất lượng thấp, OCR nhận diện sai số thửa đất và diện tích đất. Anh/ Chị sẽ xử lý trường hợp này như thế nào?", "o": ["Chấp nhận toàn bộ dữ liệu do hệ thống OCR trích xuất tự động để đưa vào Báo cáo định giá tài sản nhằm đảm bảo đáp ứng chỉ tiêu thời gian xử lý hồ sơ (SLA).", "Thực hiện đối chiếu thủ công với bản gốc/bản sao công chứng và yêu cầu cán bộ khách hàng scan lại sổ đỏ với độ phân giải tối thiểu 300 DPI.", "Chủ động thực hiện chỉnh sửa số liệu \"Sơ đồ thửa đất\" và \"Nội dung thay đổi, bổ sung\" trên phần mềm định giá theo trí nhớ cá nhân mà không cần kiểm tra lại tài liệu gốc.", "Hủy bỏ hoàn toàn việc sử dụng hệ thống OCR, quay lại nhập liệu thủ công 100% tất cả các trường thông tin trên sổ đỏ cho mọi hồ sơ định giá tiếp theo."], "a": 1, "g": ""}, {"id": "TD.12.033", "q": "Vietcombank đưa vào vận hành Mô hình định giá tự động bằng Trí tuệ nhân tạo (AI) để định giá TSBĐ là bất động sản. Khi Chuyên viên định giá tài sản định giá một căn hộ chung cư tại Hà Nội, mô hình định giá sử dụng AI đưa ra kết quả định giá 6,5 tỷ đồng dựa trên dữ liệu lớn từ các giao dịch của các khu vực lân cận. Tuy nhiên, qua phân tích của anh/ chị, căn hộ này nằm ở góc bị che khuất tầm nhìn và đang có tranh chấp nhỏ về không gian chung/ công cộng với chủ đầu tư. Anh/ chị sẽ giải quyết trường hợp này như thế nào?", "o": ["Bỏ qua các yếu tố bất lợi về TSBĐ trên thực địa, sử dụng ngay mức giá 6,5 tỷ đồng do AI xuất ra vì mô hình AI luôn chính xác hơn nhận định cảm quan của con người.", "Dùng kết quả của AI để tham chiếu, điều chỉnh giảm giá trị định giá dựa trên các yếu tố bất lợi và ghi rõ lý do điều chỉnh trong Báo cáo định giá.", "Từ chối sử dụng mô hình AI và đề xuất Ban Giám đốc phê duyệt định giá bằng 3 tỷ đồng đối với căn hộ này.", "Báo cáo lỗi hệ thống AI lên Trung tâm Công nghệ Vietcombank vì mô hình không tự động thu thập được các thông tin về vị trí bất lợi và tranh chấp tại thực địa."], "a": 1, "g": ""}, {"id": "TD.12.034", "q": "Để xây dựng cơ sở dữ liệu về giá TSBĐ là bất động sản trên thị trường, Trung tâm Định giá triển khai áp dụng công nghệ Rô bốt (RPA) tự động thu thập dữ liệu về giá bất động sản từ các cổng thông tin uy tín trực tuyến trên mạng hằng ngày. Sáng nay, hệ thống RPA báo lỗi dừng hoạt động do một trang web bất động sản lớn thay đổi cấu trúc giao diện HTML. Hồ sơ định giá tài sản của anh/ chị đang cần gấp dữ liệu về giá bất động sản. Anh/ chị sẽ xử lý sự cố như thế nào?", "o": ["Chờ bộ phận công nghệ thông tin (IT) của Ngân hàng khắc phục sự cố hệ thống RPA mà không thực hiện bất kỳ thao tác nào khác.", "Tự thu thập dữ liệu bằng cách thủ công để xử lý cho hồ sơ hiện tại, gửi yêu cầu hỗ trợ có mô tả chi tiết lỗi cho IT để sửa lỗi RPA.", "Tự ý truy cập vào cơ sở dữ liệu của hệ thống RPA để sửa lỗi nhằm đáp ứng kịp tiến độ xử lý hồ sơ gấp.", "Lấy mức giá của một bất động sản ở vị trí lân cận từ 1 năm trước trong hệ thống để đưa vào hồ sơ định giá hiện tại đang cần gấp để hoàn thành công việc."], "a": 1, "g": ""}, {"id": "TD.12.035", "q": "Trung tâm Định giá Tài sản Vietcombank triển khai dự án \"Làm sạch và số hóa dữ liệu TSBĐ\" nhằm số hóa toàn bộ 200.000 hồ sơ TSBĐ đang lưu trữ dưới dạng bản cứng bằng giấy. Hệ thống sử dụng công nghệ nhận dạng ký tự quang học (OCR) và công nghệ Rô bốt (RPA) để tự động đọc tài liệu, bóc tách, phân loại và lưu trữ dữ liệu TSBĐ vào Cơ sở dữ liệu tập trung. Anh/ chị được phân công làm Trưởng nhóm kiểm soát chất lượng dữ liệu số hóa. Theo anh/ chị thì phương pháp nào sau đây là hiệu quả nhất?", "o": ["Kiểm tra hồ sơ đã số hóa dựa trên điểm số tin cậy của OCR: kiểm tra 100% các hồ sơ có điểm tin cậy < 85%, kiểm tra xác suất 5% các hồ sơ có điểm tin cậy > 95%.", "Cho phép hệ thống tự động lưu trữ toàn bộ dữ liệu của 200.000 hồ sơ vào cơ sở dữ liệu tập trung mà không cần bất kỳ sự kiểm tra nào của con người vì tin cậy vào công nghệ OCR và RPA.", "Yêu cầu toàn bộ nhân viên trong nhóm thực hiện kiểm tra và đối chiếu lại thủ công 100% dữ liệu của 200.000 hồ sơ đã được số hóa tự động bằng công nghệ OCR và RPA để đảm bảo độ chính xác tuyệt đối trước khi lưu trữ.", "Không sử dụng công nghệ OCR và RPA, yêu cầu nhân viên hợp đồng thời vụ nhập thủ công lại toàn bộ dữ liệu của 200.000 hồ sơ để đảm bảo không phụ thuộc vào công nghệ."], "a": 0, "g": ""}, {"id": "TD.12.036", "q": "Hệ thống OCR trích xuất dữ liệu từ chứng từ pdf đang có nhiều lỗi ở phần thông tin thế chấp tài sản là xe cơ giới. Theo anh/ chị thì cách tổng hợp nguyên nhân tốt nhất là gì?", "o": ["Kết luận lỗi bóc tách dữ liệu là do người dùng sử dụng công cụ chưa thành thạo vì hệ thống OCR thường chỉ sai khi người vận hành không đúng quy trình.", "Tách nguyên nhân theo chất lượng ảnh, độ chính xác của OCR, quy tắc đối chiếu dữ liệu, quy trình xử lý lỗi và những phần cần con người kiểm tra lại.", "Kết luận lỗi bóc tách dữ liệu là do tài liệu pdf đầu vào có chất lượng thấp, không cần xem thêm về quy tắc bóc tách OCR hoặc ánh xạ dữ liệu.", "Tạm chấp nhận việc sử dụng kết quả OCR vì tỷ lệ lỗi ở tài liệu về xe cơ giới thường ít ảnh hưởng hơn lỗi ở phần bất động sản và hàng tồn kho."], "a": 1, "g": ""}, {"id": "TD.12.037", "q": "Hệ thống Cảnh báo sớm (EWS) ứng dụng Trí tuệ Nhân tạo (AI) của Vietcombank tự động phân tích dòng tiền trên tài khoản thanh toán của một khách hàng do anh/ chị quản lý và phát hiện: \"Tần suất giao dịch giảm 70% so với bình quân 6 tháng trước, đồng thời xuất hiện các khoản chuyển tiền liên tục sang tài khoản cá nhân của chủ doanh nghiệp tại ngân hàng khác\". Hệ thống gắn nhãn cảnh báo Rủi ro Dòng tiền Cấp độ Vàng. Anh/ chị sẽ xử trường hợp này như thế nào?", "o": ["Bỏ qua cảnh báo của hệ thống vì khách hàng vẫn đang thực hiện thanh toán cả nợ gốc và lãi đúng hạn hằng tháng.", "Ngay lập tức tiến hành phong tỏa toàn bộ tài khoản thanh toán và tài sản bảo đảm đang thế chấp của khách hàng tại Chi nhánh mà không cần thông báo cho khách hàng.", "Phối hợp với Chuyên viên Khách hàng (RM) kiểm tra sau giải ngân đột xuất và yêu cầu chủ doanh nghiệp giải trình về việc chuyển tiền sang ngân hàng khác.", "Tắt tính năng cảnh báo tự động của hệ thống EWS để tập trung vào công việc xử lý hồ sơ và đảm bảo tiến độ hoàn thành trong giờ làm việc."], "a": 2, "g": ""}, {"id": "TD.12.038", "q": "Anh/ chị cần kiểm tra tình trạng pháp lý và thứ tự ưu tiên thanh toán của một TSBĐ là Bất động sản trước khi thực hiện giải ngân. Chi nhánh áp dụng công nghệ Rô bốt (RPA) kết nối tự động với Cổng thông tin Giao dịch bảo đảm quốc gia. RPA trả về kết quả: \"TSBĐ đang có một giao dịch bảo đảm phát sinh cách đây 2 ngày tại Ngân hàng X chưa thực hiện giải chấp\". Tuy nhiên, khách hàng khẳng định họ đã thực hiện giải chấp xong và nộp cho bạn một Giấy giải chấp đăng ký thế chấp TSBĐ bản bằng giấy. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Tin tưởng tuyệt đối vào Giấy giải chấp đăng ký thế chấp TSBĐ bản bằng giấy do khách hàng nộp và tiến hành giải ngân ngay.", "Tạm dừng giải ngân, yêu cầu khách hàng làm việc với Ngân hàng X và Văn phòng Đăng ký đất đai để cập nhật trạng thái đã xóa thế chấp trên hệ thống, sau đó cho RPA chạy kiểm tra lại.", "Cho rằng RPA bị lỗi, sử dụng Giấy giải chấp đăng ký thế chấp TSBĐ bản giấy của khách hàng, xóa dữ liệu cảnh báo trên hệ thống của Vietcombank.", "Thực hiện giải ngân 50% số tiền vay và giữ lại 50% số tiền còn lại cho đến khi khách hàng nộp thêm hồ sơ TSBĐ khác."], "a": 1, "g": ""}, {"id": "TD.12.039", "q": "Một địa phương nơi Chi nhánh đang hoạt động bị ảnh hưởng bởi bão lũ thiên tai. Ngân hàng Nhà nước ban hành chính sách hỗ trợ khách hàng được cơ cấu lại thời hạn trả nợ. Vietcombank triển khai công nghệ Rô bốt (RPA) kết hợp với Trí tuệ Nhân tạo (AI) để tự động quét danh sách các khoản vay của khách hàng bị ảnh hưởng bởi bão lũ thiên tai, lập phương án cơ cấu lại thời hạn trả nợ dự kiến. Anh/ Chị nhận được danh sách 100 khách hàng do RPA đề xuất. Anh/ chị sẽ xử lý công việc này như thế nào?", "o": ["Phê duyệt ngay thời hạn trả nợ mới của 100 khách hàng trên hệ thống theo kết quả của RPA, không cần kiểm tra hồ sơ xác nhận thiệt hại do chính quyền địa phương cấp.", "Không sử dụng danh sách các khoản vay được tái cơ cấu thời hạn trả nợ do RPA lập, yêu cầu tất cả 100 khách hàng phải đến quầy làm lại thủ tục cơ cấu lại thời hạn trả nợ.", "Trên cơ sở danh sách do RPA lập, đối chiếu hồ sơ các khoản vay với văn bản xác nhận thiệt hại của địa phương, điều chỉnh thời hạn trả nợ phù hợp cho khách hàng.", "Tạm thời chưa thực hiện hành động gì, chờ cho đến khi các khoản vay này bị quá hạn chuyển sang nợ xấu rồi mới xử lý thủ tục cơ cấu lại thời hạn trả nợ cho khách hàng."], "a": 2, "g": ""}, {"id": "TD.12.040", "q": "Anh/ chị chịu trách nhiệm kiểm soát tính tuân thủ giải ngân đối với các khoản vay Khách hàng Doanh nghiệp lớn. Hệ thống Rô bốt (RPA) tự động rà soát 100% toàn bộ 1.000 hồ sơ giải ngân trong tháng và phát hiện 15 hồ sơ tại 3 Chi nhánh có hiện tượng: \" Số tiền giải ngân thực tế vượt quá giá trị hợp đồng tín dụng gốc đã được phê duyệt là 5%\". Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Bỏ qua cảnh báo của hệ thống RPA vì các khoản vay này đều do Chi nhánh tự chịu trách nhiệm thẩm định và giải ngân.", "Sử dụng dữ liệu trên hệ thống RPA, lập Báo cáo kiểm soát tuân thủ, yêu cầu 3 Chi nhánh tạm dừng giải ngân và giải trình trong vòng xx giờ.", "Yêu cầu bộ phận công nghệ của ngân hàng tắt tính năng cảnh báo tự động của hệ thống RPA để tránh làm tăng tỷ lệ vi phạm tuân thủ trên báo cáo gửi Ngân hàng Nhà nước.", "Yêu cầu tất cả các Chi nhánh phải chuyển toàn bộ hồ sơ giải ngân bản cứng bằng giấy về Trụ sở chính để kiểm tra và lưu trữ."], "a": 1, "g": ""}, {"id": "TD.12.041", "q": "Anh/ chị thực hiện kiểm soát một hồ sơ giải ngân khoản vay trị giá xx triệu USD của một Tập đoàn đa quốc gia. Hồ sơ bao gồm Bộ chứng từ L/C, Vận đơn đường biển (B/L), Tờ khai Hải quan và Hóa đơn thương mại. Ngân hàng sử dụng Hệ thống công nghệ nhận dạng ký tự quang học (OCR) để tự động bóc tách và đối chiếu dữ liệu giữa các chứng từ kể trên. Hệ thống OCR đưa ra cảnh báo: \"Tên tàu vận tải trên Vận đơn (B/L) không thuộc danh sách tàu được phép cập cảng và vi phạm quy định cấm vận (Sanction List) của OFAC\". Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Cho phép giải ngân bình thường vì khoản vay này đã được Lãnh đạo Chi nhánh phê duyệt.", "Tạm dừng giải ngân, kiểm tra thủ công tên tàu vận chuyển với dữ liệu về cấm vận, báo cáo Phòng Quản trị Rủi ro Trụ sở chính để xử lý.", "Cho phép giải ngân và yêu cầu Chi nhánh sửa lại tên tàu vận tải trên hệ thống OCR để không còn phát sinh cảnh báo vi phạm quy định về cấm vận.", "Từ chối phê duyệt giải ngân, yêu cầu doanh nghiệp hủy bỏ toàn bộ hợp đồng thương mại quốc tế này ngay lập tức."], "a": 1, "g": ""}, {"id": "TD.12.042", "q": "Anh/ chị được giao nhiệm vụ lập Báo cáo đánh giá rủi ro tập trung về TSBĐ của khách hàng doanh nghiệp lớn trên toàn hệ thống. Ngân hàng sử dụng công nghệ Trí tuệ Nhân tạo (AI) để quản trị rủi ro tập trung TSBĐ, hệ thống đưa ra cảnh báo: \"70% giá trị TSBĐ là Bất động sản thương mại của các khoản vay khách hàng doanh nghiệp lớn đang tập trung tại 2 dự án lớn thuộc khu vực có rủi ro cao về quy hoạch sử dụng đất đai\". Anh/ chị sẽ giải quyết trường hợp này như thế nào?", "o": ["Bỏ qua cảnh báo của hệ thống sử dụng công nghệ AI vì các bất động sản thương mại này đều đã có Sổ đỏ hợp pháp tại thời điểm nhận thế chấp.", "Từ chối nhận mới TSBĐ là Bất động sản thương mại tại khu vực này, yêu cầu các khách hàng bổ sung TSBĐ khác thay thế TSBĐ đang có rủi ro. 37", "Yêu cầu các Chi nhánh khởi kiện toàn bộ các doanh nghiệp có TSBĐ là Bất động sản thương mại tại 2 dự án này để thu hồi nợ trước hạn, hạn chế rủi ro cho ngân hàng.", "Yêu cầu bộ phận công nghệ thông tin của ngân hàng tắt tính năng cảnh báo này trên hệ thống AI để làm đẹp báo cáo đánh giá rủi ro và đảm bảo chỉ tiêu doanh số của các chi nhánh."], "a": 1, "g": ""}, {"id": "TD.12.044", "q": "Anh/ chị đang thẩm định hồ sơ hạn mức tín dụng 3.000 tỷ đồng cho một Tập đoàn đa quốc gia (MNC). Để hỗ trợ công việc, anh/ chị sử dụng công nghệ Trí tuệ Nhân tạo (AI) để tóm tắt Báo cáo tài chính theo Chuẩn mực Kế toán Quốc tế (IFRS) đã được kiểm toán gồm 300 trang và hồ sơ hạn mức tín dụng của khách hàng. AI đã xuất ra bản tóm tắt và nhìn rất chuyên nghiệp nhưng anh/ chị phát hiện AI đã bỏ qua một khoản \"Nợ tiềm tàng trị giá 500 tỷ đồng do kiện tụng về thuế\" nằm ở Thuyết minh báo cáo tình hình tài chính. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Sử dụng nguyên văn bản tóm tắt của AI để đưa vào Báo cáo thẩm định tín dụng trình Hội đồng Tín dụng Trung ương để tiết kiệm thời gian.", "Từ chối sử dụng bản tóm tắt của AI và yêu cầu hủy bỏ hoàn toàn việc ứng dụng AI trong quy trình thẩm định và phê duyệt tín dụng của ngân hàng để giảm thiểu rủi ro và sai sót của AI.", "Thực hiện xóa bỏ khoản Nợ tiềm tàng trong bản Thuyết minh tình hình tài chính khỏi hồ sơ của doanh nghiệp để thông tin trong Báo cáo thẩm định tín dụng khớp đúng với nội dung bản tóm tắt của AI.", "Bổ sung khoản Nợ tiềm tàng vào Báo cáo thẩm định tín dụng, phân tích lại chỉ số thanh toán và khả năng chịu rủi ro của Tập đoàn, gửi ý kiến cho bộ phận công nghệ để sửa lỗi của AI."], "a": 3, "g": ""}, {"id": "TD.12.045", "q": "Vietcombank triển khai công nghệ Trí tuệ Nhân tạo (AI) để tự động hóa quy trình Phê duyệt Tín dụng. Hệ thống AI tự động thu thập dữ liệu ngành, chạy mô hình xếp hạng tín dụng, tính toán hạn mức tín dụng đề xuất và dự thảo Báo cáo Thẩm định Tín dụng. Khi thẩm định khoản vay 2.000 tỷ đồng cho một Doanh nghiệp FDI ngành bán dẫn, hệ thống AI đề xuất \"Đồng ý cho doanh nghiệp vay tín chấp \". Tuy nhiên, qua phân tích xu hướng địa chính trị và chuỗi cung ứng bán dẫn toàn cầu, anh/ chị nhận thấy ngành bán dẫn đang bước vào chu kỳ suy thoái ngắn hạn. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Phê duyệt hạn mức tín dụng đúng theo đề xuất của hệ thống AI là cho doanh nghiệp FDI vay tín chấp do hệ thống AI đã tính toán dựa trên dữ liệu lớn (Big Data) nên hoàn toàn chính xác.", "Từ chối phê duyệt hồ sơ vay vốn của doanh nghiệp FDI do ngành bán dẫn đang bước vào chu kỳ suy thoái để tránh rủi ro tín dụng cho ngân hàng.", "Phê duyệt cấp hạn mức trên cơ sở đề xuất của AI, kèm theo điều kiện: Công ty mẹ của doanh nghiệp FDI phải phát hành Thư bảo lãnh thanh toán hoặc bổ sung TSBĐ.", "Chỉnh sửa dữ liệu đầu vào của hệ thống AI để hệ thống xuất ra kết quả thẩm định tín dụng đúng theo ý muốn của anh/ chị và thực hiện phê duyệt hạn mức tín dụng cho khách hàng FDI nhằm đảm bảo chỉ tiêu kinh doanh của chi nhánh."], "a": 2, "g": ""}, {"id": "TD.12.046", "q": "Anh/ chị thực hiện thẩm định tín dụng hạn mức tín dụng cho một Tập đoàn FDI sử dụng Báo cáo tài chính hợp nhất được lập theo Chuẩn mực Kế toán Quốc tế (IFRS). Hệ thống sử dụng công nghệ nhận dạng ký tự quang học (OCR) của ngân hàng thực hiện bóc tách dữ liệu Báo cáo tài chính hợp nhất theo IFRS và tự động quy đổi sang Báo cáo Tình hình tài chính theo Chuẩn mực Kế toán Việt Nam (VAS) trên phần mềm Xếp hạng tín dụng nội bộ của ngân hàng. Do sự khác biệt giữa IFRS và VAS trong việc ghi nhận \"Tài sản quyền sử dụng (Right-of-Use Assets)\" và \"Nợ thuê tài chính (Lease Liabilities)\" theo IFRS 16, hệ thống OCR tính toán tỷ lệ Nợ/Vốn chủ sở hữu (D/E) của doanh nghiệp bị vượt ngưỡng quy định của ngân hàng. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Từ chối phê duyệt hồ sơ hạn mức tín dụng của doanh nghiệp do chỉ số Nợ/Vốn chủ sở hữu sau khi quy đổi sang VAS bị vượt ngưỡng quy định của ngân hàng.", "Phân tích bản chất kế toán: bóc tách ảnh hưởng của IFRS 16 đối với nợ thuê tài chính vận hành, thực hiện hiệu chỉnh chỉ số tài chính (Adjusted Financial Ratios) về đúng bản chất dòng tiền hoạt động theo VAS, trình giải trình rõ ràng trong Báo cáo rà soát rủi ro gửi Lãnh đạo Phòng.", "Thực hiện bỏ qua sự sai lệch giữa IFRS và VAS, sử dụng chỉ số Nợ/Vốn chủ sở hữu bị vượt ngưỡng quy định của ngân hàng để xếp hạng tín dụng doanh nghiệp xuống hạng Rủi ro rất cao (D).", "Yêu cầu doanh nghiệp FDI gửi lại Báo cáo tài chính hợp nhất đã được kiểm toán 3 năm gần nhất được lập theo đúng Chuẩn mực Kế toán Việt Nam (VAS) rồi mới tiến hành thẩm định tín dụng."], "a": 1, "g": ""}, {"id": "TD.12.047", "q": "Anh/ chị thực hiện thẩm định hồ sơ cấp hạn mức tín dụng 30 tỷ đồng của một doanh nghiệp SME ngành thương mại. Ngân hàng sử dụng công nghệ nhận dạng ký tự quang học (OCR) để bóc tách dữ liệu Tờ khai thuế GTGT và Báo cáo tình hình tài chính của doanh nghiệp , đồng thời sử dụng công nghệ Rô bốt (RPA) để tự động tra cứu dữ liệu về doanh thu và thuế của doanh nghiệp trên hệ thống thuế điện tử của Cục thuế qua cổng kết nối API. Hệ thống RPA phát hiện: \"Doanh thu trên Tờ khai thuế GTGT do doanh nghiệp nộp cho ngân hàng sau khi bóc tách dữ liệu bằng OCR đạt 80 tỷ đồng, nhưng dữ liệu trên hệ thống thuế điện tử của Cục thuế chỉ ghi nhận 30 tỷ đồng (chênh lệch 50 tỷ đồng)\". Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Bỏ qua sự chênh lệch số liệu này vì cho rằng hệ thống OCR bị đọc sai phông chữ và phê duyệt khoản vay của doanh nghiệp dựa trên số doanh thu là 80 tỷ đồng.", "Từ chối phê duyệt hồ sơ vay vốn và đưa doanh nghiệp vào danh sách đen của chi nhánh do doanh nghiệp đã gian lận về doanh thu và không cần thực hiện xác minh.", "Sử dụng dữ liệu của Cục Thuế, yêu cầu doanh nghiệp giải trình, điều chỉnh giảm hạn mức cấp tín dụng phù hợp với doanh thu 30 tỷ đồng.", "Hướng dẫn doanh nghiệp nộp lại bản in Tờ khai thuế GTGT và Báo cáo tình hình tài chính bằng giấy có đầy đủ chữ ký và đóng dấu đỏ để bỏ qua bước kiểm tra dữ liệu bằng RPA."], "a": 2, "g": ""}, {"id": "TD.12.048", "q": "Anh/ chị thẩm định tín dụng để gia hạn hạn mức cho vay xx tỷ đồng cho Doanh nghiệp SME Z (ngành bán lẻ linh kiện điện tử). Ngân hàng sử dụng mô hình áp dụng công nghệ Trí tuệ Nhân tạo (AI) để dự báo dòng tiền của doanh nghiệp. Sau khi phân tích lịch sử giao dịch trên hệ thống DigiBiz và dữ liệu hóa đơn 2 năm gần nhất của doanh nghiệp, mô hình AI đã đưa ra dự báo: \"Dòng tiền vào của Doanh nghiệp SME Z sẽ sụt giảm 40% trong 6 tháng tới do mất hợp đồng phân phối chính\". Doanh nghiệp Z khẳng định họ sắp ký hợp đồng phân phối mới nhưng chưa cung cấp hợp đồng bằng văn bản đã ký kết chính thức cho ngân hàng. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Phê duyệt gia hạn hạn mức tín dụng xx tỷ đồng dựa trên lời hứa của doanh nghiệp SME Z.", "Từ chối phê duyệt gia hạn hạn mức tín dụng và yêu cầu chi nhánh thực hiện ngay việc thu hồi toàn bộ nợ cũ của doanh nghiệp Z ngay trong ngày.", "Yêu cầu doanh nghiệp SME Z cũng sử dụng công nghệ AI để thực hiện dự báo lại dòng tiền và đảm bảo mô hình AI cho ra kết quả dự báo dòng tiền sẽ tăng trưởng dương trong 6 tháng tới.", "Phê duyệt gia hạn hạn mức nhưng giảm xuống yy tỷ đồng (ứng với mức sụt giảm dòng tiền), kèm điều kiện giải ngân theo từng hợp đồng có xác nhận của bên mua."], "a": 3, "g": ""}, {"id": "TD.12.049", "q": "Ngân hàng sử dụng công nghệ Trí tuệ Nhân tạo (AI) để tự động tổng hợp dữ liệu từ hồ sơ vay và soạn thảo dự thảo Báo cáo Thẩm định Tín dụng SME. Sau khi kiểm tra lại dự thảo Báo cáo Thẩm định Tín dụng do AI lập, anh/ chị phát hiện AI đã tự động suy luận và viết thêm câu: \"Doanh nghiệp có khả năng nhận được gói hỗ trợ lãi suất 2% của Chính phủ\" - trong khi doanh nghiệp này không thuộc đối tượng được thụ hưởng chính sách hỗ trợ lãi suất. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Giữ nguyên câu văn của AI vì cho rằng văn bản do AI viết sẽ làm tăng tính thuyết phục và khả năng phê duyệt Báo cáo Thẩm định Tín dụng.", "Xóa bỏ thông tin sai lệch của AI, sửa lại đúng lãi suất áp dụng cho doanh nghiệp, gửi phản hồi cho bộ phận công nghệ để sửa lỗi.", "Tư vấn cho doanh nghiệp SME thực hiện các thủ tục để được hưởng hỗ trợ lãi suất 2% của Chính phủ theo đúng với dự thảo Báo cáo Thẩm định Tín dụng do AI đã lập.", "Từ chối sử dụng dự thảo Báo cáo Thẩm định Tín dụng do AI lập, đề xuất hủy bỏ việc sử dụng AI và cán bộ tự mình thực hiện lập Báo cáo."], "a": 1, "g": ""}, {"id": "TD.12.050", "q": "Anh/ chị đang thẩm định hồ sơ cấp hạn mức tín dụng 1,5 tỷ đồng cho một Hộ Kinh Doanh thuộc Nhóm 2 theo Nghị định 68/2026/NĐ-CP. Ngân hàng sử dụng Mô hình Chấm điểm tự động áp dụng Trí tuệ Nhân tạo AI (AI Auto-Scoring) kết hợp sử dụng dữ liệu thanh toán thông qua việc quét mã VietQR hằng ngày và dữ liệu trên hóa đơn điện tử của Hộ kinh doanh. Mô hình AI đề xuất cấp hạn mức tín dụng 1,5 tỷ đồng cho Hộ kinh doanh. Tuy nhiên, hệ thống tra cứu CIC tự động sử dụng công nghệ Rô bốt (RPA) của ngân hàng phát hiện chủ hộ kinh doanh vừa bị phát sinh nợ quá hạn 15 ngày tại một công ty tài chính khác. Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Phê duyệt hạn mức 1,5 tỷ đồng vì dữ liệu về dòng tiền thanh toán qua VietQR hằng ngày của hộ kinh doanh rất lớn và ổn định.", "Thực hiện xóa dữ liệu về thông tin nợ quá hạn trên báo cáo CIC để hệ thống AI phê duyệt hạn mức tín dụng tự động, đảm bảo mục tiêu tự động hóa quy trình của ngân hàng.", "Phê duyệt cho chủ hộ kinh doanh vay dưới hình thức tín chấp cá nhân, không thực hiện kê khai thu nhập từ hoạt động hộ kinh doanh.", "Không sử dụng kết quả của AI, yêu cầu chủ hộ kinh doanh thanh toán hết nợ quá hạn trước khi xem xét cấp hạn mức tín dụng."], "a": 3, "g": ""}, {"id": "TD.12.052", "q": "Một chuyên viên định giá tài sản nhận hồ sơ định giá một nhà máy sản xuất linh kiện điện tử trong khu công nghiệp (bao gồm tài sản gắn liền với đất và quyền sử dụng đất) thế chấp cho khoản vay của một doanh nghiệp phụ trợ FDI. Doanh nghiệp đã trả tiền thuê đất trong khu công nghiệp một lần cho cả thời gian thuê 50 năm. Chủ dự án liên tục thúc ép chuyên viên định giá phải áp dụng phương pháp so sánh thị trường dựa trên giá đất của các khu đô thị lân cận để tăng khống giá trị tài sản bảo đảm. Anh/ Chị sẽ giải quyết vấn đề này như thế nào?", "o": ["Chấp nhận phương án so sánh với giá đất khu đô thị lân cận vì đây là phương pháp định giá phổ biến và dễ được thị trường chấp nhận nhất", "Phân tích sự khác biệt giữa đất công nghiệp và đất đô thị, kiên định áp dụng phương pháp chi phí kết hợp dòng tiền chiết khấu.", "Tư vấn khách hàng tự thuê một công ty định giá độc lập bên ngoài định giá theo ý muốn và mang kết quả đó về để Vietcombank phê duyệt", "Từ chối hồ sơ định giá của khách hàng và đề xuất chi nhánh hủy bỏ ngay lập tức hạn mức tín dụng của doanh nghiệp này"], "a": 1, "g": ""}, {"id": "TD.12.062", "q": "Anh/ chị thực hiện thẩm định hồ sơ vay mua nhà ở xã hội (NOXH) trị giá 1 tỷ đồng của một khách hàng cá nhân. Để chứng minh thu nhập, khách hàng nộp Sao kê tài khoản ngân hàng 6 tháng và Hợp đồng lao động. Hệ thống của ngân hàng sử dụng công nghệ nhận dạng ký tự quang học (OCR) để bóc tách dữ liệu từ bản Sao kê tài khoản ngân hàng và Hợp đồng lao động, sử dụng Trí tuệ Nhân tạo (AI) để phân tích dòng tiền. AI đã phát hiện: \"Nội dung chuyển tiền hằng tháng ghi 'Tra luong' nhưng tiền lại được chuyển khoản từ tài khoản cá nhân của một người thân chứ không phải từ tài khoản thanh toán của Công ty\". Anh/ chị sẽ xử lý trường hợp này như thế nào?", "o": ["Phê duyệt khoản vay và chấp nhận đây là thu nhập từ lương hợp lệ cho khách hàng vì số tiền chuyển về tài khoản của khách hàng rất đều đặn hằng tháng.", "Sử dụng kết quả phân tích của AI, từ chối phê duyệt hồ sơ vay mua nhà của khách hàng và khuyên khách hàng không nên mua nhà nữa.", "Yêu cầu khách hàng giải trình, cung cấp xác nhận chi trả lương của Công ty, chứng từ nộp thuế thu nhập cá nhân trước khi xem xét hồ sơ vay.", "Tư vấn cho khách hàng tự sửa lại tài khoản chuyển tiền ( sử dụng tài khoản ngân hàng của công ty) trong tài liệu Sao kê tài khoản ngân hàng (file PDF) trước khi nộp lại hồ sơ vay cho ngân hàng."], "a": 2, "g": ""}, {"id": "TD.13.001", "q": "Trung tâm định giá tài sản bảo đảm của VCB là:", "o": ["Tổ chức có chức năng thẩm định giá", "Đơn vị thuộc Vietcombank và kết quả cung cấp có giá trị nội bộ trong Vietcombank", "Đơn vị thuộc Vietcombank và kết quả cung cấp có giá trị trong cả nước, chịu sự quy định bởi pháp luật về giá", "Đơn vị thuộc Vietcombank và cần tuân thủ các quy định về định giá và thẩm định giá do Bộ Tài chính ban hành"], "a": 1, "g": "Điều 40, 48, 49 Luật Giá 2023."}, {"id": "TD.13.002", "q": "Nhận định nào sau đây đúng về cán bộ định giá TSBĐ tại ngân hàng:", "o": ["Yêu cầu có chứng chỉ đào tạo thẩm định giá theo quy định", "Yêu cầu có thẻ thẩm định viên về giá", "Yêu cầu có chứng chỉ định giá bất động sản", "Tất cả đều sai"], "a": 3, "g": "Điều 44, 45 Luật Giá 2023."}, {"id": "TD.13.003", "q": "Hiện nay, tại Việt Nam, cán bộ định giá TSBĐ tại Ngân hàng khi thực hiện nghiệp vụ định giá TSBĐ cần phải tuân thủ:", "o": ["Chuẩn mực thẩm định giá quốc tế", "Chuẩn mực thẩm định giá do Bộ Tài chính Việt Nam ban hành", "Chuẩn mực thẩm định giá do Bộ Tài chính Việt Nam ban hành, trong trường hợp sử dụng Chuẩn mực thẩm định giá quốc tế thì cần được nêu rõ và giải thích trong Chứng thư/Báo cáo/Tờ trình định giá", "Tất cả đều chưa chính xác"], "a": 3, "g": "Điều 40, 42 Luật Giá 2023."}, {"id": "TD.13.004", "q": "Khi phỏng vấn mối quan hệ giữa người sử dụng tài sản và chủ sở hữu, Cán bộ định giá cần ghi nhận mối quan hệ nào?", "o": ["Mối quan hệ nhân thân: gia đình, bạn bè, đồng nghiệp, …", "Mối quan hệ tài sản: cho thuê, mua-bán, cho mượn, cho ở nhờ, …", "Chỉ cần 1 trong 2 mối quan hệ: nhân thân và tài sản", "Bắt buộc ghi nhận 2 mối quan hệ: nhân thân và tài sản"], "a": 3, "g": ""}, {"id": "TD.13.005", "q": "Theo chuẩn mực thẩm định giá Việt Nam, phương pháp nào sau đây thuộc Cách tiếp cận từ chi phí?", "o": ["Phương pháp chi phí thay thế", "Phương pháp vốn hóa trực tiếp", "Phương pháp dòng tiền chiết khấu", "Phương pháp so sánh"], "a": 0, "g": ""}, {"id": "TD.13.007", "q": "Theo chuẩn mực thẩm định giá Việt Nam, hao mòn của tài sản trong cách tiếp cận từ chi phí được phân loại thành mấy loại?", "o": ["02 loại: vật lý và chức năng", "03 loại: vật lý, chức năng và ngoại biên (kinh tế)", "04 loại: vật lý, chức năng, ngoại biên và pháp lý", "Không phân loại, chỉ áp dụng một tỷ lệ hao mòn chung cho mọi tài sản"], "a": 1, "g": "Thông tư 31/2024/TT-BTC (Chuẩn mực TĐGVN về Thu thập và phân tích thông tin tài sản thẩm định giá), được vận dụng làm khung tham chiếu nghiệp vụ nội bộ."}, {"id": "TD.13.014", "q": "Theo thông lệ quốc tế, nhận định nào sau đây đúng?", "o": ["Lỗi thẩm định sai tài sản không thể xảy ra vì sự trợ giúp của công nghệ và định vị toàn cầu hiện nay.", "Thẩm định viên phải chịu trách nhiệm kết quả thẩm định giá là giá trị thị trường nếu báo cáo định giá sử dụng cơ sở giá trị thị trường.", "Việc có sử dụng hay không một nguyên tắc sẽ không ảnh hưởng trực tiếp đến kết quả thẩm định giá.", "Cả ba nhận định trên đều sai."], "a": 3, "g": "Điều 4- Điều 5/ Thông tư 30/2024/TT-BTC (Cơ sở giá trị thẩm định giá – giá trị thị trường là khoản tiền ước tính, không phải khoản tiền ấn định trước)"}, {"id": "TD.13.015", "q": "Theo thông lệ quốc tế và tại Việt Nam, thông tin so sánh cần đảm bảo các yếu tố so sánh nào?", "o": ["Pháp lý, mục đích sử dụng, thời hạn sử dụng đất, vị trí tài sản: tương đồng với TSBĐ.", "Quy mô: tổng diện tích đất gần bằng, hình dạng và kích thước (rộng x dài) tương tự TSBĐ.", "Loại quy hoạch sử dụng đất: phải cùng nhóm quy hoạch hoặc cùng tính chất quy hoạch.", "Tất cả các đáp án trên đều đúng."], "a": 3, "g": "Thông tư 32/2024/TT-BTC (Chuẩn mực TĐGVN về Cách tiếp cận từ thị trường – phương pháp so sánh)"}, {"id": "TD.13.016", "q": "TSBĐ là đất SXKD thuê trả tiền hàng năm trong KCN với hình thức trả tiền thuê đất hàng năm và tiền hạ tầng trả 1 lần, thuộc KCN VCB nhận thế chấp Quyền phát sinh từ hợp đồng. Tài sản có CTXD đã được công nhận trên Giấy chứng nhận. Chọn câu đúng trong các câu sau:", "o": ["Giá trị Quyền phát sinh từ hợp đồng được xác định theo phương pháp so sánh các tài sản có tính chất pháp lý tương đồng", "Giá trị Quyền phát sinh từ hợp đồng được xác định theo phương pháp chi phí số tiền còn lại đã trả nhưng chưa sử dụng", "Giá trị Quyền phát sinh từ hợp đồng được xác định theo giá trị cao nhất giữa phương pháp so sánh các tài sản có tính chất pháp lý tương đồng và phương pháp chi phí số tiền còn lại đã trả nhưng chưa sử dụng", "Giá trị Quyền phát sinh từ hợp đồng được xác định theo giá trị thấp nhất giữa phương pháp so sánh các tài sản có tính chất pháp lý tương đồng và phương pháp chi phí số tiền còn lại đã trả nhưng chưa sử dụng"], "a": 0, "g": "Thông tư 32/2024/TT-BTC (Cách tiếp cận từ thị trường); Luật Đất đai 2024 về quyền của tổ chức thuê đất trả tiền hàng năm."}, {"id": "TD.13.017", "q": "TSBĐ là đất SXKD thuê trả tiền hàng năm trong KCN với hình thức trả tiền thuê đất 1 lần và tiền hạ tầng trả hàng năm, thuộc KCN VCB nhận thế chấp Quyền phát sinh từ hợp đồng. Tài sản có CTXD đã được công nhận trên Giấy chứng nhận. Chọn câu đúng trong các câu sau:", "o": ["Giá trị Quyền phát sinh từ hợp đồng được xác định theo phương pháp so sánh các tài sản có tính chất pháp lý tương đồng", "Giá trị Quyền phát sinh từ hợp đồng được xác định theo phương pháp chi phí số tiền còn lại đã trả nhưng chưa sử dụng", "Giá trị Quyền phát sinh từ hợp đồng được xác định theo giá trị cao nhất giữa phương pháp so sánh các tài sản có tính chất pháp lý tương đồng và phương pháp chi phí số tiền còn lại đã trả nhưng chưa sử dụng", "Giá trị Quyền phát sinh từ hợp đồng được xác định theo giá trị thấp nhất giữa phương pháp so sánh các tài sản có tính chất pháp lý tương đồng và phương pháp chi phí số tiền còn lại đã trả nhưng chưa sử dụng"], "a": 1, "g": "Thông tư 32/2024/TT-BTC (Cách tiếp cận từ chi phí); Luật Đất đai 2024."}, {"id": "TD.13.019", "q": "Trường hợp thông tin quy hoạch của TSBĐ thẩm định theo bản đồ quy hoạch tại Trung tâm định giá thu thập và văn bản xác minh quy hoạch do Cơ quan Nhà nước cung cấp tại thời điểm thẩm định được căn cứ trên cùng một số quyết định nhưng không đồng nhất với nhau thì thông tin quy hoạch của TSBĐ được xác định như thế nào?", "o": ["Thông tin quy hoạch có mức độ rủi ro cao hơn", "Theo văn bản xác minh quy hoạch được Cơ quan Nhà nước có thẩm quyền cấp", "Theo Giấy chứng nhận", "Theo bản đồ Trung tâm định giá thu thập"], "a": 1, "g": "Thông tư 31/2024/TT-BTC về thu thập, phân tích thông tin tài sản thẩm định giá."}, {"id": "TD.13.022", "q": "Trường hợp đất sản xuất kinh doanh thuê trả tiền thuê đất 1 lần trong KCN và đã được cấp giấy chứng nhận, tuy nhiên khách hàng không cung cấp được hợp đồng thuê đất/thuê lại đất giữa CĐT KCN với người thuê hiện hành, cho phép thay thế hợp đồng thuê đất/thuê lại đất bằng:", "o": ["Cung cấp đồng thời: (i) văn bản xác nhận của CĐT KCN v/v không ký lại hợp đồng thuê đất đối với chủ sở hữu mới và CSH mới được tiếp tục thực hiện quyền, nghĩa vụ của bên thuê đất trong thời gian còn lại của HĐTĐ và (ii) HĐTĐ/thuê lại đất giữa CĐT KCN với người thuê trước đó.", "Hợp đồng thuê đất/thuê lại đất giữa CĐT KCN với người thuê trước đó và trên hợp đồng thuê đất/thuê lại đất không có các điều khoản hạn chế và rủi ro.", "Thông báo v/v nhận thế chấp đất thuê 1 lần gửi đến CĐT KCN và không nhận được phản hồi hoặc Văn bản phản hồi không có nội dung về hạn chế chuyển nhượng/thế chấp tài sản.", "Tất cả đều đúng"], "a": 3, "g": "Luật Đất đai 2024 (quyền chuyển nhượng, thế chấp quyền sử dụng đất của người thuê đất trả tiền một lần); Bộ luật Dân sự 2015 (quyền tài sản, quyền phát sinh từ hợp đồng có thể làm tài sản bảo đảm nếu đáp ứng điều kiện pháp luật)."}, {"id": "TD.13.024", "q": "Ngày 20/04/2025, Cán bộ định giá thực hiện định giá tài sản, nhận thấy có sự khác biệt về thông tin quy hoạch của TSBĐ thẩm định giữa các nguồn cung cấp quy hoạch hiện có, cụ thể: + Căn cứ bản đồ online của Sở quy hoạch kiến trúc tỉnh/TP (bản đồ 1/5000, căn cứ quyết định quy hoạch năm 2022): Đất ở. + Căn cứ văn bản xác minh quy hoạch ngày 01/01/2025 của Phòng QLĐT (bản đồ 1/2000, căn cứ quyết định quy hoạch năm 2022): Đất dân cư xây dựng mới. Trong trường hợp này, thông tin quy hoạch của TSBĐ thẩm định được xác định như thế nào?", "o": ["Quy hoạch của TSBĐ được xác định theo quy hoạch 1/2000 của Phòng QLĐT", "Quy hoạch của TSBĐ được xác định theo quy hoạch 1/5000 của Sở quy hoạch kiến trúc", "Yêu cầu Phòng Khách hàng/Chi nhánh bổ sung văn bản xác minh quy hoạch tại thời điểm thẩm định.", "Tất cả đều sai"], "a": 0, "g": "Thông tư 31/2024/TT-BTC về thu thập, phân tích thông tin tài sản thẩm định giá."}, {"id": "TD.13.025", "q": "TSBĐ được chính chủ sở hữu sử dụng làm văn phòng công ty, cơ sở kinh doanh có bố trí nơi ở cho nhân viên (cho ở nhờ), Cán bộ định giá ghi nhận mối quan hệ giữa người đang sử dụng tài sản và chủ sở hữu như thế nào?", "o": ["Mối quan hệ giữa người sử dụng và chủ sở hữu: chính chủ sở hữu. Diễn giải: CSH làm văn phòng công ty và có bố trí chỗ ở và làm việc cho nhân viên.", "Mối quan hệ giữa người sử dụng và chủ sở hữu: chủ sở hữu và nhân viên công ty.", "Mối quan hệ giữa người sử dụng và chủ sở hữu: chủ sở hữu và nhân viên công ty. Diễn giải: CSH làm văn phòng công ty và có bố trí chỗ ở và làm việc cho nhân viên.", "Tất cả đều sai"], "a": 3, "g": ""}, {"id": "TD.13.026", "q": "Khi thẩm định tài sản cho mục đích cấp tín dụng, trường hợp nào có khả năng xảy ra rủi ro tranh chấp?", "o": ["Người thân của CSH trên Giấy chứng nhận là người hướng dẫn thẩm định", "Quá trình thẩm định tài sản, người hướng dẫn không cho phép Cán bộ định giá tiếp xúc/phỏng vấn người đang ở trong nhà với lý do không muốn người trong nhà biết việc vay vốn ngân hàng.", "Trên đất có nhiều căn nhà sử dụng riêng biệt (có đồng hồ điện, nước riêng, số nhà riêng,…) và người hướng dẫn cho biết các căn nhà trên đang cho thuê.", "Tất cả đều đúng"], "a": 3, "g": ""}, {"id": "TD.13.027", "q": "Thông tư 42/2024/TT-BTC (Chuẩn mực TĐGVN về Thẩm định giá bất động sản) hướng dẫn áp dụng thẩm định giá cho đối tượng nào và trên cơ sở nào?", "o": ["Chỉ áp dụng riêng cho quyền sử dụng đất, không áp dụng cho tài sản gắn liền với đất", "Bất động sản (bao gồm đất và tài sản gắn liền với đất), trên cơ sở vận dụng 03 cách tiếp cận (thị trường, chi phí, thu nhập) đã quy định tại Thông tư 32/2024/TT-BTC, có tính đến đặc thù của bất động sản", "Chỉ áp dụng riêng cho nhà ở thương mại", "Chỉ áp dụng riêng cho bất động sản khu công nghiệp"], "a": 1, "g": "Thông tư 42/2024/TT-BTC"}, {"id": "TD.13.028", "q": "Theo Thông tư 38/2024/TT-BTC, doanh nghiệp thẩm định giá có trách nhiệm báo cáo định kỳ về hoạt động thẩm định giá cho cơ quan nào?", "o": ["Ủy ban nhân dân cấp tỉnh nơi doanh nghiệp đặt trụ sở chính", "Bộ Tài chính (cơ quan quản lý nhà nước về thẩm định giá)", "Ngân hàng Nhà nước Việt Nam", "Không phải báo cáo định kỳ, chỉ báo cáo khi có yêu cầu thanh tra, kiểm tra"], "a": 1, "g": "Thông tư 38/2024/TT-BTC"}, {"id": "TD.13.029", "q": "Khi thực hiện định giá tài sản đang trong quá trình mua bán Cán bộ định giá KHÔNG cần làm gì để hạn chế các rủi ro có thể phát sinh? (có thể chọn nhiều đáp án)", "o": ["Kiểm chứng thông tin giá rao bán/ giá giao dịch của chính tài sản thông qua nhiều kênh (website mua bán, zalo/ facebook, môi giới địa phương, phỏng vấn chính chủ/ người đang sử dụng TSBĐ/ người dân xung quanh,…) để có thêm cơ sở củng cố giá trước khi phát hành báo cáo.", "Yêu cầu chính chủ sở hữu hướng dẫn thẩm định để đảm bảo rủi ro", "Sử dụng các biện pháp nghiệp vụ theo hướng dẫn bộ kịch bản phỏng vấn để xác minh tình trạng sở hữu, tình trạng sử dụng và các dấu hiệu rủi ro giả cách (nếu có).", "Tất cả đều đúng"], "a": 1, "g": ""}, {"id": "TD.13.030", "q": "Mã thông tin tham chiếu XYZ được chính Cán bộ định giá tạo ngày 20/6/2025 với giá rao bán 4 tỷ đồng, giá thương lượng 3.8 tỷ đồng. Cán bộ định giá đã được sử dụng nhiều lần trong các báo cáo định giá trong vòng 3 tháng. Ngày 8/9/2025 Cán bộ định giá nhận được yêu cầu định giá chính tài sản tham chiếu này thì được biết giá giao dịch thực tế của tài sản # 3.2 tỷ đồng, chênh lệch # 16%. Theo Anh/Chị Cán bộ định giá cần làm gì để hạn chế rủi ro này?", "o": ["Mức chênh lệch giá rao bán và giá giao dịch thành công là do nhu cầu của người bán không thể kiểm soát được, rủi ro này...", "Luôn cập nhật giá mới từ nguồn cung cấp thông tin trước khi sử dụng mặc dù thông tin do chính mình khảo sát trước đó", "Hạn chế sử dụng thông tin đã được rao bán trong thời gian dài và thay đổi giá rao", "B và C"], "a": 3, "g": ""}, {"id": "TD.13.031", "q": "Thẩm định viên điều chỉnh giá bán của tài sản so sánh do nó đã được bán 6 tháng trước. Trong trường hợp này, yếu tố điều chỉnh là:", "o": ["Điều kiện bán", "Tính pháp lý của tài sản", "Điều kiện tài chính", "Điều kiện thị trường"], "a": 3, "g": "Căn cứ: Thông tư 32/2024/TT-BTC (Cách tiếp cận từ thị trường – phương pháp so sánh, các yếu tố điều chỉnh)."}, {"id": "TD.13.032", "q": "Trong khi tiến hành thẩm định giá một lô đất trống ở khu dân cư, thẩm định viên nhận thấy lô đất dùng để so sánh so với lô cần thẩm định giá có ưu thế về vị trí trị giá 450 triệu đồng, nhưng lại có yếu thế về kích thước trị giá 150 triệu đồng. Nếu lô đất dùng để so sánh có giá bán 5.200 triệu đồng thì mức giá nào sau đây là mức giá chỉ dẫn của lô đất cần thẩm định:", "o": ["4.600 triệu đồng", "5.800 triệu đồng", "5.500 triệu đồng", "4.900 triệu đồng"], "a": 3, "g": "Căn cứ: Thông tư 32/2024/TT-BTC – nguyên tắc điều chỉnh giá theo từng yếu tố so sánh trong phương pháp so sánh."}, {"id": "TD.13.033", "q": "Giảm giá tích lũy được xác định là sự chênh lệch giữa chi phí thay thế của một công trình và giá trị của nó vào thời điểm:", "o": ["Ngày xây dựng đầu tiên", "Hiện tại", "Thời điểm của bất kỳ sự thuê mua nào được duyệt", "Thời điểm bán gần đây nhất"], "a": 1, "g": "Thông tư 32/2024/TT-BTC (Chuẩn mực TĐGVN về Cách tiếp cận từ chi phí)."}, {"id": "TD.13.035", "q": "Yếu tố nào sau đây là phù hợp khi áp dụng cách tiếp cận từ chi phí?", "o": ["Thu nhập", "Tỷ suất sinh lợi", "Bình quân gia quyền của Vốn", "Chi phí thay thế mới"], "a": 3, "g": "Thông tư 32/2024/TT-BTC (Chuẩn mực TĐGVN về Cách tiếp cận từ chi phí)."}, {"id": "TD.13.036", "q": "Định giá tài sản bằng cách ước tính giá trị hiện tại ròng của một dòng thu nhập ổn định hàng năm với một tỷ lệ vốn hóa phù hợp được gọi là:", "o": ["Phương pháp vốn hóa thu nhập", "Phương pháp dòng tiền chiết khấu", "Phương pháp so sánh trực tiếp", "Phương thức dòng tiền trong tương lai"], "a": 0, "g": "Thông tư 32/2024/TT-BTC"}, {"id": "TD.13.037", "q": "Theo Thông tư 39/2024/TT-BTC, chứng chỉ đào tạo, bồi dưỡng nghiệp vụ thẩm định giá là điều kiện để làm gì?", "o": ["Là một trong các điều kiện hồ sơ để đăng ký dự thi cấp Thẻ thẩm định viên về giá", "Được bổ nhiệm ngay làm Giám đốc doanh nghiệp thẩm định giá mà không cần điều kiện khác", "Miễn hoàn toàn nghĩa vụ dự thi các môn thi cấp Thẻ thẩm định viên về giá", "Không có giá trị pháp lý, chỉ mang tính tham khảo"], "a": 0, "g": "Thông tư 39/2024/TT-BTC"}, {"id": "TD.13.038", "q": "Phạm vi hoạt động thẩm định giá của nhà nước được thể hiện qua hoạt động của:", "o": ["DN nhà nước kinh doanh thẩm định giá", "Hội đồng thẩm định giá do nhà nước thành lập", "Cả A, B đều đúng", "Cả A, B đều sai"], "a": 1, "g": "Điều 59, 60 Luật Giá 2023"}, {"id": "TD.13.040", "q": "Theo Luật Giá 2023, Cơ sở dữ liệu về giá được xây dựng nhằm mục đích chính nào?", "o": ["Chỉ phục vụ riêng cho công tác thanh tra, kiểm tra thuế của cơ quan thuế", "Tổng hợp, lưu trữ, cung cấp thông tin về giá phục vụ công tác quản lý nhà nước về giá, hoạt động sản xuất kinh doanh và nhu cầu của tổ chức, cá nhân có liên quan", "Chỉ phục vụ nội bộ Bộ Tài chính, không công khai, không chia sẻ ra bên ngoài", "Thay thế hoàn toàn cho hoạt động thẩm định giá tài sản trên thực tế"], "a": 1, "g": "Luật Giá 2023"}, {"id": "TD.13.041", "q": "Cán bộ giám sát khoản vay phát hiện TSBĐ là nhà xưởng bị cháy một phần, thiệt hại đáng kể, cán bộ cần:", "o": ["Không cần làm gì vì khách hàng vẫn trả nợ đúng hạn", "Xác minh, đánh giá lại giá trị còn lại của TSBĐ, báo cáo cấp có thẩm quyền, xem xét yêu cầu bổ sung TSBĐ nếu cần", "Ngay lập tức thu hồi toàn bộ khoản vay", "Đợi đến kỳ tái định giá định kỳ tiếp theo mới xử lý"], "a": 1, "g": ""}, {"id": "TD.13.042", "q": "Khách hàng đề nghị rút bớt một phần TSBĐ đang thế chấp trong khi dư nợ chưa giảm tương ứng, cán bộ cần:", "o": ["Đồng ý để giữ mối quan hệ khách hàng", "Đánh giá lại tỷ lệ dư nợ/giá trị TSBĐ còn lại có đảm bảo theo quy định hay không trước khi trình cấp có thẩm quyền phê duyệt", "Từ chối và không cần xem xét", "Yêu cầu tất toán toàn bộ khoản vay trước khi xem xét"], "a": 1, "g": ""}, {"id": "TD.13.043", "q": "Khi cần xuất kho hồ sơ TSBĐ gốc để phục vụ khách hàng bổ sung thủ tục, cán bộ cần:", "o": ["Tự ý lấy hồ sơ ra khỏi kho quỹ mà không cần phê duyệt", "Tuân thủ quy trình xuất/nhập kho TSBĐ: đề xuất, phê duyệt, ký nhận bàn giao rõ ràng, theo dõi thời gian hoàn trả", "Giao hồ sơ gốc trực tiếp cho khách hàng", "Không cần lập biên bản bàn giao"], "a": 1, "g": ""}, {"id": "TD.13.045", "q": "Tài sản được cập nhật sang tên chủ sở hữu cách thời điểm thẩm định < 3 tháng, tại thời điểm thẩm định thực tế, người sử dụng TSBĐ là họ hàng của chủ sở hữu. Khi đó, cán bộ định giá thực hiện phỏng vấn như thế nào?", "o": ["Phỏng vấn người hướng dẫn thẩm định về thông tin cơ bản của tài sản", "Phỏng vấn người hướng dẫn thẩm định về thông tin cơ bản của tài sản, thông tin về người sử dụng không phải là chủ sở hữu tài sản", "Phỏng vấn người hướng dẫn thẩm định về thông tin cơ bản của tài sản, thông tin về người sử dụng không phải là chủ sở hữu tài sản, thông tin về việc tài sản được cập nhật sang tên chủ sở hữu cách thời điểm thẩm định < 3 tháng", "Phỏng vấn người hướng dẫn thẩm định về thông tin cơ bản của tài sản, thông tin về người sử dụng không phải là chủ sở hữu tài sản, thông tin về việc tài sản được cập nhật sang tên chủ sở hữu cách thời điểm thẩm định < 3 tháng. Ngoài ra phỏng vấn thêm người dân xung quanh nếu có dấu hiệu nghi ngờ rủi ro tranh chấp của tài sản"], "a": 3, "g": "Điều 6 Thông tư 30/2024/TT-BTC."}, {"id": "TD.13.046", "q": "Trong quá trình thẩm định thực tế, để xác định chính xác vị trí TSBĐ được hướng dẫn trên thực tế là vị trí TSBĐ trên chứng từ pháp lý, Cán bộ định giá cần thực hiện những gì?", "o": ["Kiểm tra địa chỉ, vị trí, tọa độ trên thực tế có phù hợp với thông tin được thể hiện trên CTPL hoặc có phù hợp với thông tin theo bản đồ quy hoạch online/bản đồ google map/các nguồn thông tin khác đang được lưu trữ tại Trung tâm định giá hay không", "Kiểm tra các đặc điểm nổi bật của TSBĐ trên thực tế có phù hợp với thông tin được thể hiện trên CTPL không (như tóp hậu, hình L, ngõ/đường hướng trực diện vào nhà, xéo 1 cạnh,…)", "Kiểm tra hướng, các mặt tiếp xúc TSBĐ trên thực tế có phù hợp với thông tin được thể hiện trên CTPL", "Tất cả đều đúng"], "a": 3, "g": "Thông tư 31/2024/TT-BTC (Chuẩn mực TĐGVN về Thu thập và phân tích thông tin tài sản thẩm định giá)."}, {"id": "TD.13.047", "q": "Theo Luật Giá 2023, doanh nghiệp thẩm định giá có nghĩa vụ nào sau đây trong quá trình hoạt động?", "o": ["Được quyền từ chối cung cấp hồ sơ, tài liệu khi cơ quan nhà nước có thẩm quyền yêu cầu thanh tra, kiểm tra", "Phải mua bảo hiểm trách nhiệm nghề nghiệp cho hoạt động thẩm định giá hoặc trích lập quỹ dự phòng rủi ro nghề nghiệp theo quy định", "Không cần lưu trữ hồ sơ thẩm định giá sau khi đã phát hành chứng thư cho khách hàng", "Không phải chịu trách nhiệm về kết quả thẩm định giá đã phát hành nếu khách hàng đã thanh toán đầy đủ phí dịch vụ"], "a": 1, "g": "Luật Giá 2023"}, {"id": "TD.13.048", "q": "Theo quy định về nhận diện và hạn chế rủi ro phát sinh liên quan đến người sử dụng TSBĐ, trường hợp Cán bộ định giá thu thập được bằng chứng cụ thể tài sản có khả năng tranh chấp/rủi ro khác (thông qua hình ảnh, thông tin phỏng vấn người dân xung quanh, xác nhận của CQNN, …) thì Cán bộ định giá sẽ ứng xử:", "o": ["Lập và phát hành Báo cáo thẩm định giá bình thường ghi nhận các dấu hiệu rủi ro và kiến nghị theo quy định", "Lập và phát hành Báo cáo thẩm định giá bình thường", "Lập và phát hành tờ trình từ chối thẩm định TSBĐ", "Cả 3 đáp án trên đều sai."], "a": 2, "g": "Điều 5 Thông tư 30/2024/TT-BTC (từ chối thực hiện khi không đảm bảo tính độc lập, khách quan hoặc không đủ cơ sở tin cậy), đồng thời phù hợp các quy định về quyền sở hữu, quyền sử dụng tài sản tại Bộ luật Dân sự 2015 và Luật Đất đai 2024."}, {"id": "TD.13.049", "q": "Theo Thông tư 31/2024/TT-BTC, thông tin phục vụ thẩm định giá có thể được thu thập từ những nguồn nào?", "o": ["Chỉ từ chủ tài sản/khách hàng có yêu cầu thẩm định giá", "Chỉ từ khảo sát thực tế của thẩm định viên", "Từ nhiều nguồn khác nhau như khảo sát thực tế, chủ tài sản, giao dịch thành công trên thị trường, cơ quan nhà nước có thẩm quyền, kết quả thẩm định giá trước đó và các nguồn thông tin đáng tin cậy khác", "Chỉ từ dữ liệu do Bộ Tài chính công bố chính thức"], "a": 2, "g": "Thông tư 31/2024/TT-BTC"}, {"id": "TD.13.050", "q": "Trọng tài thương mại trong xử lý nợ chỉ phù hợp khi nào?", "o": ["Có thoả thuận trọng tài hợp lệ hoặc các bên liên quan hợp tác ký thoả thuận trọng tài", "Không cần bất kỳ thoả thuận nào giữa các bên", "Khi khách hàng đang là nhóm 1", "Tất cả đều sai"], "a": 0, "g": "Điều 5 Luật Trọng tài thương mại 2010 (Luật số 54/2010/QH12)"}];
const L = "ABCD", KEY = "onthi.v1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
let store = load(); store.hist = store.hist || {};   // id -> {ok, bad, last}
let S = null, timerId = null;

const topics = [...new Set(DATA.map(q => q.id.split(".").slice(0,2).join(".")))].sort();
$("topic").innerHTML = `<option value="">Tất cả (${DATA.length} câu)</option>` +
  topics.map(t => `<option value="${t}">${t} (${DATA.filter(q=>q.id.startsWith(t+".")).length} câu)</option>`).join("");

function wrongIds(){ return Object.keys(store.hist).filter(id => store.hist[id].last === false); }
function refreshHome(){
  const seen = Object.keys(store.hist).length, w = wrongIds().length;
  $("stats").textContent = `Đã làm ${seen}/${DATA.length} câu · Đang sai ${w} câu`;
  $("wrongN").textContent = w ? `${w} câu bạn đang trả lời sai` : "Chưa có câu sai";
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ["home","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

function start(mode, list){
  const t = $("topic").value;
  let qs = list || DATA.filter(q => !t || q.id.startsWith(t+"."));
  if (mode === "wrong" && !list){ const w = new Set(wrongIds()); qs = qs.filter(q => w.has(q.id)); }
  if (!qs.length){ alert("Không có câu hỏi nào phù hợp."); return; }
  qs = qs.slice();
  if ($("shuf").checked || mode === "exam") shuffle(qs);
  if (mode === "exam") qs = qs.slice(0, Math.max(1, +$("nq").value || 30));
  S = { mode: mode === "wrong" ? "learn" : mode, qs, i: 0, ans: Array(qs.length).fill(null), done: false };
  clearInterval(timerId); $("timer").textContent = "";
  const mins = +$("mins").value;
  if (S.mode === "exam" && mins > 0){
    S.end = Date.now() + mins*60000;
    const tick = () => { const s = Math.max(0, Math.round((S.end-Date.now())/1000));
      $("timer").textContent = `⏱ ${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
      if (!s) finish(); };
    tick(); timerId = setInterval(tick, 1000);
  }
  show("quiz"); render();
}

function record(q, ok){
  const h = store.hist[q.id] || {ok:0, bad:0};
  ok ? h.ok++ : h.bad++; h.last = ok; store.hist[q.id] = h; save();
}

function render(){
  const q = S.qs[S.i], a = S.ans[S.i], reveal = S.mode === "flash" || (S.mode === "learn" && a !== null);
  $("pos").textContent = `Câu ${S.i+1}/${S.qs.length}`;
  $("prog").style.width = (100*(S.i+1)/S.qs.length) + "%";
  const answered = S.ans.filter(x => x !== null).length;
  const right = S.ans.filter((x,k) => x !== null && x === S.qs[k].a).length;
  $("tally").textContent = S.mode === "learn" ? `Đúng ${right}/${answered}` : S.mode === "exam" ? `Đã chọn ${answered}/${S.qs.length}` : "";
  $("qid").textContent = q.id;
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.o.map((o,k) => {
    let c = "opt";
    if (reveal){ if (k === q.a) c += " ok"; else if (k === a) c += " bad"; }
    else if (k === a) c += " sel";
    return `<button class="${c}" data-k="${k}"><span class="k">${L[k]}.</span><span>${esc(o)}</span></button>`;
  }).join("");
  $("expl").innerHTML = reveal
    ? `<div class="note"><b>Đáp án: ${L[q.a]}</b>${a!==null && S.mode==="learn" ? (a===q.a ? " — Bạn trả lời đúng ✓" : ` — Bạn chọn ${L[a]} ✗`) : ""}${q.g ? `<br>📖 ${esc(q.g)}` : ""}</div>` : "";
  $("prev").disabled = S.i === 0;
  $("next").textContent = S.i === S.qs.length-1 ? (S.mode === "exam" ? "Nộp bài" : "Kết thúc") : "Câu sau →";
  $("finish").classList.toggle("hidden", S.mode !== "exam");
  $("grid").innerHTML = S.qs.length > 200 ? "" : S.qs.map((qq,k) => {
    let c = k === S.i ? "cur " : "";
    const x = S.ans[k];
    if (x !== null) c += S.mode === "learn" ? (x === qq.a ? "ok" : "bad") : "done";
    return `<button class="${c}" data-j="${k}">${k+1}</button>`;
  }).join("");
}

function choose(k){
  if (S.mode === "flash") return;
  if (S.mode === "learn"){
    if (S.ans[S.i] !== null) return;
    S.ans[S.i] = k; record(S.qs[S.i], k === S.qs[S.i].a);
  } else S.ans[S.i] = k;
  render();
}
function go(d){
  const j = S.i + d;
  if (j >= S.qs.length){
    if (S.mode === "exam"){ const left = S.ans.filter(x=>x===null).length;
      if (left && !confirm(`Còn ${left} câu chưa làm. Nộp bài?`)) return; }
    return finish();
  }
  if (j >= 0){ S.i = j; render(); window.scrollTo(0,0); }
}

function finish(){
  if (S.done) return; S.done = true; clearInterval(timerId);
  if (S.mode === "flash"){ show("home"); refreshHome(); return; }
  if (S.mode === "exam") S.qs.forEach((q,k) => record(q, S.ans[k] === q.a));
  const n = S.qs.length, right = S.qs.filter((q,k) => S.ans[k] === q.a).length;
  const skipped = S.ans.filter(x => x === null).length;
  $("score").textContent = `${right}/${n} câu đúng (${(100*right/n).toFixed(0)}%)`;
  $("scoreSub").textContent = `Điểm quy đổi thang 10: ${(10*right/n).toFixed(2)}` + (skipped ? ` · ${skipped} câu bỏ trống` : "");
  S.wrong = S.qs.filter((q,k) => S.ans[k] !== q.a);
  $("redoWrong").disabled = !S.wrong.length;
  $("review").innerHTML = S.wrong.length ? `<b>Các câu sai / bỏ trống (${S.wrong.length})</b>` +
    S.qs.map((q,k) => S.ans[k] === q.a ? "" : `<div class="rv"><div class="qid">${esc(q.id)}</div><div class="q">${esc(q.q)}</div>
      ${q.o.map((o,m) => `<div class="opt ${m===q.a?"ok":m===S.ans[k]?"bad":""}" style="cursor:default"><span class="k">${L[m]}.</span><span>${esc(o)}</span></div>`).join("")}
      ${q.g ? `<div class="note">📖 ${esc(q.g)}</div>` : ""}</div>`).join("") : "<b>Tuyệt vời! Bạn làm đúng tất cả.</b>";
  show("result");
}

document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => start(b.dataset.mode));
$("opts").onclick = e => { const b = e.target.closest("[data-k]"); if (b) choose(+b.dataset.k); };
$("grid").onclick = e => { const b = e.target.closest("[data-j]"); if (b){ S.i = +b.dataset.j; render(); } };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("finish").onclick = () => { S.i = S.qs.length-1; go(1); };
$("quit").onclick = () => { if (S.mode !== "exam" || confirm("Thoát bài thi? Kết quả sẽ không được lưu.")){ clearInterval(timerId); show("home"); refreshHome(); } };
$("home2").onclick = () => { show("home"); refreshHome(); };
$("redoWrong").onclick = () => start("learn", S.wrong);
$("resetBtn").onclick = () => { if (confirm("Xoá toàn bộ lịch sử làm bài?")){ store.hist = {}; save(); refreshHome(); } };
$("themeBtn").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; store.theme = r.dataset.theme; save(); };
if (store.theme) document.documentElement.dataset.theme = store.theme;
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden") || e.target.tagName === "INPUT") return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) choose(k % 4);
  else if (e.key === "ArrowRight" || e.key === "Enter") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
refreshHome();
</script>
</body>
</html>
