<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi trắc nghiệm</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--line:#e3e6eb;--accent:#1f6feb;--ok:#1a7f37;--okbg:#e6f4ea;--bad:#cf222e;--badbg:#fdecee;--hl:#fff8e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#171b23;--text:#e6e9ef;--muted:#98a2b3;--line:#2a303b;--accent:#4c8dff;--ok:#4ac26b;--okbg:#14301e;--bad:#ff6b6b;--badbg:#3a1a1e;--hl:#2d2814}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#171b23;--text:#e6e9ef;--muted:#98a2b3;--line:#2a303b;--accent:#4c8dff;--ok:#4ac26b;--okbg:#14301e;--bad:#ff6b6b;--badbg:#3a1a1e;--hl:#2d2814}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:.6rem 0 .25rem}
select,input[type=number]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
.chk{display:flex;gap:8px;align-items:center;margin-top:.6rem}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.modes button{text-align:left;padding:12px}.modes b{display:block}.modes small{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--accent)}
.qid{font-size:.8rem;color:var(--muted)}
.q{font-weight:600;margin:.3rem 0 .9rem}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;align-items:flex-start}
.opt .k{font-weight:700;min-width:1.4em}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.note{background:var(--hl);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-top:6px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.grid button{width:40px;padding:6px 0;font-size:.85rem}
.grid .done{background:var(--line)}.grid .ok{background:var(--okbg);border-color:var(--ok)}.grid .bad{background:var(--badbg);border-color:var(--bad)}.grid .cur{outline:2px solid var(--accent)}
.score{font-size:2.2rem;font-weight:700}
.muted{color:var(--muted);font-size:.9rem}
.hidden{display:none}
.rv{border-top:1px solid var(--line);padding:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ôn thi trắc nghiệm</h1>

  <!-- Màn hình chọn -->
  <section id="home">
    <div class="card">
      <div class="muted" id="stats"></div>
      <label class="f">Chủ đề (theo mã câu hỏi)</label>
      <select id="topic"></select>
      <div class="row">
        <div><label class="f">Số câu thi thử</label><input type="number" id="nq" min="1" value="30"></div>
        <div><label class="f">Thời gian thi thử (phút, 0 = không giới hạn)</label><input type="number" id="mins" min="0" value="30"></div>
      </div>
      <label class="chk"><input type="checkbox" id="shuf" checked> Trộn thứ tự câu hỏi</label>
      <div class="modes">
        <button class="pri" data-mode="learn"><b>Luyện tập</b><small style="color:#dfe8ff">Chọn đáp án là biết đúng/sai ngay, kèm chú giải</small></button>
        <button data-mode="exam"><b>Thi thử</b><small>Ngẫu nhiên, tính giờ, chấm điểm cuối bài</small></button>
        <button data-mode="wrong"><b>Ôn câu sai</b><small id="wrongN"></small></button>
        <button data-mode="flash"><b>Xem đáp án</b><small>Đọc lướt câu hỏi + đáp án đúng</small></button>
      </div>
    </div>
    <div class="row"><button id="resetBtn">Xoá lịch sử làm bài</button><button id="themeBtn">Đổi giao diện sáng/tối</button></div>
  </section>

  <!-- Màn hình làm bài -->
  <section id="quiz" class="hidden">
    <div class="top"><span id="pos"></span><span id="timer"></span><span id="tally"></span><button id="quit">Thoát</button></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qid" id="qid"></div>
      <div class="q" id="qtext"></div>
      <div id="opts"></div>
      <div id="expl"></div>
      <div class="nav">
        <button id="prev">← Câu trước</button>
        <button id="finish" class="hidden">Nộp bài</button>
        <button id="next" class="pri">Câu sau →</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="muted">Phím tắt: A/B/C/D hoặc 1–4 để chọn, ←/→ để chuyển câu.</div>
  </section>

  <!-- Màn hình kết quả -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="score" id="score"></div>
      <div class="muted" id="scoreSub"></div>
      <div class="nav"><button id="home2">Về trang chính</button><button id="redoWrong" class="pri">Làm lại các câu sai</button></div>
    </div>
    <div class="card" id="review"></div>
  </section>
</div>

<script>
const DATA = [{"id": "TD.01.002", "q": "Công ty CP XYZ được cấp GHTD với cấp thẩm quyền phê duyệt GHTD tại đơn vị; BP CRC tại chi nhánh có trách nhiệm thực hiện:", "o": ["Đối chiếu và in BC TĐTD định dạng .pdf được Lãnh đạo Chi nhánh/GĐ KH chiết xuất và đính kèm lên Hệ thống CLOS", "Trình ký các cấp rà soát/phê duyệt tại Đơn vị và đóng dấu để chuẩn bị cho công tác Lưu hồ sơ sau phê duyệt", "Tác nghiệp đính kèm bản scan màu của BC TĐTD đã có đầy đủ chữ ký và đóng dấu lên Hệ thống CLOS chậm nhất trong vòng 02 ngày làm việc kể từ thời điểm hoàn thành việc trình ký và đóng dấu BC TĐTD", "Tất cả phương án trên"], "a": 3, "g": "Phụ lục 1, Mục 1b Phê duyệt tín dụng tại đơn vị trang 11 - CV 2669/VCB-QLRRTD ngày 09/03/2023"}, {"id": "TD.01.005", "q": "Trong trường hợp Khách hàng có tài sản bảo đảm để bảo đảm cho các nghĩa vụ tại VCB, BP CRC hoàn thành khai báo các trường thông tin về TSBĐ trên Hệ thống CLOS khi nào?", "o": ["Sau khi CBTĐ thực hiện nhấn nút [Kết thúc công việc] để luân chuyển tác vụ đến QLTĐ)", "Trước khi CBTĐ thực hiện nhấn nút [Kết thúc công việc] để luân chuyển tác vụ đến QLTĐ)", "Bất cứ lúc nào", "Cả 3 phương án đều sai"], "a": 1, "g": "Phụ lục 1, Mục 1c CBTĐ hoàn tất thẩm định trang 6- CV 2669/VCB-QLRRTD ngày 09/03/2023"}, {"id": "TD.01.006", "q": "Một Lãnh đạo CRC đang thực hiện tác nghiệp trên CRC SP, người này không thể thực hiện tính năng nào sau đây?", "o": ["Tra cứu thông tin của Khách hàng", "Xem cảnh báo/báo cáo", "Gán CIF cho cán bộ", "Tạo mẫu biểu tác nghiệp tín dụng"], "a": 3, "g": "Cẩm nang HDSD chương trình CRC SP - Mục I.2. Các chức năng chính của Chương trình"}, {"id": "TD.01.007", "q": "Cán bộ thẩm định (CA) muốn tìm kiếm thông tin Tài khoản thanh toán được chỉ định dùng để thu nợ trên CRC SP nhưng không tìm được và gọi xin hỗ trợ từ bạn, bạn sẽ hướng dẫn CA tra cứu thông tin này tại tab thông tin nào trên CRC SP?", "o": ["Khách hàng", "Tài khoản vay", "Hợp đồng tín dụng", "Giới hạn tín dụng"], "a": 0, "g": "Cẩm nang HDSD chương trình CRC SP - Mục III.1.a Thông tin khách hàng"}, {"id": "TD.01.008", "q": "Một cán bộ CRC tác nghiệp tín dụng đã được gán CIF 983 trên CRC SP, phát biểu nào sau đây không chính xác?", "o": ["User có thể tra cứu thông tin khách hàng", "User có thể tra cứu các HĐTD của KH đó trên phạm vi toàn hàng", "User có thể xem cảnh báo/báo cáo", "User có thể tạo các mẫu tác nghiệp tín dụng tự động cho KH này"], "a": 1, "g": "Cẩm nang HDSD chương trình CRC SP - Mục I.2. Các chức năng chính của Chương trình"}, {"id": "TD.01.009", "q": "Để tìm kiếm các thông tin liên quan đến HĐTD thuộc phạm vi tác nghiệp của Chi nhánh , người dùng có thể tìm kiếm tại bao nhiêu tab thông tin trên CRC SP?", "o": ["6", "7", "8", "9"], "a": 3, "g": "Cẩm nang HDSD chương trình CRC SP - Mục III.1. Sub menu Thông tin tín dụng"}, {"id": "TD.01.010", "q": "Cán bộ khách hàng và cán bộ Quản lý nợ cùng khởi tạo mẫu biểu nào trên CRC SP?", "o": ["TBTN Thông tin Giới hạn tín dụng", "TBTN thu nợ", "TBTN Giải ngân", "TBTN giải chấp một phần TSBĐ"], "a": 2, "g": "Cẩm nang HDSD chương trình CRC SP - Mục III.2.c. Hướng dẫn tác nghiệp"}, {"id": "TD.01.011", "q": "Chi nhánh A thực hiện phân quyền tính năng Cảnh báo/báo cáo trên CRC SP, JD nào không thuộc đối tượng được phân quyền:", "o": ["Lãnh đạo Phòng Quản lý nợ", "Cán bộ/lãnh đạo phòng Khách hàng", "Cán bộ phòng Quản lý nợ", "Cán bộ Phòng Kiểm tra giám sát"], "a": 3, "g": "Cẩm nang HDSD chương trình CRC SP - Mục I.2. Các chức năng chính của Chương trình"}, {"id": "TD.01.022", "q": "Trường hợp sau khi định giá lại, giá trị TSBĐ không đủ để bảo đảm cho nghĩa vụ tín dụng của khách hàng doanh nghiệp A theo phê duyệt của CTQ hoặc theo Chính sách bảo đảm tín dụng của VCB, CB CRC Giám sát & báo cáo thực hiện các bước nào sau đây:", "o": ["i. Soạn Thông báo thiếu TSBĐ và trình lãnh đạo CRC rà soát, ký duyệt ii. Gửi cho Khách hàng bản sao Thông báo thiếu TSBĐ.", "i. Soạn Thông báo thiếu TSBĐ và trình lãnh đạo CRC rà soát, ký duyệt ii. Gửi cho CBKH và BP TĐTD bản sao Thông báo thiếu TSBĐ.", "i. Soạn Thông báo thiếu TSBĐ và trình lãnh đạo CRC rà soát, ký duyệt ii. Gửi CB CRC Tác nghiệp tín dụng bản gốc (đã có ký nhận của CBKH) để lưu hồ sơ tín dụng.", "i. Soạn Thông báo thiếu TSBĐ và trình lãnh đạo CRC rà soát, ký duyệt ii. Gửi cho CBKH và BP TĐTD bản sao Thông báo thiếu TSBĐ. iii. Gửi CB CRC Tác nghiệp tín dụng bản gốc (đã có ký nhận của CBKH) để lưu hồ sơ tín dụng."], "a": 3, "g": "Điểm 41.2.5, Điều 41, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.023", "q": "Chậm nhất ngày 20 hàng tháng, bộ phận CRC Giám sát & báo cáo in báo cáo nào sau đây:", "o": ["Báo cáo các khoản nợ gốc, lãi đến hạn trong tháng tiếp theo và nợ quá hạn chưa trả của Đơn vị từ hệ thống.", "Báo cáo các khoản nợ gốc, lãi đến hạn trong 02 tháng tiếp theo và nợ quá hạn chưa trả của Đơn vị từ hệ thống.", "Báo cáo các khoản nợ gốc, lãi đến hạn trong 03 tháng tiếp theo và nợ quá hạn chưa trả của Đơn vị từ hệ thống.", "Báo cáo các khoản nợ gốc, lãi đến hạn trong 06 tháng tiếp theo và nợ quá hạn chưa trả của Đơn vị từ hệ thống."], "a": 0, "g": "Điểm 41.1.1, Điều 41, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.024", "q": "Công ty TNHH A có TSBĐ đến hạn định giá lại vào tháng sau. Hỏi tháng này cán bộ CRC Giám sát & báo cáo phải lập Thông báo danh sách TSBĐ đến hạn định giá lại chậm nhất ngày nào?", "o": ["15", "20", "25", "30"], "a": 0, "g": "Điểm 41.2.2, Điều 41, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.025", "q": "Theo Quy trình tín dụng đối với KHBB, Báo cáo các trường hợp cần chú ý bao gồm:", "o": ["i. Danh sách TSBĐ quá hạn định giá lại ii. Danh sách khách hàng cần bổ sung TSBĐ để đáp ứng tỷ lệ bảo đảm theo phê duyệt của CTQ hoặc theo Chính sách bảo đảm tín dụng của VCB.", "i. Danh sách khách hàng có điều kiện tín dụng, điều kiện thương mại theo phê duyệt của CTQ hoặc theo HĐTD bị vi phạm. ii. Danh sách khách hàng có tài liệu hết hiệu lực, chưa cung cấp tài liệu thay thế hoặc chưa gia hạn hiệu lực tài liệu.", "i. Danh sách khách hàng có GHTDnh đã hết hiệu lực/quá hạn rà soát định kỳ GHTDtdh, GHTDtpdn đã được phê duyệt và còn số dư cấp tín dụng. ii. Danh sách khách hàng quá hạn kiểm tra sử dụng vốn vay.", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điểm 43.1, Điều 43, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.026", "q": "Theo Quy trình tín dụng đối với KHBB, Đối với tác nghiệp thu nợ, trước 9h sáng các ngày làm việc, CB CRC Giám sát & báo cáo in Bảng kê nào sau đây:", "o": ["Bảng kê các giao dịch đến hạn thu gốc, lãi, phí (nếu có) trong ngày từ hệ thống", "Bảng kê các giao dịch thu gốc, lãi, phí (nếu có) ngày hôm trước từ hệ thống", "Bảng kê các giao dịch đến hạn thu gốc, lãi, phí (nếu có) trong 03 ngày tiếp theo từ hệ thống", "Bảng kê các giao dịch đến hạn thu gốc, lãi, phí (nếu có) trong 05 ngày tiếp theo từ hệ thống"], "a": 0, "g": "Điểm 21.1, Điều 21, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.027", "q": "Theo Quy trình tín dụng đối với KHBB, vào ngày 15 hàng tháng, CB CRC Giám sát & báo cáo lập Thông báo danh sách khách hàng đến hạn rà soát GHTD trong mấy tháng tiếp theo:", "o": ["01 tháng tiếp theo", "02 tháng tiếp theo", "03 tháng tiếp theo", "Không đáp án nào đúng"], "a": 1, "g": "Điểm 41.5.2, Điều 41, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.028", "q": "Theo Quy trình tín dụng đối với KHBB, Báo cáo tình hình thực hiện các điều kiện của khách hàng được lập khi:", "o": ["Đề xuất GHTD/ Cấp tín dụng", "Tại lần giải ngân đầu tiên sau khi khách hàng được CTQ phê duyệt tín dụng", "Các trường hợp khác theo yêu cầu của Giám đốc Khách hàng/Lãnh đạo CN", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điểm 4.3.4 Điều 4; điểm 11.3.4 Điều 11 Mẫu 9.8, Phụ lục 03 - Mẫu biểu, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.040", "q": "Theo quy định của Pháp luật, Tổ chức tín dụng cho vay phải sử dụng dịch vụ thanh toán không dùng tiền mặt để giải ngân vốn cho vay vào tài khoản thanh toán của khách hàng tại tổ chức cung ứng dịch vụ trong trường hợp nào?", "o": ["Khách hàng thanh toán, chi trả cho các mục đích sử dụng vốn vay mà pháp luật quy định phải thực hiện thông qua tài khoản thanh toán của khách hàng", "Khách hàng là bên thụ hưởng có tài khoản thanh toán tại tổ chức cung ứng dịch vụ thanh toán, đã ứng vốn tự có để thanh toán, chi trả các chi phí thuộc chính phương án, dự án kinh doanh hoặc phương án, dự án phục vụ đời sống được tổ chức tín dụng cho vay quyết định cho vay theo quy định của pháp luật", "Khách hàng trực tiếp thanh toán, chi trả tiền mua sản phẩm nông nghiệp thuộc lĩnh vực nông, lâm, diêm nghiệp và thủy sản từ cá nhân, hộ gia đình, chủ trang trại, hộ kinh doanh và tổ hợp tác có hoạt động sản xuất kinh doanh trên địa bàn nông thôn để khách hàng thực hiện phương án sản xuất kinh doanh, phù hợp với mục đích vay vốn ghi trong thỏa thuận cho vay", "Tất cả các trường hợp"], "a": 3, "g": "Khoản 2, điều 4 - Thông tư số 21/2017/TT-NHNN ngày 29/12/17 QUY ĐỊNH VỀ PHƯƠNG THỨC GIẢI NGÂN VỐN CHO VAY CỦA TỔ CHỨC TÍN DỤNG, CHI NHÁNH NGÂN HÀNG NƯỚC NGOÀI ĐỐI VỚI KHÁCH HÀNG"}, {"id": "TD.01.041", "q": "Theo quy định của pháp luật, Tổ chức tín dụng cho vay được xem xét quyết định phương thức giải ngân vốn cho vay sử dụng dịch vụ thanh toán không dùng tiền mặt hoặc bằng tiền mặt trong các trường hợp nào?", "o": ["Khách hàng thanh toán, chi trả cho bên thụ hưởng (không bao gồm pháp nhân) có tài khoản thanh toán tại tổ chức cung ứng dịch vụ thanh toán với số tiền vay ghi trong thỏa thuận cho vay có giá trị không vượt quá 100.000.000 đồng (một trăm triệu đồng)", "Khách hàng trực tiếp thanh toán, chi trả tiền mua sản phẩm nông nghiệp thuộc lĩnh vực nông, lâm, diêm nghiệp và thủy sản từ cá nhân, hộ gia đình có hoạt động sản xuất kinh doanh trên địa bàn nông thôn để khách hàng thực hiện phương án sản xuất kinh doanh, phù hợp với mục đích vay vốn ghi trong thỏa thuận cho vay", "Khách hàng thanh toán, chi trả cho bên thụ hưởng (không bao gồm pháp nhân) có tài khoản thanh toán tại tổ chức cung ứng dịch vụ thanh toán với số tiền vay ghi trong thỏa thuận cho vay có giá trị trên 100.000.000 đồng (một trăm triệu đồng)", "Khách hàng trực tiếp thanh toán, chi trả tiền mua sản phẩm nông nghiệp thuộc lĩnh vực thủy sản từ chủ trang trại, hộ kinh doanh và tổ hợp tác có hoạt động sản xuất kinh doanh trên địa bàn nông thôn để khách hàng thực hiện phương án sản xuất kinh doanh, phù hợp với mục đích vay vốn ghi trong thỏa thuận cho vay"], "a": 0, "g": "Điều 6 - Thông tư số 21/2017/TT-NHNN ngày 29/12/17 QUY ĐỊNH VỀ PHƯƠNG THỨC GIẢI NGÂN VỐN CHO VAY CỦA TỔ CHỨC TÍN DỤNG, CHI NHÁNH NGÂN HÀNG NƯỚC NGOÀI ĐỐI VỚI KHÁCH HÀNG"}, {"id": "TD.01.042", "q": "Theo Quy trình tín dụng bán buôn số 2503, Cấp thẩm quyền phê duyệt mượn/rút hồ sơ tín dụng (không phải hồ sơ TSBĐ) lưu tại Bộ phận CRC Chi nhánh là?", "o": ["Lãnh đạo phòng yêu cầu mượn hồ sơ", "Lãnh đạo Chi nhánh", "Lãnh đạo CRC", "Lãnh đạo phòng Khách hàng"], "a": 1, "g": "Điều 45.1 Quyết định 2503/QĐ-VCB-QLRRTD ngày 28/12/2018 của Tổng Giám đốc"}, {"id": "TD.01.047", "q": "Theo Quy trình tín dụng bán buôn số 2503, BP CRC cần thực hiện kiểm tra tối thiểu những nội dung nào khi kiểm tra hồ sơ và điều kiện giải ngân?", "o": ["Số tiền cam kết cho vay còn hiệu lực giải ngân; Tính đầy đủ của hồ sơ; Chữ ký hợp lệ của người đại diện hợp pháp của khách hàng trên Giấy nhận nợ và/hoặc Ủy nhiệm chi/Giấy rút tiền mặt/Lệnh chuyển tiền (trong trường hợp người ký trên Giấy nhận nợ và/hoặc Ủy nhiệm chi/Giấy rút tiền mặt/Lệnh chuyển tiền chưa có đăng ký chữ ký thực hiện giao dịch tiền gửi và/hoặc giao dịch tiền vay tại BP DVKH)", "Sự phù hợp về nội dung của hồ sơ giải ngân với các điều kiện tín dụng đã được phê duyệt và/hoặc HĐTD đã ký; Tính tuân thủ các quy định, chính sách của pháp luật và của VCB, tuân thủ điều kiện tín dụng thông qua (các) báo cáo giám sát của BP CRC.", "Tính hợp lệ của hóa đơn điện tử và/hoặc tờ khai hải quan điện tử trong trường hợp sử dụng hóa đơn điện tử, TKHQ là tài liệu chứng minh mục đích sử dụng vốn vay trong giải ngân.", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "PHỤ LỤC 01 (điểm 9): Một số qui định khi thực hiện QTTD BB - Quyết định 2503/QĐ-VCB-QLRRTD ngày 28/12/2018 của Tổng Giám đốc và Quyết định 1327/QĐ-VCB-QLRRTD ngày 23/06/2025 của Tổng Giám đốc"}, {"id": "TD.01.048", "q": "Theo Quy trình tín dụng đối với KHBB số 2503, Trường hợp BP DVKH hoặc PGD trực tiếp nhận được yêu cầu trả nợ trước hạn từ khách hàng thì qui trình xử lý như thế nào?", "o": ["BP DVKH hoặc PGD thông báo ngay cho CBTĐ để đầu mối tiếp nhận xử lý yêu cầu trả nợ trước hạn của khách hàng", "CBTĐ căn cứ quy định tại HĐTD và/hoặc văn bản thỏa thuận đã ký với khách hàng để theo dõi và chuyển hồ sơ đề nghị thu nợ trước hạn tới BP CRC để xử lý theo qui định", "BP DVKH CN/PGD thực hiện thu nợ và thông báo cho CBTĐ biết để theo dõi", "A & B"], "a": 3, "g": "Điều 20 Quyết định 2503/QĐ-VCB-QLRRTD ngày 28/12/2018 của Tổng Giám đốc"}, {"id": "TD.01.050", "q": "Một khoản vay là nợ xử lý DPRR được cấp thẩm quyền phê duyệt miễn giảm một phần lãi và lãi phạt gốc quá hạn. Chi nhánh VCB cần thực hiện điều chỉnh giảm lãi và lãi phạt gốc quá hạn trên TKV theo phê duyệt thì việc tác nghiệp được xử lý như thế nào?", "o": ["Chi nhánh thực hiện điều chỉnh giảm lãi và lãi phạt cộng dồn của các khoản vay nợ xử lý giống như đối với khoản vay thường.", "Chi nhánh thực hiện các bước tác nghiệp dưới đây trong cùng 1 ngày: 'Bước 1: CN gửi yêu cầu điều chỉnh trạng thái tài khoản vay từ nợ xử lý sang nợ thông thường cho P.QLCĐACN Bước 2: Phòng QLCĐACN chuyển tài khoản nợ xử lý về trạng thái thường theo yêu cầu của chi nhánh Bước 3: Sau khi Phòng QLCĐACN thực hiện bước 2, Chi nhánh thực hiện điều chỉnh giảm lãi/ lãi phạt cộng dồn theo phê duyệt. Bước 4: Chi nhánh thông báo lại phòng QLĐACN khi thực hiện xong để điều chỉnh về trạng thái nợ xử lý", "Bước 1: CN gửi yêu cầu điều chỉnh cho P.QLCĐACN Bước 2: Phòng QLCĐACN chuyển tài khoản nợ xử lý về trạng thái thường theo yêu cầu của chi nhánh. Trong khi Phòng QLCĐACN thực hiện yêu cầu, Chi nhánh đồng thời thực hiện điều chỉnh giảm lãi/ lãi phạt cộng dồn theo phê duyệt Bước 3: Chi nhánh thông báo lại phòng QLCĐACN khi thực hiện xong để điều chỉnh về trạng thái nợ xử lý", "Phương án B và C đều đúng"], "a": 1, "g": "Tài liệu \"Các lưu ý quan trọng khi tác nghiệp trên hệ thống CORE SIGNATURE - mục Điều chỉnh tăng/ giảm lãi của khoản nợ xử lý"}, {"id": "TD.01.051", "q": "Khoản vay nợ xử lý có chu kỳ trả nợ gốc 6 tháng/ lần vào 30/06 và 31/12 hàng năm. Ngày 01/05/2023, khách hàng đề nghị trả nợ gốc trước hạn toàn bộ kỳ thu nợ gốc 30/06/2023. Tại ngày thu nợ 01/05/2023, Phòng Quản lý nợ thực hiện các tác nghiệp sau: i) Tạo bill gốc tương ứng số tiền trả trước ii) Đề nghị Phòng Dịch vụ khách hàng thu nợ gốc. Để hệ thống không tính lãi phạt cho bill gốc sinh ngày 30/06/2023 dẫn đến việc phải điều chỉnh giảm lãi phạt gốc quá hạn, phòng Quản lý nợ cần thực hiện tiếp tác nghiệp nào sau đây:", "o": ["Không cần tác nghiệp thêm trên Corebanking Signature.", "Sửa lịch trả nợ để kỳ trả gốc tiếp theo là 31/12/2023", "Đầu ngày 30/06/2023, xóa bill gốc để hệ thống không tính lãi phạt quá hạn.", "Phương án B và C đều đúng"], "a": 3, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.5. Tác nghiệp chỉnh sửa kỹ thuật TKV 5.3. Chỉnh sửa lịch trả nợ Maintain Loan và 5.6. Chỉnh sửa bill"}, {"id": "TD.01.052", "q": "Tài khoản vay ban đầu có lịch trả nợ đều, 10 kỳ gốc mỗi kỳ 10.000.000 VNĐ. Khách hàng đã trả đúng hạn 8 kỳ mỗi kỳ 10.000.000 VNĐ. Kỳ trả nợ gốc tiếp theo là 30/06/2023 thể hiện ở trường Scheduled next due. Hôm nay 01/06/2023, khách hàng được cơ cấu lại nợ, dư nợ gốc 20.000.000 VNĐ còn lại được trả thành 20 kỳ mỗi kỳ 1.000.000. Phòng Quản lý nợ sửa lịch trả nợ gốc đang cài đặt trên hệ thống hiện tại. Để lịch trả nợ đúng, 2 trường thông tin sau cần nhận giá trị lần lượt là bao nhiêu? i) Current schedule nbr ii) Schedule times billed", "o": ["i) 01 ii) 08", "i) 02 ii) 00", "i) 02 ii) 8", "i) 01 ii) 0"], "a": 1, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.2. Truy vấn các thông tin liên quan đến TKV 2.2 Các thông tin cơ bản của TKV Màn hình 03 Loan Enquiry – Payment Schedule Display hiển thị các thông tin về lịch trả nợ của khoản vay."}, {"id": "TD.01.053", "q": "Chi nhánh cần điều chỉnh tăng/giảm lãi/ lãi phạt cộng dồn và thu nợ gốc/ lãi của tài khoản vay nợ xử lý. Sau khi phòng QLCĐACN chuyển tài khoản nợ xử lý về trạng thái thường theo yêu cầu của chi nhánh, chi nhánh cần tác nghiệp đúng trình tự các bước nào sau đây:", "o": ["i) Chi nhánh thực hiện điều chỉnh tăng/ giảm lãi/ lãi phạt cộng dồn như phê duyệt. ii) Chi nhánh thông báo lại phòng QLCĐACN sau khi thực hiện xong để phòng QLCĐACN điều chỉnh về trạng thái nợ xử lý iii) Chi nhánh thu nợ gốc/ lãi theo yêu cầu của khách hàng", "i) Chi nhánh thực hiện điều chỉnh tăng/ giảm lãi/ lãi phạt cộng dồn như phê duyệt ii) Chi nhánh thu nợ gốc/ lãi theo yêu cầu của khách hàng iii) Chi nhánh thông báo lại phòng QLCĐACN sau khi thực hiện xong để phòng QLCĐACN điều chỉnh về trạng thái nợ xử lý", "i) Chi nhánh thực hiện điều chỉnh tăng/ giảm lãi/ lãi phạt cộng dồn như phê duyệt ii) Chi nhánh thu nợ gốc/ lãi theo yêu cầu của khách hàng và không thông báo lại phòng QLCĐACN khi thực hiện xong", "i) Chi nhánh thu nợ gốc/ lãi theo yêu cầu của khách hàng ii) Chi nhánh thực hiện điều chỉnh tăng/ giảm lãi/ lãi phạt cộng dồn như phê duyệt iii) Chi nhánh thông báo lại phòng QLCĐACN sau khi thực hiện xong để phòng QLCĐACN điều chỉnh về trạng thái nợ xử lý"], "a": 0, "g": "Tài liệu \" Các lưu ý quan trọng khi tác nghiệp trên hệ thống CORE SIGNATURE - mục Điều chỉnh tăng/ giảm lãi của khoản nợ xử lý"}, {"id": "TD.01.054", "q": "Một khoản vay nợ xử lý có trường thông tin Charge-off code nhận giá trị C. Để xem trường thông tin này, người dùng vào màn hình nào sau đây ở tài khoản vay:", "o": ["Màn hình Loan Enquiry – Accrual Display chọn F14 (Non accrual)", "Màn hình Loan Enquiry – Accrual Display chọn F16 (Transfer orders)", "Màn hình Loan Enquiry – Accrual Display", "Loan Enquiry - Late Charge on Overdue Principal Data"], "a": 0, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.2. Truy vấn các thông tin liên quan đến TKV 2.2 Các thông tin cơ bản của TKV Mục Màn hình Loan Enquiry – Accrual Display"}, {"id": "TD.01.055", "q": "Tại màn hình \"Loan Enquiry - Accrual Display\" của tài khoản vay có trường thông tin \"Guarantee code\" nhận giá trị bằng 4, lãi suất của khoản vay thuộc loại lãi suất nào?", "o": ["Lãi suất cố định", "Lãi suất thả nổi hoàn toàn 3", "Lãi suất thả nổi theo chu kỳ review 3 tháng 1 lần", "Lãi suất thả nổi theo chu kỳ review 1 tháng 1 lần"], "a": 1, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.2. Truy vấn các thông tin liên quan đến TKV 2.2 Các thông tin cơ bản của TKV Mục màn hình Loan Enquiry – Accrual Display"}, {"id": "TD.01.056", "q": "Cán bộ QLN cần xem lịch sử tính số tiền lãi phạt quá hạn gốc/ lãi của tài khoản vay thì cần vào màn hình nào để xem?", "o": ["Tại màn hình Loan Enquiry - Late charge accrual History chọn F8", "Tại màn hình Loan Enquiry - Late charge accrual History chọn F20", "Loan Enquiry - Late Charge on Uncollected Interest Data", "Loan Enquiry - Late Charge on Overdue Principal Data"], "a": 0, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.2. Truy vấn các thông tin liên quan đến TKV 2.2 Các thông tin cơ bản của TKV Mục Màn hình 32: Thông tin lịch sử dự thu lãi phạt chậm trả"}, {"id": "TD.01.058", "q": "Khi cần xem thông tin \"Tổng số tiền gốc được trả nợ trước hạn\" cho các kỳ gốc đến hạn trong tương lai của tài khoản vay thông thường (không phải nợ xử lý), cán bộ cần xem thông tin tại trường nào?", "o": ["Ex Ver Prin Pmt", "Extra prin", "Amt disbursed", "Payoff"], "a": 0, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.2. Truy vấn các thông tin liên quan đến TKV 2.2 Các thông tin cơ bản của TKV Mục Màn hình 4 Loan Enquiry – Billed/Unpaid Payments"}, {"id": "TD.01.059", "q": "Trên HĐTD ký kết với khách hàng quy định: mỗi lần trả nợ trước hạn thì phí trả nợ trước hạn 200.000 VNĐ không phụ thuộc vào số tiền trả nợ trước hạn là bao nhiêu, tại mức tài khoản vay người sử dụng sẽ cài đặt như thế nào?", "o": ["Prepayment penalty code = 0 - Prepayment fixed amount = 200.000", "Prepayment penalty code = 1 - Prepayment fixed amount = 200.000", "Prepayment penalty code = 2 - Prepayment fixed amount = 200.000", "Prepayment penalty code = 3 - Prepayment fixed amount = 200.000"], "a": 1, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE 1.1. Mở TKV thông thường 1.1.1. Mở TKV qua phân hệ Loan (502010) Màn hình 07: Prepayment penalty code: Phương thức tính phí trả nợ trước hạn: 0 = Không tính phí; 1 = Phí cố định; 2 = Phí theo tỷ lệ; 3 = Thu phí theo bậc thang."}, {"id": "TD.01.061", "q": "Trường thông tin thể hiện \"Ngày rà soát lãi suất tiếp theo\" của tài khoản vay có lãi suất thả nổi theo chu kỳ review là:", "o": ["Next rate review change date", "Rate eff date", "Rate change start date", "Int bill nxt"], "a": 0, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.2. Truy vấn các thông tin liên quan đến TKV 2.2 Các thông tin cơ bản của TKV Mục Màn hình 21: Thông tin về rà soát lại Lãi suất/lịch trả nợ/ kỳ hạn của khoản vay"}, {"id": "TD.01.063", "q": "Theo hướng dẫn quản lý và sử dụng GHTD trên hệ thống GLIMS, CLOS, khi cài đặt CAP hạn mức trên GLIMS, Phòng Quản lý nợ thực hiện tác nghiệp theo trình tự nào sau đây để không gây ra lỗi dẫn đến phải yêu cầu Trung tâm công nghệ thông tin xóa luồng cài đặt CAP và thực hiện lại?", "o": ["i. Cán bộ đẩy duyệt luồng rà soát Giới hạn tín dụng trên CLOS ii. Lãnh đạo duyệt kết thúc luồng rà soát GHTD trên CLOS iii. Cán bộ khởi tạo và đẩy duyệt luồng cài đặt CAP hạn mức trên GLIMS iv. Lãnh đạo duyệt kết thúc luồng cài đặt CAP hạn mức trên GLIMS", "i. Cán bộ đẩy duyệt luồng rà soát Giới hạn tín dụng trên CLOS ii. Cán bộ khởi tạo và đẩy duyệt luồng cài đặt CAP hạn mức trên GLIMS iii. Lãnh đạo duyệt kết thúc luồng rà soát GHTD trên CLOS iv. Lãnh đạo duyệt kết thúc luồng cài đặt CAP hạn mức trên GLIMS", "Cả 2 phương án A và B đều sai", "Cả 2 phương án A và B đều đúng"], "a": 0, "g": "TÀI LIỆU HƯỚNG DẪN SỬ DỤNG CHO NGƯỜI DÙNG CUỐI VÀ QUẢN TRỊ VIÊN IV. CÀI ĐẶT HẠN MỨC 1. TẠO CÀI ĐẶT HẠN MỨC 1.1. MÀN HÌNH TẠO MỚI ĐỀ XUẤT CÀI ĐẶT HẠN MỨC Người dùng chỉ có thể tạo đề xuất cài đặt hạn mức cho các khách hàng thuộc quản lý GHTD của Chi nhánh và khách hàng đang có GHTD ở trạng thái Active (hoạt động)."}, {"id": "TD.01.064", "q": "Theo thông báo phê duyệt GHTD, khách hàng được sử dụng: Tổng GHTD khách hàng: 100 tỷ I. GHTD ngắn hạn 100 tỷ - Giới hạn cho vay ngắn hạn 50 tỷ - Giới hạn bảo lãnh ngắn hạn 50 tỷ - Giới hạn L/C ngắn hạn 50 tỷ II. GHTD trung dài hạn 100 tỷ - Giới hạn Cho vay trung dài hạn 50 tỷ - Giới hạn L/C trung dài hạn 50 tỷ và tổng dư nợ của Giới hạn cho vay ngắn hạn, Giới hạn cho vay trung dài hạn không vượt số tiền 50 tỷ VNĐ (*) Theo hướng dẫn sử dụng cho người
