nh thời hạn hiệu lực giải ngân/cấp tín dụng cho HĐTD, cán bộ QLN nhập thông tin Expiry Date mới (sau điều chỉnh) cho HĐTD trên hệ thống nào sau đây:", "o": ["CLOS", "GLIMS", "cả 2 phương án A và B đều sai", "cả 2 phương án A và B đều đúng"], "a": 0, "g": "Văn bản hợp nhất 20260424_VBHN_CV17212_QLRRTD Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD 2.2.2. Các lưu ý khi khai báo thông tin HĐTD trên các hệ thống: \"Khi thực hiện điều chỉnh thời hạn hiệu lực giải ngân/cấp tín dụng cho HĐTD trên CLOS, cán bộ QLN nhập thông tin Expiry Date mới (sau điều chỉnh) cho HĐTD trên hệ thống CLOS...\""}, {"id": "TD.01.074", "q": "Nguyên tắc quản lý cấp tín dụng và sử dụng Giới hạn tín dụng của hệ thống GLIMS là:", "o": ["Hệ thống GLIMS sẽ thực hiện theo dõi, quản lý cấp tín dụng cho khách hàng theo GHTD đã được phê duyệt trên CLOS và các hạn mức tín dụng cài đặt bổ sung trên GLIMS (nếu có)", "Hệ thống GLIMS sẽ thực hiện theo dõi, quản lý cấp tín dụng cho khách hàng theo các hạn mức tín dụng cài đặt bổ sung trên GLIMS (nếu có)", "Hệ thống GLIMS sẽ thực hiện theo dõi, quản lý cấp tín dụng cho khách hàng theo GHTD đã được phê duyệt trên CLOS", "Cả 3 phương án đều sai"], "a": 0, "g": "Văn bản hợp nhất 20260424_VBHN_CV17212_QLRRTD Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD 1. Nguyên tắc quản lý cấp tín dụng và sử dụng Giới hạn tín dụng 1.1. Đối với Khách hàng đang được triển khai trên CLOS"}, {"id": "TD.01.075", "q": "Theo hướng dẫn quản lý và sử dụng GHTD trên hệ thống GLIMS, CLOS, khi nào GHTD của khách hàng sẽ bắt đầu có hiệu lực và được quản lý trên GLIMS (đối với khách hàng được triển khai mới trên CLOS):", "o": ["Sau khi Chi nhánh/ TSC hoàn thành luồng nghiệp vụ cấp mới/rà soát GHTD cho khách hàng trên CLOS.", "Sau khi cán bộ thẩm định hoàn thành luồng nghiệp vụ cấp mới/rà soát GHTD cho khách hàng trên CLOS.", "Sau khi Cấp thẩm quyền phê duyệt luồng nghiệp vụ cấp mới/rà soát GHTD cho khách hàng trên CLOS.", "Cả 3 phương án trên đều sai"], "a": 0, "g": "Văn bản hợp nhất 20260424_VBHN_CV17212_QLRRTD Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD 1. Nguyên tắc quản lý cấp tín dụng và sử dụng Giới hạn tín dụng 1.1. Đối với Khách hàng đang được triển khai trên CLOS"}, {"id": "TD.01.076", "q": "Ngay sau khi GHTD của khách hàng có hiệu lực trên GLIMS và Chi nhánh hoàn thành việc khai báo khách hàng được quản lý GHTD trên GLIMS với các giao dịch thực hiện trên CBS và VCBTI, các giao dịch nào sẽ được tự động gửi sang hệ thống GLIMS để kiểm tra hạn mức trước khi thực hiện?", "o": ["Giải ngân/cấp tín dụng cho khách hàng tại các hệ thống CBS", "Giải ngân/cấp tín dụng cho khách hàng tại các hệ thống T4SP", "Giải ngân/cấp tín dụng cho khách hàng tại các hệ thống VCBTI", "Cả 3 phương án trên đều đúng"], "a": 3, "g": "Văn bản hợp nhất 20260424_VBHN_CV17212_QLRRTD Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD 1. Nguyên tắc quản lý cấp tín dụng và sử dụng Giới hạn tín dụng 1.1. Đối với Khách hàng đang được triển khai trên CLOS"}, {"id": "TD.01.081", "q": "Đối với TSBĐ thông thường là TSBĐ bổ sung có giá trị 15 tỷ đồng, người sử dụng cần điền các trường nào tại màn hình định giá tài sản để hệ thống hạch toán là 1 đồng?", "o": ["Collateral value =1 đồng, Supplemental col original value = 15 tỷ đồng", "Collateral value =15 tỷ đồng, Supplemental col original value = 1 đồng", "Collateral value =15 tỷ đồng, Real-time collateral value = 1", "Real-time collateral value = 1"], "a": 0, "g": "Hệ thống Core Sign"}, {"id": "TD.01.082", "q": "Khi cán bộ thực hiện tác nghiệp chỉnh sửa bản ghi TSBĐ, cần thao tác phím chức năng nào để chuyển bản ghi sang màn hình duyệt của lãnh đạo phòng?", "o": ["F5", "F6", "F12", "F18"], "a": 3, "g": ""}, {"id": "TD.01.083", "q": "TSBĐ hình thành từ vốn vay có collateral value = 4 tỷ đồng, Real-time collateral value = 1,5 tỷ. Được gắn vào hợp đồng được bảo đảm toàn bộ với Line amount approved = 1,2 tỷ đồng, Pledged % for checking limit = 50%, BOA% = 70%. Xác định Amount of line của hợp đồng?", "o": ["1,2 tỷ đồng", "1,4 tỷ", "2 tỷ", "4 tỷ"], "a": 0, "g": "Hệ thống tính cho vay trên giá trị dự toán. = Col value*Pled%for checking limit * BOA%"}, {"id": "TD.01.084", "q": "Hợp đồng tín dụng hạn mức Revolving có hạn mức cho vay tối đa 8 tỷ, dư nợ hiện tại 4 tỷ, đã giải ngân 5 tỷ. Hạn mức còn được sử dụng của hợp đồng này là bao nhiêu?", "o": ["4 tỷ", "3 tỷ", "5 tỷ", "8 tỷ"], "a": 0, "g": "Hệ thống Core Sign"}, {"id": "TD.01.085", "q": "Một khoản vay cần điều chỉnh kỹ thuật Lịch trả nợ do lỗi tác nghiệp, KSV dùng function chức năng nào sau đây để điều chỉnh kỹ thuật lịch trả nợ của tài khoản vay?", "o": ["Function 502903 - Extend term", "Function 502080 - Maintain Loan - Change Payment Schedules", "Function 502900 - Maintain Loan - Current Term", "Function 502910: Restructure Payment Schedule"], "a": 1, "g": "CHƯƠNG 3: QUY TRÌNH TÁC NGHIỆP TÀI KHOẢN VAY III.5. Tác nghiệp chỉnh sửa kỹ thuật TKV (5.3 Chỉnh sửa lịch trả nợ Maintain Loan - Change Payment Schedules qua phân hệ CIF (901020/14/ 2=Change account) và phân hệ Loan (502080)"}, {"id": "TD.01.086", "q": "Khi Bản ghi TSBĐ đang ở trạng thái chờ duyệt, KSV vào chức năng nào để duyệt?", "o": ["“009991 Work with Supervisor's Maintenance Queue”", "\"009992 Work with Maker Maintenance Queue''", "'901020 Work with Customer''", "“901030/502013 Work with Collateral”"], "a": 0, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 2: QUY TRÌNH TÁC NGHIỆP TSBĐ II.1. Bản ghi TSBĐ (Collateral Record), điểm 1.4"}, {"id": "TD.01.087", "q": "Khi thực hiện tác nghiệp gia hạn nợ cho tài khoản vay, người dùng vào chức năng nào trên hệ thống Core Sign để điều chỉnh thông tin?", "o": ["Function 502903: Extend Loan Term", "Function 502900 - Maintain Loan - Current Term", "Function 502910: Restructure Payment Schedule", "Function 502050: Maintain Loan – Change Codes/Dates/Amounts"], "a": 0, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 4: CÁC CHUYÊN ĐỀ NGHIỆP VỤ ĐẶC THÙ IV.1. Cơ cấu nợ"}, {"id": "TD.01.088", "q": "TSBĐ của Khách hàng là Xe máy chuyên dùng có đăng ký phương tiện, khi tác nghiệp tạo bản ghi TSBĐ, cán bộ thực hiện đặt Legal ID Number như thế nào?", "o": ["Cán bộ tác nghiệp tự đặt tên", "XMCD+CIF chủ tài sản + Số đăng ký (giữa các cụm tiêu chí ngăn cách bởi dấu cách)", "XMCD+ Số đăng ký (giữa các cụm tiêu chí ngăn cách bởi dấu cách)", "XMCD+CIF chủ tài sản + Số đăng ký + Số Serial (giữa các cụm tiêu chí ngăn cách bởi dấu cách)"], "a": 1, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE Phụ lục 2: Hướng dẫn Khai báo Legal ID Number"}, {"id": "TD.01.091", "q": "Theo Quy trình tín dụng đối với KHBB, CRC Giám sát & báo cáo gửi bản chính Báo cáo các trường hợp cần chú ý tới những bộ phận nào:", "o": ["Lãnh đạo chi nhánh/GĐ KH", "i. Lãnh đạo Phòng KH ii. P.PDTD đối với các khách hàng đã được phê duyệt tín dụng bởi CTQ tại TSC (trừ khách hàng thuộc thẩm quyền phê duyệt của GĐ KH)", "CB CRC Tác nghiệp tín dụng và CB CRC TTTM trong BP CRC để biết và thực hiện theo dõi, kiểm tra khi giải ngân vốn vay/cấp tín dụng tới khách hàng", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điểm 43.2, Điều 43, QTTD đối với KHBB ban hành kèm Quyết định 2503/QĐ-VCB-QLRRTD và các văn bản sửa đổi"}, {"id": "TD.01.092", "q": "Đối với khách hàng thuộc phạm vi quản lý trên GLIMS và có khai báo cờ kiểm tra hạn mức với GLIMS (trường thông tin Customer Limit Interface) trên CBS, trường hợp nào sau đây hệ thống GLIMS sẽ không cho phép thực hiện giải ngân thêm cho tài khoản đã giải ngân một phần trên CBS?", "o": ["Ngày thực hiện giải ngân bằng với Ngày hết hạn hiệu lực giải ngân (Expiry Date) của HĐTD trên CLOS", "Giá trị giải ngân thêm vượt quá hạn mức còn được sử dụng của cấp GHTD khách hàng trên GLIMS", "Không tồn tại số CBS Ref của tài khoản vay trên GLIMS", "Tất cả các trường hợp nêu trên"], "a": 3, "g": "Văn bản hợp nhất 20260424_VBHN_CV17212_QLRRTD Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD Mục 3- Khai báo khách hàng được quản lý GHTD trên GLIMS tại các hệ thống Công văn 6626 Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD. 3.4. Một số lưu ý để việc theo dõi quản lý GHTD cho khách hàng trên GLIMS được đầy đủ, chính xác: \"Khi khách hàng được triển khai theo dõi quản lý GHTD trên GLIMS, để đảm bảo thông tin dư nợ tín dụng của khách hàng được đồng bộ đầy đủ và chính xác giữa hệ thống GLIMS và các hệ thống CBS, VCBTI và T4SP, Đơn vị cần rà soát và làm sạch dữ liệu để đảm bảo: CBS REF của tài khoản vay còn số dư trên hệ thống CBS đã được khai báo trên hệ thống CLOS và là CBS REF của HĐTD cho vay.\""}, {"id": "TD.01.093", "q": "Đối với khách hàng thuộc phạm vi quản lý trên GLIMS và có khai báo cờ kiểm tra hạn mức với GLIMS trên CBS (trường thông tin Customer Limit Interface), trường hợp nào sau đây hệ thống GLIMS sẽ không cho phép thực hiện giải ngân cho tài khoản mở MỚI trên CBS?", "o": ["CBS Ref của HĐTD cần giải ngân chưa Active trên CLOS", "Khoản giải ngân được gắn với HĐTD cho vay mở tại CIF chi nhánh phụ thuộc của khách hàng", "Ngày thực hiện giải ngân bằng với Ngày cuối cùng được phép giải ngân (Date last withdrawal allowed) của HĐTD trên CBS", "Không tồn tại số Ref của tài khoản vay mở mới trên GLIMS"], "a": 0, "g": "Văn bản hợp nhất 20260424_VBHN_CV17212_QLRRTD Hướng dẫn một số nội dung khi quản lý và sử dụng GHTD. Mục 3- Khai báo khách hàng được quản lý GHTD trên GLIMS tại các hệ thống . 3.4. Một số lưu ý để việc theo dõi quản lý GHTD cho khách hàng trên GLIMS được đầy đủ, chính xác: \"Khi khách hàng được triển khai theo dõi quản lý GHTD trên GLIMS, để đảm bảo thông tin dư nợ tín dụng của khách hàng được đồng bộ đầy đủ và chính xác giữa hệ thống GLIMS và các hệ thống CBS, VCBTI và T4SP, Đơn vị cần rà soát và làm sạch dữ liệu để đảm bảo: Các HĐTD cho vay còn hiệu lực giải ngân được đồng bộ thông tin CBS REF của HĐTD trên hệ thống CBS và trên hệ thống CLOS.\" 3.2.2. Khai báo thông tin mối quan hệ giữa CIF pháp nhân và CIF chi nhánh phụ thuộc."}, {"id": "TD.01.094", "q": "Theo hướng dẫn sử dụng cho người dùng cuối GLIMS, các CAP hạn mức sản phẩm chỉ có thể cài tại một cấp Hạn mức danh nghĩa duy nhất nào đã được duyệt trên CLOS?", "o": ["L1 - Credit Application", "L2 - Short term limit và L2 - Medium long term limit", "L3 - Short term lending limit và L3 - Medium long term lending limit", "Cài tại Cấp Hợp đồng tín dụng"], "a": 0, "g": "Tài liệu hướng dẫn sử dụng cho người dùng cuối GLIMS IV. CÀI ĐẶT HẠN MỨC Mục HẠN MỨC THEO SẢN PHẨM - trang 33"}, {"id": "TD.01.096", "q": "Cán bộ khách hàng có thể kiểm tra thông tin realtime nào sau đây trên CRC SP:", "o": ["Các Thông tin Tài trợ thương mại", "Thông tin Dư nợ của Hợp đồng tín dụng", "Các thông tin liên quan đến tài khoản vay", "Thông tin tài sản bảo đảm gắn liền với HĐTD"], "a": 1, "g": "Cẩm nang HDSD chương trình CRC SP - Mục I.2. Các chức năng chính của Chương trình"}, {"id": "TD.01.101", "q": "Để sửa lịch trả nợ của borrower loan và investor loan từ trả nợ gốc 3 tháng / lần kể từ ngày giải ngân đầu tiên thành trả nợ gốc 1 tháng / lần kể từ ngày giải ngân đầu tiên. Thời hạn vay 24 tháng, ngày giải ngân đầu tiên 15/12/2022. Cán bộ tác nghiệp:", "o": ["Sửa thông tin của borrower loan tại phân hệ Loan như sau:Vào Function 502080 Maintain Loan - Change Payment Schedules: Scheduled next due: sửa từ 15/03/2023 thành ngày 15/01/2023 Pmts In Sched: sửa từ 7 thành 23 Pmt Freq: sửa từ 3 thành 1 First Pmt: sửa từ 15/03/2023 thành ngày 15/01/2023", "Sửa thông tin của Investor loan tại phân hệ 16. Investor như sau: Vào Function 682080 Maintain Investor Loan - Change Payment Schedule: Scheduled next due: sửa từ 15/03/2023 thành ngày 15/01/2023 Pmts In Sched: sửa từ 7 thành 23 Pmt Freq: sửa từ 3 thành 1 First Pmt: sửa từ 15/03/2023 thành ngày 15/01/2023", "A và B", "A hoặc B"], "a": 2, "g": "Tài liệu Cẩm nang người sử dụng nghiệp vụ tiền vay trên SIGNATURE 'PHẦN 2 - NGHIỆP VỤ TIỀN VAY TRÊN SIGNATURE CHƯƠNG 4: CÁC CHUYÊN ĐỀ NGHIỆP VỤ ĐẶC THÙ V.7 Cho vay Đồng tài trợ"}, {"id": "TD.01.108", "q": "Các bước tra cứu thông tin GHTD của KHDN trên GLIMS:", "o": ["1. Lựa chọn phân khúc khách hàng 2. chọn “Giám sát GHTD KHDN ” 3. Click vào biểu tượng 🔍để tìm kiếm khách hàng 4. Nhập tiêu chí tìm kiếm và ấn nút \"Tìm kiếm\"", "1. Lựa chọn phân khúc khách hàng 2. chọn “Cài đặt hạn mức GHTD KHDN ” 3. Chọn \"Tìm kiếm đề xuất cài đặt hạn mức\" 4. Nhập tiêu chí tìm kiếm và ấn nút \"Tìm kiếm\"", "1. Lựa chọn phân khúc khách hàng 2. chọn “Điều chỉnh hạn mức GHTD KHDN ” 3. Chọn \"Tìm kiếm đề xuất điều chỉnh cài đặt hạn mức\" 4. Nhập tiêu chí tìm kiếm và ấn nút \"Tìm kiếm\"", "Tất cả các đáp án trên đều sai"], "a": 0, "g": "Page 14_TÀI LIỆU HƯỚNG DẪN SỬ DỤNG CHO NGƯỜI DÙNG CUỐI VÀ QUẢN TRỊ VIÊN_V9 ngày 30/10/2025"}, {"id": "TD.01.109", "q": "Hệ thống GLIMS cho phép người dùng tạo mới đề xuất cài đặt hạn mức và/hoặc tìm kiếm đề xuất cài đặt hạn mức cho từng phân khúc nào?", "o": ["Khách hàng SME", "Khách hàng ĐCTC Ngân hàng và ĐCT", "Khách hàng Doanh nghiệp", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Page 26_TÀI LIỆU HƯỚNG DẪN SỬ DỤNG CHO NGƯỜI DÙNG CUỐI VÀ QUẢN TRỊ VIÊN_V9 ngày 30/10/2025"}, {"id": "TD.01.110", "q": "Trường hợp nào sau đây người dùng không thể tạo mới đề xuất cài đặt hạn trên GLIMS cho khách hàng?", "o": ["Khách hàng đã được tạo một đề xuất cài đặt hạn mức (fresh application)", "Đề xuất cài đặt hạn mức của khách hàng đã được tạo và đang chờ xử lý.", "Đề xuất cài đặt hạn mức của khách hàng đã được phê duyệt.", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Page 27_TÀI LIỆU HƯỚNG DẪN SỬ DỤNG CHO NGƯỜI DÙNG CUỐI VÀ QUẢN TRỊ VIÊN_V9 ngày 30/10/2025"}, {"id": "TD.01.114", "q": "Các trường hợp nào sau đây người dùng không thể tạo mới đề xuất Điều chỉnh hạn mức trên GLIMS cho khách hàng?", "o": ["Khách hàng đã được tạo mới đề xuất điều chỉnh hạn mức và ở tình trạng fresh application", "Khách hàng có đề xuất điều chỉnh hạn mức đang ở bước chờ xử lý", "A và B đều đúng", "A và B đều sai"], "a": 2, "g": "Page 46_TÀI LIỆU HƯỚNG DẪN SỬ DỤNG CHO NGƯỜI DÙNG CUỐI VÀ QUẢN TRỊ VIÊN_V9 ngày 30/10/2026"}, {"id": "TD.01.119", "q": "Theo quy trình thẩm định giá TSBĐ, trường hợp TTĐGTS thẩm định giá TSBĐ, các hồ sơ nào sau đây bắt buộc phải thực hiện lưu giữ văn bản giấy?", "o": ["Bản gốc Biên bản kiểm tra thực tế TSBĐ (trường hợp bắt buộc phải lập Biên bản kiểm tra thực tế TSBĐ)", "Đề nghị thẩm định giá TSBĐ đã được ký điện tử và được luân chuyển trên hệ thống AVS", "Hồ sơ thẩm định giá TSBĐ do Bên bảo đảm cung cấp đã được lưu trữ trên hệ thống AVS", "Thông báo kết quả thẩm định giá TSBĐ đã hoàn thành ký số trên hệ thống AVS"], "a": 0, "g": "Căn cứ Khoản 8.4.1 Điều 8 Quyết định 1718/QĐ-VCB-QLRRTD ngày 15/10/2025"}, {"id": "TD.01.120", "q": "Trường hợp Cấp thẩm quyền phê duyệt kết quả thẩm định giá TSBĐ là Hội đồng định giá TSBĐ, nội dung kết quả họp của Hội đồng định giá TSBĐ thể hiện trên Báo cáo thẩm định giá tối thiểu gồm các thông tin nào?", "o": ["Thời gian, địa điểm họp, thành viên dự họp, thành viên vắng mặt, tỷ lệ tham gia, kết quả phê duyệt của Hội đồng định giá", "Thời gian, địa điểm, hình thức họp, thành viên dự họp, thành viên vắng mặt, tỷ lệ tham gia, kết quả phê duyệt của Hội đồng định giá", "Thời gian, địa điểm, hình thức họp, thành viên dự họp, thành viên vắng mặt, tỷ lệ tham gia, kết quả phê duyệt của Hội đồng định giá, tỷ lệ tán thành", "Thời gian, địa điểm họp, thành viên dự họp, thành viên vắng mặt, tỷ lệ tham gia, kết quả phê duyệt của Hội đồng định giá, tỷ lệ tán thành"], "a": 2, "g": "Căn cứ Khoản 7.3.6 Điều 7 Quyết định 1718/QĐ-VCB-QLRRTD ngày 15/10/2025"}, {"id": "TD.02.001", "q": "Phương án sử dụng vốn khả thi phải đáp ứng điều kiện nào", "o": ["Ngoài nguồn vốn vay của VCB, Khách hàng có khả năng thu xếp (các) nguồn vốn cần sử dụng theo phương án sử dụng vốn.", "Phương án, dự án thực hiện hoạt động kinh doanh hoặc phương án, dự án phục vụ nhu cầu đời sống để mua nhà ở; xây dựng, cải tạo nhà ở; nhận chuyển nhượng quyền sử dụng đất để xây nhà ở khả thi.", "A&B", "Khách hàng có khả năng về vốn, tài sản, các nguồn tài chính hợp pháp khác để trả nợ phù hợp với thời hạn cho vay."], "a": 2, "g": "Điều 7 Quyết định số 268/QĐ-HĐQT-CSTD ngày 08/3/2017 và Quyết định số 1766/QĐ-HĐQT-QLRRTD ngày 30/8/2023"}, {"id": "TD.02.002", "q": "Cơ cấu lại thời hạn trả nợ là?", "o": ["Kéo dài thêm một khoảng thời gian trả nợ một phần hoặc toàn bộ nợ gốc và/hoặc lãi tiền vay của kỳ hạn trả nợ đã thỏa thuận, thời hạn cho vay không thay đổi;", "Kéo dài thêm một khoảng thời gian trả nợ một phần hoặc toàn bộ nợ gốc và/hoặc lãi tiền vay của kỳ hạn trả nợ đã thỏa thuận (không thay đổi về số kỳ hạn trả nợ đã thỏa thuận), thời hạn cho vay không thay đổi;", "Kéo dài thêm một khoảng thời gian trả nợ gốc và/hoặc lãi tiền vay, vượt quá thời hạn cho vay đã thoả thuận.", "Cả ba đáp án trên đều đúng"], "a": 3, "g": "Khoản 2.5 Điều 2 Quyết định số 268/QĐ-HĐQT-CSTD ngày 08/3/2017 và Quyết định số 1766/QĐ-HĐQT-QLRRTD ngày 30/8/2023"}, {"id": "TD.02.003", "q": "Đối với dự án đầu tư thuộc diện chấp thuận chủ trương đầu tư, cơ quan có thẩm quyền chấp thuận chủ trương đầu tư đồng thời chấp thuận nhà đầu tư không thông qua đấu giá quyền sử dụng đất, đấu thầu lựa chọn nhà đầu tư trong các trường hợp sau đây:", "o": ["Nhà đầu tư đang có quyền sử dụng đất, trừ trường hợp Nhà nước thu hồi đất vì mục đích quốc phòng, an ninh, thu hồi đất để phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng theo quy định của pháp luật về đất đai;", "Nhà đầu tư nhận chuyển nhượng, nhận góp vốn, thuê quyền sử dụng đất nông nghiệp để thực hiện dự án đầu tư sản xuất, kinh doanh phi nông nghiệp không thuộc trường hợp Nhà nước thu hồi đất theo quy định của pháp luật về đất đai;", "Nhà đầu tư thực hiện dự án đầu tư trong khu công nghiệp, khu công nghệ cao, khu công nghệ số tập trung;", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điều 23, Luật đầu tư 2025"}, {"id": "TD.02.007", "q": "Đối tượng được tham gia đấu giá quyền sử dụng đất, đấu thầu lựa chọn nhà đầu tư thực hiện dự án có sử dụng đất là dự án Bất động sản theo quy định của pháp luật:", "o": ["Cá nhân", "Doanh nghiệp được thành lập hợp pháp theo quy định của pháp luật", "Cả A và B", "Không có đáp án nào đúng"], "a": 2, "g": "Điều 23; Điều 125 và Điều 126 Luật đất đai 2024"}, {"id": "TD.02.009", "q": "Theo Quyết định 686/QĐ-HĐQT-CSTD ngày 01/07/2016 và các văn bản sửa đổi bổ sung, điều kiện nhận bảo lãnh của doanh nghiệp làm biện pháp bảo đảm chính thức", "o": ["Có XHTD theo PD từ hạng ccc trở lên, có quy mô trung bình/lớn và không phải là doanh nghiệp mới thành lập", "Không có nợ nhóm 2 tại thời điểm xem xét nhận bảo lãnh và không có nợ xấu trong vòng 12 tháng gần nhất tính đến thời điểm xem xét nhận bảo lãnh 8", "Bên bảo lãnh là doanh nghiệp có quan hệ sở hữu, điều hành, liên doanh, liên kết, hợp tác kinh doanh với doanh nghiệp được bảo lãnh", "Tất cả câu trên đều đúng"], "a": 3, "g": "Điều 17 - Quyết định 686/QĐ-HĐQT-CSTD ngày 01/07/2016 và các văn bản sửa đổi bổ sung"}, {"id": "TD.02.010", "q": "Tần suất định giá lại của cổ phiếu niêm yết là?", "o": ["01 lần/tháng", "01 lần/2 tháng", "01 lần/3 tháng", "01 lần/6 tháng"], "a": 0, "g": "Điều 6 - Khoản 6.4.2 - Quyết định 109/QĐ-VCB-QLRRTD ngày 15/1/2019 và các văn bản sửa đổi bổ sung"}, {"id": "TD.02.012", "q": "Theo quy trình tín dụng KHBB, Đơn vị kinh doanh phải kiểm tra sử dụng vốn vay tại chỗ tối thiểu ?", "o": ["Không quy định về thời gian kiểm tra sử dụng vốn vay", "Kiểm tra tại chỗ: tối thiểu 01 lần/06 tháng xác định kể từ lần cấp tín dụng đầu tiên (đối với KH mới) và/hoặc từ lần kiểm tra tại chỗ gần nhất nếu có; Kiểm soát từ xa: tối thiểu 01 lần/03 tháng xác định kể từ lần cấp tín dụng đầu tiên (đối với KH mới) và/hoặc từ lần kiểm soát từ xa gần nhất nếu có.", "Kiểm tra tại chỗ: tối thiểu 01 lần/03 tháng xác định kể từ lần cấp tín dụng đầu tiên (đối với KH mới) và/hoặc từ lần kiểm tra tại chỗ gần nhất nếu có; Kiểm soát từ xa: tối thiểu 01 lần/06 tháng xác định kể từ lần cấp tín dụng đầu tiên (đối với KH mới) và/hoặc từ lần kiểm soát từ xa gần nhất nếu có.", "Ít nhất 06 tháng một lần"], "a": 1, "g": "Điểm 15 - Phụ lục 01 - Quyết định 2503/QĐ-VCB-QLRRTD"}, {"id": "TD.02.013", "q": "Điều nào sau đây là đúng nhất về biện pháp xử lý khi khách hàng vi phạm điều kiện tín dụng đã được phê duyệt?", "o": ["Chi nhánh ngừng giải ngân/cấp tín dụng cho đến khi khách hàng đáp ứng điều kiện tín dụng đã được phê duyệt và/hoặc được cấp thẩm quyền phê duyệt điều chỉnh điều kiện tín dụng.", "Lãnh đạo Chi nhánh xem xét quyết định tiếp tục giải ngân/cấp tín dụng trong thời hạn 03 tháng kể từ ngày phát sinh vi phạm. Hết 03 tháng nếu khách hàng vẫn chưa khắc phục thì ngừng giải ngân.", "Đối với điều kiện tín dụng trọng yếu: Chi nhánh ngừng giải ngân/cấp tín dụng cho đến khi khách hàng đáp ứng điều kiện tín dụng đã được phê duyệt và/hoặc được cấp thẩm quyền phê duyệt điều chỉnh điều kiện tín dụng. Đối với các điều kiện tín dụng không trọng yếu: Lãnh đạo Chi nhánh xem xét quyết định tiếp tục giải ngân/cấp tín dụng trong thời hạn 03 tháng kể từ ngày phát sinh vi phạm.", "Đối với điều kiện tín dụng trọng yếu: Chi nhánh ngừng giải ngân/cấp tín dụng cho đến khi khách hàng đáp ứng điều kiện tín dụng đã được phê duyệt và/hoặc được cấp thẩm quyền phê duyệt điều chỉnh điều kiện tín dụng. Đối với các điều kiện tín dụng không trọng yếu: Lãnh đạo Chi nhánh xem xét quyết định tiếp tục giải ngân/cấp tín dụng trong thời hạn 03 tháng kể từ ngày phát sinh vi phạm; trường hợp hết 3 tháng mà KH chưa khắc phục được, Chi nhánh trình cấp thẩm quyền xem xét điều chỉnh điều kiện (nếu đánh giá KH vi phạm do yếu tố khách quan, không ảnh hưởng đến khả năng trả nợ)."], "a": 3, "g": "Điểm 41.3.7, Khoản 41.3, Điều 41, quy định 2503/QĐ-VCB-QLRRTD ngày 21/12/2028, sửa đổi bởi quy định số 512/QĐ-VCB-QLRRTD ngày 31/03/2020"}, {"id": "TD.02.014", "q": "Theo quy trình hiện tại, Bộ phận thẩm định tín dụng tại Chi nhánh được giao thực hiện thẩm định giá loại tài sản nào dưới đây?", "o": ["TSBĐ bổ sung", "TSBĐ đặc thù và biện pháp bảo lãnh", "TSBĐ có tính thanh khoản cao và hàng hóa bảo đảm", "Tất cả các loại tài sản trên"], "a": 3, "g": "Phu lục 1 Quy trình số 1718/QT-VCB-QLRRTD ngày 17/10/2025, sửa đổi bổ sung bới Quyết định số 1192 ngày 30/06/2026"}, {"id": "TD.02.015", "q": "Theo quy định 210/QĐ-VCB-CSTD ngày 20/03/2015 v/v cấp tín dụng để đầu tư, kinh doanh cố phiếu thì nhận định nào sau đây đúng?", "o": ["Khoản vay mua cổ phiếu phải được đảm bảo 100% bằng TS có tính thanh khoản cao", "Hiện nay việc cho vay mua cổ phiếu phải được Tổng giám đốc phê duyệt chủ trương", "Thời hạn cho vay mua cổ phiếu tối đa 12 tháng và phải được HDTD TƯ phê duyệt GHTD mục đích mua cổ phần, cổ phiếu", "Thời hạn cho vay mua cổ phiếu tối đa 12 tháng và phải được HDTD TƯ phê duyệt GHTD mục đích mua cổ phần"], "a": 1, "g": "Quy định 210/QĐ-VCB-CSTD ngày 20/03/2015 (Khoản 6.6 - Điều 6 và Điều 10, 11)"}, {"id": "TD.02.017", "q": "Trường hợp ĐVKD tiến hành tự định giá song song với việc thuê tổ chức thẩm định giá, giá trị định giá TSBĐ được xác định như thế nào?", "o": ["Lấy theo giá do tổ chức thẩm định giá cung cấp vì đây là đơn vị định giá chuyên nghiệp, độc lập", "Lấy theo giá bình quân giữa giá do ĐVKD tự định giá và giá do tổ chức thẩm định giá cung cấp", "Lấy theo giá thấp hơn giữa giá do ĐVKD tự định giá và giá do tổ chức thẩm định giá cung cấp", "Lấy theo giá do ĐVKD tự định giá vì ĐVKD chịu trách nhiệm cuối cùng về TSBĐ"], "a": 2, "g": "Theo điểm 6.3.3 khoản 6.3 Điều 6 VBHN Quyết định 109/QĐ-VCB-QLRRTD ngày 15/01/2019"}, {"id": "TD.02.018", "q": "Công thức tính DSCR để kiểm tra điều kiện tín dụng: \"Khả năng trả nợ dài hạn (DSCR) ≥ 1, căn cứ số liệu BCTC năm\"", "o": ["Công thức tính DSCR = (LNST theo năm N + Khấu hao năm N + lãi vay năm N)/(Nợ dài hạn đến hạn trả 12 tháng tới của năm (N -1) + chi phí lãi vay năm N)", "Công thức tính DSCR = (LNST theo năm N + Khấu hao năm N )/(Nợ dài hạn đến hạn trả 12 tháng tới của năm (N -1))", "Công thức tính DSCR = (LNST theo năm N + Khấu hao năm N + lãi vay năm N)/(Nợ dài hạn đến hạn trả 12 tháng tới của năm (N) + chi phí lãi vay năm N)", "Công thức tính DSCR = (LNST theo năm N + Khấu hao năm N + lãi vay năm N)/(Nợ dài hạn đến hạn trả 12 tháng tới của năm (N+1) + chi phí lãi vay năm N)"], "a": 0, "g": "Hướng dẫn sử dụng termsheet DTDA mà PDTD đã gửi tới các Chi nhánh theo công văn 61453 ngày 20/12/2022"}, {"id": "TD.02.019", "q": "Câu nào dưới đây thể hiện đúng thời điểm có hiệu lực của Đăng ký biện pháp bảo đảm đối với TSBĐ", "o": ["Đối với quyền sử dụng đất, tài sản gắn liền với đất là thời điểm cơ quan đăng ký cập nhật nội dung đăng ký vào Cơ sở dữ liệu", "Đối với tài sản gắn liền với đất HTTL là thời điểm cơ quan đăng ký cập nhật nội dung đăng ký vào Cơ sở dữ liệu", "Đối với chứng khoán không đăng ký tập trung là thời điểm nội dung đăng ký được cập nhật vào Cơ sở dữ liệu", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điều 6, Nghị định 99/2022/NĐ_CP ngày 30/11/2022 sửa đổi bởi mục 3 điều 11 của Nghị định 18/2026/NĐ-CP sửa đổi 1 số điều của NĐ 99"}, {"id": "TD.02.020", "q": "Theo quy định hiện hành tỷ lệ BOA áp dụng như thế nào với tài sản bảo đảm sau: Tài sản gắn liền với đất là công trình phụ trợ không thuộc đối tượng cấp giấy chứng nhận quyền sở hữu theo quy định của pháp luật nhưng vẫn đủ điều kiện để giao dịch, thế chấp và đáp ứng quy định liên quan đến tài sản bảo đảm của VCB?", "o": ["0% do tài sản chỉ được nhận là biện pháp bảo đảm bổ sung", "60% trường hợp tại thời điểm thẩm định giá không đủ căn cứ để xác định giá trị thị trường (theo phương pháp so sánh)", "55% trường hợp tại thời điểm thẩm định giá không đủ căn cứ để xác định giá trị thị trường (theo phương pháp so sánh)", "Không đáp án nào đúng"], "a": 2, "g": "Mục III Phụ lục 2 Quyết định 109/QĐ-VCB-QLRRTD và các văn bản sửa đổi, bổ sung (VBHN QĐ 109)"}, {"id": "TD.02.021", "q": "Tài sản bảo đảm là Quyền sử dụng đất ở tại Lào Cai. Do không có giá trị thị trường để so sánh, vì vậy Chi nhánh quyết định tự định giá (không thuê bên thứ ba có chức năng định giá thực hiện) theo Bảng giá đất có hiệu lực tại thời điểm định giá. Nhận định nào sau đây là đúng:", "o": ["Mức cấp tín dụng tối đa trên giá trị TSBĐ áp dụng đối với TSBĐ là 100%", "Mức cấp tín dụng tối đa trên giá trị TSBĐ áp dụng đối với TSBĐ là 95%", "Mức cấp tín dụng tối đa trên giá trị TSBĐ áp dụng đối với TSBĐ là 90%", "Không đáp án nào đúng"], "a": 1, "g": "Phụ lục II. Mục III. Bất dộng sản 109/QĐ-VCB-QLRRTD và các văn bản sửa đổi, bổ sung"}, {"id": "TD.02.022", "q": "Công ty X là doanh nghiệp chế biến tôm xuất khẩu sang thị trường Mỹ, châu Âu và Nhật Bản. Công ty đề nghị VCB cho vay ngắn hạn ngoại tệ để thực hiện sản xuất kinh doanh phục vụ cho phương án xuất khẩu. Việc đánh giá điều kiện sử dụng vốn vay bằng ngoại tệ của Khách hàng phải căn cứ vào các hồ sơ sau:", "o": ["- Phương án sử dụng vốn và/ hoặc giấy nhận nợ, Khách hàng nêu rõ nguồn ngoại tệ dùng để trả nợ vay và cam kết sẽ chuyển đủ ngoại tệ về tài khoản mở tại VCB để trả nợ vay bằng ngoại tệ của KH tại VCB.", "- Thẩm định, đánh giá KH có đủ ngoại tệ từ nguồn thu sản xuất kinh doanh/ xuất khẩu để trả nợ vay căn cứ vào một số hồ sơ như: HĐXK đã ký, đơn hàng của đối tác, LC đã mở, nguồn thu từ sản xuất - kinh doanh, nguồn thu từ xuất khẩu theo dữ liệu lịch sử.", "Cả A&B đều đúng", "Cả A&B đều sai"], "a": 2, "g": "Theo quy định tại mục II công văn 3547/VCB-QLRRTD v/v hướng dẫn cho vay bằng ngoại tệ"}, {"id": "TD.03.001", "q": "Theo quy định của Luật giá 2023 hiện hành thì Thẩm định giá là:", "o": ["Quá trình cơ quan nhà nước có thẩm quyền hoặc tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ thực hiện xác định giá của hàng hóa, dịch vụ", "Hoạt động tư vấn xác định giá trị của tài sản thẩm định giá tại một địa điểm, thời điểm, phục vụ cho mục đích nhất định do doanh nghiệp thẩm định giá, hội đồng thẩm định giá thực hiện theo Chuẩn mực thẩm định giá Việt Nam", "Quá trình cơ quan nhà nước có thẩm quyền hoặc tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ thực hiện xác định giá của hàng hóa, dịch vụ phù hợp với giá thị trường tại một địa điểm, thời điểm nhất định, phục vụ cho mục đích nhất định theo tiêu chuẩn thẩm định giá", "Việc cơ quan, tổ chức có chức năng xác định giá trị bằng tiền của các loại tài sản theo quy định của Bộ luật dân sự phù hợp với giá thị trường tại một địa điểm, thời điểm nhất định, phục vụ cho mục đích nhất định"], "a": 1, "g": "Khoản 16 Điều 4 Luật giá số 16/2023/QH15 ngày 19/06/2023"}, {"id": "TD.03.002", "q": "Theo quy định của Bộ Luật Dân sự hiện hành thì Quyền tài sản là:", "o": ["Quyền trị giá được bằng vật, bao gồm quyền tài sản đối với đối tượng quyền sở hữu trí tuệ, quyền sử dụng đất và các quyền tài sản khác", "Quyền trị giá được bằng tiền, bao gồm quyền tài sản đối với đối tượng quyền sở hữu trí tuệ, quyền sử dụng đất và các quyền tài sản khác", "Quyền trị giá được bằng tiền kỹ thuật số, bao gồm quyền tài sản đối với đối tượng quyền sở hữu trí tuệ, quyền sử dụng đất và các quyền tài sản khác", "Quyền trị giá được bằng tiền, bao gồm quyền tài sản đối với đối tượng quyền sở hữu trí tuệ, quyền sử dụng đất"], "a": 1, "g": "Điều 115 Bộ luật dân sự số 91/2015/QH13 ngày 24/11/2015"}, {"id": "TD.03.003", "q": "Theo quy định của Bộ Luật Dân sự hiện hành thì Quyền sở hữu bao gồm:", "o": ["Quyền chiếm dụng, quyền sử dụng và quyền định đoạt tài sản của chủ sở hữu theo quy định của luật", "Quyền chiếm hữu, quyền sử dụng và quyền quyết định tài sản của chủ sở hữu theo quy định của luật", "Quyền chiếm hữu, quyền sử dụng và quyền định đoạt tài sản của chủ sở hữu theo quy định của luật", "Quyền tư hữu, quyền sử dụng và quyền định đoạt tài sản của chủ sở hữu theo quy định của luật"], "a": 2, "g": "Điều 158 Bộ luật dân sự số 91/2015/QH13 ngày 24/11/2015"}, {"id": "TD.03.006", "q": "Theo quy định của Luật đất đai 2024 thì loại đất nào sau đây không thuộc nhóm đất nông nghiệp:", "o": ["Đất trồng cây lâu năm", "Đất nuôi trồng thủy sản", "Đất làm muối", "Đất có mặt nước chuyên dùng"], "a": 3, "g": "Khoản 2,3 Điều 9 Luật đất đai số 31/2024/QH15 ngày 18/01/2024"}, {"id": "TD.03.007", "q": "Theo quy định của Luật đất đai 2024 và các văn bản hướng dẫn thì loại đất nào sau đây không thuộc nhóm đất phi nông nghiệp:", "o": ["Đất ươm tạo cây giống, con giống và đất trồng hoa, cây cảnh; đất trồng trọt, chăn nuôi, nuôi trồng thủy sản cho mục đích học tập, nghiên cứu thí nghiệm, thực nghiệm", "Đất ở gồm đất ở tại nông thôn, đất ở tại đô thị", "Đất xây dựng trụ sở cơ quan", "Đất làm nghĩa trang, nghĩa địa, nhà tang lễ, nhà hỏa táng"], "a": 0, "g": "Khoản 1, 2 Điều 10 Luật đất đai số 31/2024/QH15 ngày 18/01/2024 Điểm a Khoản 7 Điều 4 Nghị định 102/2024/NĐ-CP ngày 30/07/2024"}, {"id": "TD.03.008", "q": "Theo quy định của Luật nhà ở 2023 thì Nhà ở là:", "o": ["Công trình xây dựng với mục đích để sản xuất và phục vụ các nhu cầu sinh hoạt của hộ gia đình, cá nhân", "Công trình xây dựng với mục đích để kinh doanh thương mại và phục vụ các nhu cầu sinh hoạt của hộ gia đình, cá nhân", "Công trình xây dựng với mục đích để đầu tư và phục vụ các nhu cầu sinh hoạt của hộ gia đình, cá nhân", "Công trình xây dựng với mục đích để ở và phục vụ nhu cầu sinh hoạt của gia đình, cá nhân. Nhà ở được sử dụng vào mục đích để ở và mục đích không phải để ở mà pháp luật không cấm là nhà ở có mục đích sử dụng hỗn hợp"], "a": 3, "g": "Khoản 1 Điều 3 Luật nhà ở số 27/2023/QH15 ngày 27/11/2023"}, {"id": "TD.03.009", "q": "Theo quy định của Luật Nhà ở 2023, phát biểu nào sau đây là đúng:", "o": ["Chủ sở hữu nhà ở là cá nhân được thế chấp nhà ở tại tổ chức tín dụng, tổ chức kinh tế đang hoạt động tại Việt Nam", "Chủ sở hữu nhà ở là cá nhân được thế chấp nhà ở tại tổ chức tín dụng, tổ chức kinh tế đang hoạt động tại Việt Nam hoặc cá nhân theo quy định của pháp luật, trừ trường hợp thế chấp dự án đầu tư xây dựng nhà ở và nhà ở hình thành trong tương lai", "Chủ sở hữu nhà ở là cá nhân được thế chấp nhà ở tại tổ chức tín dụng, tổ chức kinh tế đang hoạt động tại Việt Nam, trừ trường hợp thế chấp dự án đầu tư xây dựng nhà ở và nhà ở hình thành trong tương lai", "Chủ sở hữu nhà ở là cá nhân được thế chấp nhà ở tại tổ chức tín dụng đang hoạt động tại Việt Nam"], "a": 1, "g": "Khoản 2 Điều 181 Luật nhà ở số 27/2023/QH15 ngày 27/11/2023"}, {"id": "TD.03.012", "q": "Theo Chuẩn mực thẩm định giá Việt Nam về Cách tiếp cận từ thị trường hiện hành thì một tài sản được coi là có hoạt động chuyển nhượng/chào mua/chào bán công khai trên thị trường khi nào?", "o": ["Thu thập được ít nhất 02 tài sản so sánh đã chuyển nhượng hoặc được chào mua hoặc chào bán trên thị trường gần thời điểm thẩm định giá và địa điểm của tài sản thẩm định giá", "Thu thập được ít nhất 03 tài sản so sánh đã chuyển nhượng hoặc được chào mua hoặc chào bán trên thị trường gần thời điểm thẩm định giá và địa điểm của tài sản thẩm định giá", "Thu thập được ít nhất 03 tài sản so sánh từ các tổ chức, cá nhân khác nhau đã chuyển nhượng hoặc được chào mua hoặc chào bán trên thị trường gần thời điểm thẩm định giá và địa điểm của tài sản thẩm định giá", "Thu thập được ít nhất 02 tài sản so sánh từ các tổ chức, cá nhân khác nhau đã chuyển nhượng hoặc được chào mua hoặc chào bán trên thị trường gần thời điểm thẩm định giá và địa điểm của tài sản thẩm định giá"], "a": 2, "g": "Khoản 2 Điều 5 Chuẩn mực Thẩm định giá Việt Nam về Cách tiếp cận từ thị trường - Thông tư 32/2024/TT-BTC ngày 16/5/2024 (hiệu lực 01/7/2024)"}, {"id": "TD.03.015", "q": "Theo Chuẩn mực Thẩm định giá Việt Nam hiện hành thì Phương pháp chi phí tái tạo là:", "o": ["Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa chi phí tái tạo (chi phí tính tại thời điểm thẩm định giá để tạo ra hoặc có được tài sản khác biệt với tài sản thẩm định giá khi mới 100%) và giá trị hao mòn của tài sản thẩm định giá", "Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa chi phí tái tạo (chi phí tính tại thời điểm thẩm định giá để tạo ra hoặc có được tài sản giống hệt với tài sản thẩm định giá khi mới 100%) và giá trị hao mòn của tài sản thẩm định giá", "Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa doanh thu tạo ra tài sản giống hệt với tài sản thẩm định giá theo giá thị trường hiện hành và giá trị hao mòn của tài sản thẩm định giá", "Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa lợi nhuận tạo ra tài sản giống hệt với tài sản thẩm định giá theo giá thị trường hiện hành và giá trị hao mòn của tài sản thẩm định giá"], "a": 1, "g": "Khoản 12 Điều 3 và Khoản 1 Điều 6 Chuẩn mực Thẩm định giá Việt Nam về Cách tiếp cận từ chi phí - Thông tư 32/2024/TT-BTC ngày 16/5/2024 (hiệu lực 01/7/2024)"}, {"id": "TD.03.016", "q": "Theo Chuẩn mực Thẩm định giá Việt Nam hiện hành thì Phương pháp chi phí thay thế là:", "o": ["Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa chi phí tái tạo (chi phí tính tại thời điểm thẩm định giá để tạo ra hoặc có được tài sản giống hệt với tài sản thẩm định giá khi mới 100%) và giá trị hao mòn của tài sản thẩm định giá", "Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa doanh thu thay thế để tạo ra một tài sản tương tự tài sản thẩm định giá và giá trị hao mòn của tài sản thẩm định giá", "Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa chi phí thay thế (chi phí để tạo ra hoặc có được tài sản thay thế mới 100% tại thời điểm thẩm định giá) và giá trị hao mòn của tài sản thẩm định giá", "Phương pháp xác định giá trị của tài sản thẩm định giá dựa trên cơ sở chênh lệch giữa lợi nhuận thay thế để tạo ra một tài sản tương tự tài sản thẩm định giá và giá trị hao mòn của tài sản thẩm định giá"], "a": 2, "g": "Khoản 13 Điều 3 và Khoản 1 Điều 5 Chuẩn mực Thẩm định giá Việt Nam về Cách tiếp cận từ chi phí - Thông tư 32/2024/TT-BTC ngày 16/5/2024 (hiệu lực 01/7/2024)"}, {"id": "TD.03.017", "q": "Theo Chuẩn mực Thẩm định giá Việt Nam hiện hành thì Cách tiếp cận từ thu nhập là:", "o": ["Cách thức xác định giá trị của tài sản thông qua việc quy đổi dòng chi phí trong tương lai có được từ tài sản về giá trị hiện tại", "Cách thức xác định giá trị của tài sản thông qua việc quy đổi dòng tiền hiện tại có được từ tài sản về giá trị tương lai", "Cách thức xác định giá trị của tài sản thông qua việc quy đổi dòng tiền trong tương lai có được từ tài sản về giá trị hiện tại", "Cách thức xác định giá trị của tài sản thông qua việc quy đổi dòng tiền kỹ thuật số trong tương lai có được từ tài sản về giá trị hiện tại"], "a": 2, "g": "Khoản 1 Điều 3 Chuẩn mực Thẩm định giá Việt Nam về Cách tiếp cận từ thu nhập - Thông tư 32/2024/TT-BTC ngày 16/5/2024 (hiệu lực 01/7/2024)"}, {"id": "TD.03.018", "q": "Theo Chuẩn mực Thẩm định giá Việt Nam hiện hành thì Phương pháp vốn hóa trực tiếp là:", "o": ["Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi lợi nhuận hàng năm dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất chiết khấu phù hợp", "Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi doanh thu hàng năm dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất vốn hóa phù hợp", "Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi chi phí hàng năm dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất chiết khấu phù hợp", "Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi dòng thu nhập thuần ổn định hàng năm dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất vốn hóa phù hợp"], "a": 3, "g": "Khoản 2 Điều 3 Chuẩn mực Thẩm định giá Việt Nam về Cách tiếp cận từ thu nhập - Thông tư 32/2024/TT-BTC ngày 16/5/2024 (hiệu lực 01/7/2024)"}, {"id": "TD.03.019", "q": "Theo Chuẩn mực Thẩm định giá Việt Nam hiện hành thì Phương pháp dòng tiền chiết khấu là:", "o": ["Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi các dòng tiền trong tương lai dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất chiết khấu phù hợp.", "Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi doanh thu trong tương lai dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất chiết khấu phù hợp", "Phương pháp thẩm định giá xác định giá trị của tài sản dựa trên cơ sở quy đổi chi phí trong tương lai dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất vốn hóa phù hợp", "Phương pháp thẩm định giá xác định giá trị của tài sản thẩm định giá dựa trên cơ sở quy đổi các dòng tiền kỹ thuật số trong tương lai dự kiến có được từ tài sản về giá trị hiện tại thông qua việc sử dụng tỷ suất vốn hóa phù hợp"], "a": 0, "g": "Khoản 3 Điều 3 Chuẩn mực Thẩm định giá Việt Nam về Cách tiếp cận từ thu nhập - Thông tư 32/2024/TT-BTC ngày 16/5/2024 (hiệu lực 01/7/2024)"}, {"id": "TD.04.003", "q": "Tài sản nào sau đây được xem xét nhận làm biện pháp bảo đảm chính thức tại VCB", "o": ["Quyền sử dụng đất mà pháp luật về đất đai quy định được thế chấp", "Vàng", "Trái phiếu VCB", "Tất cả các đáp án trên"], "a": 3, "g": "Khoản 3, Điều 6, Quyết định 686/QĐ-HĐQT-CSTD ngày 01/7/2016 v/v ban hành Chính sách bảo đảm tín dụng của VCB"}, {"id": "TD.04.015", "q": "Theo quy định của VCB, Tài sản nào sau đây không được nhận làm tài sản bảo đảm?", "o": ["Tài sản của thành viên Hội đồng quản trị, thành viên Ban Kiểm soát, Tổng Giám đốc, Phó Tổng Giám đốc và các chức danh tương đương của VCB", "Tài sản của cha, mẹ, vợ, chồng, con, anh, chị, em của thành viên Hội đồng quản trị, thành viên Ban Kiểm soát, Tổng Giám đốc, Phó Tổng Giám đốc và các chức danh tương đương của VCB", "Tài sản của pháp nhân là cổ đông có người đại diện phần vốn góp là thành viên Hội đồng quản trị, Ban kiểm soát VCB", "Tất cả các tài sản trên"], "a": 3, "g": "Phụ lục 1 Quyết định 686/QĐ-HĐQT-CSTD ngày 01/7/2016 v/v ban hành Chính sách bảo đảm tín dụng của VCB"}, {"id": "TD.04.016", "q": "Theo Quy trình Quản lý hồ sơ TSBĐ và TSBĐ, CBQLN kiểm tra hồ sơ TSBĐ và TSBĐ tối thiểu gồm những nội dung nào?", "o": ["Tính đầy đủ, hợp lệ của hồ sơ TSBĐ và TSBĐ (nếu có);", "Sự phù hợp về nội dung của hồ sơ TSBĐ và TSBĐ (nếu có) với các điều kiện đã được phê duyệt.", "Cả A và B", "Không đáp án nào đúng"], "a": 2, "g": "Điểm 1.1.3 Khoản 1.1 Điều 1 Phụ lục 02 Quyết định 1125/QĐ-VCB-CSTD ngày 18/8/2017"}, {"id": "TD.04.017", "q": "Theo quy trình quản lý hồ sơ TSBĐ và TSBĐ tại Chi nhánh, khi giải chấp hồ sơ TSBĐ, CBQLN phải lập mấy bản gốc Thông báo xuất kho (Mẫu QLHSTS.TBXK.02b), ký trên các trang và trình Lãnh đạo BPQLN phê duyệt kèm theo bản sao phê duyệt của cấp có thẩm quyền.", "o": ["1", "2", "3", "4"], "a": 1, "g": "Khoản 1.2.2 Phụ lục 02 Quy trình quản lý hồ sơ TSBĐ và TSBĐ tại QĐ số 1125/QĐ-VCB-CSTD ngày 18/8/2017 v/v ban hành Quy trình quản lý hồ sơ tài sản bảo đảm và tài sản bảo đảm của Ngân hàng TMCP Ngoại thương Việt Nam được sửa đổi bổ sung bởi Khoản 7 Điều 1 QĐ số 1148/QĐ-VCB-QLRRTD ngày 30/06/2020"}, {"id": "TD.04.031", "q": "Theo quy trình tín dụng trên RLOS: Phân khúc khách hàng nào thuộc phạm vi triển khai trên hệ thống RLOS?", "o": ["Khách hàng cá nhân", "KH Micro SME", "KH SME", "A và B"], "a": 3, "g": "Mục 1 Công văn số 8725/VCB-QLRRTD ngày 23/12/2022 v/v Hướng dẫn một số nội dung đặc thù trong QTTD thực hiện trên RLOS và các văn bản sửa đổi bổ sung"}, {"id": "TD.04.032", "q": "Theo quy trình tín dụng trên RLOS: phương thức luân chuyển hồ sơ điện tử thông qua RLOS thực hiện theo nguyên tắc nào sau đây?", "o": ["Danh mục hồ sơ luân chuyển giữa các bộ phận, hồ sơ trình CTQ và Danh mục hồ lưu, bàn giao sau phê duyệt trên RLOS là bản scan màu hồ sơ quy định", "BC TĐTD làm căn cứ cho cấp thẩm quyền rà soát, phê duyệt tín dụng là bản chiết xuất định dạng .pdf (có hiển thị thời điểm chiết xuất và tên CBTĐ chiết xuất) và được đính kèm tự động lên Hệ thống RLOS, đảm bảo chính xác và khớp đúng với toàn bộ thông tin, hồ sơ khai báo trên Hệ thống RLOS được trình lên cấp thẩm quyền rà soát/phê duyệt", "Phụ lục Thông báo phê duyệt tín dụng làm căn cứ thực hiện cho các bước sau phê duyệt là Bảng các điều kiện phê duyệt được chiết xuất định dạng .pdf (có hiển thị thời điểm chiết xuất và tên CBTĐ chiết xuất) và được đính kèm tự động lên Hệ thống RLOS", "Tất cả phương án trên"], "a": 3, "g": "Mục 3.4 Công văn số 8725/VCB-QLRRTD ngày 23/12/2022 v/v Hướng dẫn một số nội dung đặc thù trong QTTD thực hiện trên RLOS và các văn bản sửa đổi bổ sung"}, {"id": "TD.04.035", "q": "Theo quy định tại Công văn 23388/VCB-QLRRTD ngày 31/10/2025 v/v quy định phạm vi triển khai CLOS và các văn bản sửa đổi, bổ sung, đối tượng khách hàng tổ chức nào không phải triển khai trên Hệ thống CLOS?", "o": ["a) Khách hàng thuộc đối tượng không bắt buộc phải xác định GHTD trước khi cấp tín dụng. b) Khách hàng SME nhỏ/siêu nhỏ tín dụng theo quy định của VCB trong từng thời kỳ; c) Khách hàng SME của Phòng giao dịch (PGD) trong trường hợp PGD không bố trí được cán bộ thẩm định; d) Khách hàng được cấp có thẩm quyền phê duyệt không triển khai trên hệ thống CLOS;", "a) Khách hàng SME nhỏ/siêu nhỏ tín dụng theo quy định của VCB trong từng thời kỳ; b) Khách hàng SME của Phòng giao dịch (PGD) trong trường hợp PGD không bố trí được cán bộ thẩm định; c) Khách hàng được cấp có thẩm quyền phê duyệt không triển khai trên hệ thống CLOS;", "a) Khách hàng thuộc đối tượng không bắt buộc phải xác định GHTD trước khi cấp tín dụng. b) Khách hàng SME nhỏ/siêu nhỏ tín dụng theo quy định của VCB trong từng thời kỳ; c) Khách hàng được cấp có thẩm quyền phê duyệt không triển khai trên hệ thống CLOS;", "a) Khách hàng thuộc đối tượng không bắt buộc phải xác định GHTD trước khi cấp tín dụng. b) Khách hàng SME của Phòng giao dịch (PGD) trong trường hợp PGD không bố trí được cán bộ thẩm định; d) Khách hàng được cấp có thẩm quyền phê duyệt không triển khai trên hệ thống CLOS;"], "a": 1, "g": "Khoản 1.2 Mục 1 Công văn 23388/VCB-QLRRTD ngày 31/10/2025"}, {"id": "TD.04.037", "q": "Theo quy định tại Công văn 23366/VCB-QLRRTD ngày 31/10/2025 v/v hướng dẫn QTTD thực hiện trên hệ thống CLOS và các vă bản sửa đổi, người thực hiện ký số và người nhận tài liệu ký số có trách nhiệm kiểm tra thông tin chứng thư số và tài liệu ký số như thế nào?", "o": ["Người thực hiện ký số có trách nhiệm kiểm tra trạng thái của chữ ký số/chứng thư số được cấp còn hiệu lực trước khi thực hiện ký số và người nhận tài liệu ký số cũng có trách nhiệm kiểm tra tài liệu được ký số để xác định tài liệu ký số có hiệu lực.", "Người thực hiện ký số có trách nhiệm kiểm tra trạng thái của chữ ký số/chứng thư số được cấp còn hiệu lực trước khi thực hiện ký số cũng có trách nhiệm kiểm tra tài liệu được ký số để xác định tài liệu ký số có hiệu lực. Người nhận tài liệu ký số không có trách nhiệm kiểm tra tài liệu được ký số.", "Người thực hiện ký số có trách nhiệm kiểm tra trạng thái của chữ ký số/chứng thư số được cấp còn hiệu lực trước khi thực hiện ký số cũng có trách nhiệm kiểm tra tài liệu được ký số để xác định tài liệu ký số có hiệu lực. Người nhận tài liệu ký số có trách nhiệm kiểm tra cả chữ ký số/chứng thư số của người ký số và tài liệu được ký số để xác định tài liệu ký số có hiệu lực.", "Người thực hiện ký số và người nhận tài liệu ký số chỉ có trách nhiệm kiểm tra tài liệu được ký số để xác định tài liệu ký số có hiệu lực"], "a": 0, "g": "Điểm e) khoản 4.4 Mục 4 Công văn 23366/VCB-QLRRTD ngày 31/10/2025 (sửa đổi bổ sung bởi Công văn 9579/VCB-QLRRTD ngày 01/06/2026)"}, {"id": "TD.04.045", "q": "Theo hướng dẫn tại Công văn 17212/VCB-QLRRTD ngày 15/08/2025 v/v hướng dẫn một số nội dung khi quản lý và sử dụng GHTD của KHTC trên các hệ thống và các văn bản sửa đổi, bổ sung, để đảm bảo thông tin dư nợ tín dụng của khách hàng được ghi nhận đồng bộ, chính xác giữa các hệ thống và hỗ trợ việc theo dõi, quản lý GHTD của KHTC trên các hệ thống, Trụ sở chính đã xây dựng và triển khai sử dụng các báo cáo nào sau đây để hỗ trợ quản lý GHTD của khách hàng trên các hệ thống?", "o": ["a) Báo cáo giao dịch đồng bộ không thành công trên GLIMS. b) Báo cáo chi tiết GHTD của KHTC trên CLOS. c) Báo cáo hợp đồng tín dụng loại trừ không tính vào GHTD. d) Báo cáo chi tiết TSBĐ thanh khoản cao của các HĐTD loại trừ không tính vào GHTD e) Báo cáo theo dõi cài đặt, điều chỉnh hạn mức CAP trên GLIMS. f) Báo cáo các trường hợp khách hàng triển khai ngoài CLOS.", "a) Báo cáo giao dịch đồng bộ không thành công trên GLIMS. b) Báo cáo chi tiết GHTD của KHTC trên CLOS. c) Báo cáo hợp đồng tín dụng loại trừ không tính vào GHTD. d) Báo cáo các trường hợp khách hàng triển khai ngoài CLOS. e) Báo cáo theo dõi cài đặt, điều chỉnh hạn mức CAP trên GLIMS. f) Báo cáo các trường hợp NCLQ khai báo chưa chính xác trên CBS và chương trình đồng bộ thông tin NCLQ từ CBS sang CLOS.", "a) Báo cáo giao dịch đồng bộ không thành công trên GLIMS. b) Báo cáo chi tiết GHTD của KHTC trên CLOS. c) Báo cáo các trường hợp khách hàng triển khai ngoài CLOS. d) Báo cáo chi tiết TSBĐ thanh khoản cao của các HĐTD loại trừ không tính vào GHTD e) Báo cáo theo dõi cài đặt, điều chỉnh hạn mức CAP trên GLIMS. f) Báo cáo các trường hợp NCLQ khai báo chưa chính xác trên CBS và chương trình đồng bộ thông tin NCLQ từ CBS sang CLOS.", "a) Báo cáo giao dịch đồng bộ không thành công trên GLIMS. b) Báo cáo chi tiết GHTD của KHTC trên CLOS. c) Báo cáo hợp đồng tín dụng loại trừ không tính vào GHTD. d) Báo cáo chi tiết TSBĐ thanh khoản cao của các HĐTD loại trừ không tính vào GHTD e) Báo cáo theo dõi cài đặt, điều chỉnh hạn mức CAP trên GLIMS. f) Báo cáo các trường hợp NCLQ khai báo chưa chính xác trên CBS và chương trình đồng bộ thông tin NCLQ từ CBS sang CLOS."], "a": 3, "g": "Khoản 3.5 Mục 3 Công văn 17212/VCB-QLRRTD ngày 15/08/2025 (sửa đổi, bổ sung bởi Công văn 7210/VCB-QLRRTD ngày 24/04/2026)"}, {"id": "TD.04.046", "q": "Theo quy định tại Công văn 17212/VCB-QLRRTD ngày 15/08/2025 v/v hướng dẫn một số nội dung khi quản lý và sử dụng GHTD của KHTC trên các hệ thống và các văn bản sửa đổi, bổ sung, trường hợp phát hành bảo lãnh, L/C bảo đảm đầy đủ bằng tài sản thanh khoản cao theo cơ chế đặc thù không tính vào GHTD, Đơn vị thực hiện luồng cấp tín dụng trên CLOS để trình cấp thẩm quyền xem xét, quyết định như một khoản cấp tín dụng thông thường và cần lưu ý các nội dung nào sau đây khi tác nghiệp trên CLOS?", "o": ["Khi tác nghiệp mở HĐTD trên CLOS, tại tab [Giá trị tài trợ và lãi suất] của màn hình thông tin HĐTD, trường [Ngoại lệ] chọn “Có” (tức có tích chọn). Sử dụng tính năng STP của CLOS để mở HĐTD trên CBS và gắn (link) bản ghi TSBĐ là tài sản thanh khoản cao.", "Khi tác nghiệp mở HĐTD trên CLOS, tại tab [Giá trị tài trợ và lãi suất] của màn hình thông tin HĐTD, trường [Ngoại lệ] chọn “Có” (tức có tích chọn). Thực hiện tác nghiệp mở HĐTD trên CBS (không sử dụng tính năng STP của CLOS) và gắn (link) bản ghi TSBĐ là tài sản thanh khoản cao.", "Khi tác nghiệp mở HĐTD trên CLOS, tại tab [Giá trị tài trợ và lãi suất] của màn hình thông tin HĐTD, trường [Ngoại lệ] chọn “Không” (không tích chọn). Sử dụng tính năng STP của CLOS để mở HĐTD trên CBS và gắn (link) bản ghi TSBĐ là tài sản thanh khoản cao.", "Khi tác nghiệp mở HĐTD trên CLOS, tại tab [Giá trị tài trợ và lãi suất] của màn hình thông tin HĐTD, trường [Ngoại lệ] chọn “Không” (không tích chọn). Thực hiện tác nghiệp mở HĐTD trên CBS (không sử dụng tính năng STP của CLOS) và gắn (link) bản ghi TSBĐ là tài sản thanh khoản cao."], "a": 1, "g": "Tiết a) Điểm 4.1.3 khoản 4.1 Mục 4 Công văn 17212/VCB-QLRRTD ngày 15/08/2025 (sửa đổi, bổ sung bởi Công văn 7210/VCB-QLRRTD ngày 24/04/2026)"}, {"id": "TD.04.051", "q": "Theo quy định tại Công văn 17212/VCB-QLRRTD ngày 15/08/2025 v/v hướng dẫn một số nội dung khi quản lý và sử dụng GHTD của KHTC trên các hệ thống và các văn bản sửa đổi, bổ sung, Bộ phận nào được phân quyền cài đặt bổ sung các hạn mức tín dụng bao gồm hạn mức theo loại tiền, hạn mức theo sản phẩm cho khách hàng trên hệ thống GLIMS? (Chọn đáp án đúng và đầy đủ nhất)", "o": ["- Đối với KHTC thuộc thẩm quyền quyết định GHTD của Chi nhánh, BP QLN Chi nhánh thực hiện cài đặt các hạn mức tín dụng trên GLIMS cho khách hàng. - Đối với KHTC thuộc thẩm quyền quyết định GHTD của TSC, BP QLN TSC thực hiện cài đặt các hạn mức tín dụng trên GLIMS cho khách hàng. Ngoại trừ các hạn mức tín dụng do BP QLN TSC cài đặt, BP QLN Chi nhánh có thể khai báo bổ sung các hạn mức tín dụng khác nếu có theo quyết định tín dụng của cấp thẩm quyền tại Chi nhánh.", "BP QLN TSC thực hiện cài đặt các hạn mức tín dụng trên GLIMS cho khách hàng theo phê duyệt GHTD của cấp thẩm quyền và BP QLN Chi nhánh có thể khai báo bổ sung các hạn mức tín dụng khác nếu có theo quyết định tín dụng của cấp thẩm quyền tại Chi nhánh.", "BP QLN Chi nhánh thực hiện cài đặt các hạn mức tín dụng trên GLIMS cho khách hàng theo phê duyệt GHTD của cấp thẩm quyền và khai báo bổ sung các hạn mức tín dụng khác nếu có theo quyết định tín dụng của cấp thẩm quyền tại Chi nhánh.", "- Đối với KHTC thuộc thẩm quyền quyết định GHTD của Chi nhánh, BP QLN Chi nhánh thực hiện cài đặt các hạn mức tín dụng trên GLIMS cho khách hàng. - Đối với KHTC thuộc thẩm quyền quyết định GHTD của TSC, BP QLN TSC thực hiện cài đặt các hạn mức tín dụng trên GLIMS cho khách hàng."], "a": 0, "g": "Điểm 2.1.2 khoản 2.1 Mục 2 Công văn 17212/VCB-QLRRTD ngày 15/08/2025 (sửa đổi, bổ sung bởi Công văn 7210/VCB-QLRRTD ngày 24/04/2026)"}, {"id": "TD.04.052", "q": "Theo quy định tại Công văn 6166/VCB-BTKGLIMS ngày 15/05/2023 v/v triển khai chương trình báo cáo giao dịch đồng bộ không thành công trên GLIMS, khi nhận được email thông báo của hệ thống về việc khách hàng có lỗi đồng bộ dữ liệu không thành công trên GLIMS, Đơn vị phải xử lý như thế nào?", "o": ["Bộ phận thẩm định của Đơn vị chủ động đăng nhập vào chương trình báo cáo giao dịch đồng bộ không thành công trên Chương trình CLOS 91 và xuất dữ liệu báo cáo của các hệ thống có phát sinh lỗi đồng bộ dữ liệu. Tùy theo từng mã lỗi dữ liệu của từng hệ thống tín dụng cụ thể, Đơn vị thực hiện rà soát để làm sạch dữ liệu cho từng khách hàng.", "Bộ phận QLN của Đơn vị chủ động đăng nhập vào chương trình báo cáo giao dịch đồng bộ không thành công trên Chương trình GLIMS và xuất dữ liệu báo cáo của các hệ thống có phát sinh lỗi đồng bộ dữ liệu. Tùy theo từng mã lỗi dữ liệu của từng hệ thống tín dụng cụ thể, Đơn vị thực hiện rà soát để làm sạch dữ liệu cho từng khách hàng.", "Bộ phận QLN của Đơn vị chủ động đăng nhập vào chương trình báo cáo giao dịch đồng bộ không thành công trên Chương trình CLOS 91 và xuất dữ liệu báo cáo của các hệ thống có phát sinh lỗi đồng bộ dữ liệu. Tùy theo từng mã lỗi dữ liệu của từng hệ thống tín dụng cụ thể, Đơn vị thực hiện rà soát để làm sạch dữ liệu cho từng khách hàng.", "Bộ phận thẩm định và Bộ phận QLN của Đơn vị chủ động đăng nhập vào chương trình báo cáo giao dịch đồng bộ không thành công trên Chương trình CLOS 91 và xuất dữ liệu báo cáo của các hệ thống có phát sinh lỗi đồng bộ dữ liệu. Tùy theo từng mã lỗi dữ liệu của từng hệ thống tín dụng cụ thể, Đơn vị thực hiện rà soát để làm sạch dữ liệu cho từng khách hàng."], "a": 2, "g": "Mục 2 Công văn 6166/VCB-BTKGLIMS ngày 15/05/2023"}, {"id": "TD.04.056", "q": "Liên quan đến bảo lãnh thời hạn mở, mệnh đề nào sau đây là đúng?", "o": ["Bảo lãnh thời hạn mở chỉ dành cho khách hàng là pháp nhân tại VCB.", "Trong mọi trường hợp xem xét phát hành bảo lãnh thời hạn mở, khách hàng phải thuộc đối tượng bắt buộc xác định GHTD trung, dài hạn theo quy định của VCB.", "Trường hợp phát hành bảo lãnh thời hạn mở cho khoản bảo lãnh được bảo đảm đầy đủ bằng tài sản có tính thanh khoản cao, tỷ lệ bảo đảm theo quy định của VCB được tính trên tổng giá trị của số tiền bảo lãnh.", "Trường hợp phát hành bảo lãnh thời hạn mở cho nghĩa vụ được bảo lãnh là nghĩa vụ tham gia dự thầu thuộc gói thầu áp dụng Luật Đấu thầu và các văn bản quy định pháp luật hướng dẫn Luật Đấu thầu, khách hàng không bắt buộc phải có thời gian hoạt động, có doanh thu từ hoạt động sản xuất kinh doanh chính từ 03 năm trở lên."], "a": 3, "g": "Điều 13 Quyết định 646/QĐ-VCB-QLRRTD ngày 01/04/2025 hướng dẫn thực hiện quy định về bảo lãnh đối với khách hàng tại VCB, đã được sửa đổi bổ sung bởi Quyết định 1046/QĐ-VCB-QLRRTD ngày 06/05/2025"}, {"id": "TD.04.061", "q": "Theo quy định cho vay đối với khách hàng của VCB, Đơn vị KHÔNG được xem xét, cho vay nhu cầu vốn nào sau đây?", "o": ["Nộp thuế thu nhập doanh nghiệp", "Chi trả cổ tức", "Mua vàng trang sức", "Mua chứng chỉ tiền gửi của Vietinbank"], "a": 3, "g": "Điều 8 Quyết định 268/QĐ-HĐQT-CSTD ngày 08/03/2017, đã được sửa đổi, bổ sung bởi Quyết định 1766/QĐ-HĐQT-QLRRTD ngày 28/6/2023;"}, {"id": "TD.04.062", "q": "'Theo quy định về cho vay đối với khách hàng của VCB, trường hợp nào KHÔNG thuộc cơ cấu lại thời hạn trả nợ?", "o": ["Kéo dài thời gian trả nợ của kỳ hạn trả nợ đã thỏa thuận", "Kéo dài thời gian trả nợ gốc khoản vay vượt quá thời hạn cho vay đã thỏa thuận", "Rút ngắn kỳ hạn trả nợ gốc vay, thời hạn vay không thay đổi", "Thay đổi số tiền trả nợ của từng kỳ hạn theo hướng số tiền trả kỳ đầu ít hơn và chuyển số tiền trả nợ nhiều hơn vào các kỳ tiếp theo"], "a": 2, "g": "Khoản 2.5 Điều 2 Quyết định 268/QĐ-HĐQT-CSTD ngày 08/03/2017"}, {"id": "TD.04.063", "q": "Khách hàng A được cấp khoản cho vay dự án đầu tư tại Chi nhánh VCB (thẩm quyền HĐTD TW). Khách hàng đề nghị ngân hàng giải ngân thanh toán tiền nhập khẩu máy móc thiết bị phục vụ dự án theo L/C trả chậm tại Vietinbank. Chi nhánh có được giải ngân thanh toán hợp đồng này hay không?", "o": ["Chi nhánh được thực hiện giải ngân khi khách hàng cung cấp chứng từ phù hợp.", "Chi nhánh không được giải ngân", "Chi nhánh cần trình lại cấp thẩm quyền quyết định cho vay mục đích này", "Tất cả các đáp án trên đều sai"], "a": 0, "g": "Điều 8 Quyết định 268/QĐ-HĐQT-CSTD ngày 08/03/2017; Quyết định 1766/QĐ-HĐQT-QLRRTD ngày 28/6/2023; Công văn 9292/VCB- QLRRTD ngày 19/5/2025"}, {"id": "TD.04.064", "q": "VCB được cho vay cho vay bằng ngoại tệ nhu cầu vốn nào sau đây?", "o": ["Khách hàng vay vốn ngắn hạn để nhập khẩu nguyên vật liệu nhằm thực hiện đơn hàng xuất khẩu cho Doanh nghiệp chế xuất nằm trong khu chế xuất.", "Khách hàng vay vốn để thanh toán lương chuyên gia nước ngoài, phương án sản xuất, kinh doanh của khách hàng là sản xuất hàng hoá xuất khẩu sang Mỹ.", "Khách hàng vay vốn để đầu tư ra nước ngoài", "Khách hàng vay vốn trung hạn để nhập khẩu máy móc thiết bị thực hiện dự án đầu tư mà khách hàng vay có đủ nguồn thu ngoại tệ từ nguồn sản xuất, kinh doanh để trả nợ"], "a": 1, "g": "Mục II Công văn 3547/VCB-QLRRTD ngày 28/12/2018 hướng dẫn cho vay bằng ngoại tệ 2019"}, {"id": "TD.04.065", "q": "Trường hợp nào sau đây không phải cho vay bù đắp tài chính theo quy định của VCB?", "o": ["Khách hàng đề xuất vay vốn để trả lại phần vốn góp của bên thứ ba theo hợp đồng hợp tác kinh doanh, phần vốn góp này đã được sử dụng để thanh toán các chi phí thực hiện dự án đầu tư.", "Khách hàng đề xuất vay vốn để trả nợ khoản vay bên thứ ba, khoản vay này đã được sử dụng để thanh toán các chi phí thực hiện dự án đầu tư.", "Khách hàng đề xuất vay bù đắp phần vốn của chính khách hàng đã bỏ ra để thanh toán các chi phí của dự án đầu tư.", "Khách hàng đề xuất vay vốn để trả lại số tiền công ty mẹ đã cho vay để khách hàng thanh toán các chi phí thực hiện dự án đầu tư."], "a": 0, "g": "Khoản 2.18 Điều 2 Quyết định 268/QĐ-HĐQT-CSTD ngày 08/03/2017"}, {"id": "TD.04.066", "q": "Theo quy định về cho vay đối với khách hàng của VCB, Thẩm quyền ký thỏa thuận cho vay nếu khách hàng là hộ kinh doanh", "o": ["Tất cả các thành viên của hộ kinh doanh cùng ký kết thỏa thuận", "Người được tất cả các thành viên của hộ kinh doanh ủy quyền bằng văn bản (Văn bản ủy quyền được công chứng phù hợp quy định của pháp luật)", "Chỉ cần Chủ hộ kinh doanh ký kết", "Đáp án A và B"], "a": 3, "g": "Điểm b Khoản 23.6 Điều 23 Quyết định 268/QĐ-HĐQT-CSTD ngày 08/03/2017"}, {"id": "TD.05.003", "q": "Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB quy định như thế nào về mối quan hệ giữa CBNV với khách hàng?", "o": ["CBNV phải nỗ lực tối đa trong việc cung cấp các sản phẩm/dịch vụ Ngân hàng phù hợp nhất với nhu cầu của từng đối tượng khách hàng, làm hài lòng khách hàng trên cơ sở đảm bảo tuân thủ quy định của pháp luật và quy định của VCB", "CBNV phải cư xử đúng đắn, trung thực và chuyên nghiệp trong mối quan hệ với khách hàng. CBNV phải cân nhắc lợi ích tốt nhất cho cả VCB và khách hàng, cung cấp thông tin đầy đủ, chính xác, trung thực khi tư vấn cho khách hàng về các sản phẩm/dịch vụ Ngân hàng", "CBNV phải chủ động tránh mọi trường hợp có thể dẫn tới xung đột lợi ích và phải luôn đặt lợi ích của VCB lên trên lợi ích cá nhân trong quan hệ với khách hàng. Nếu thấy lợi ích cá nhân của bản thân đang hoặc có thể bị xung đột lợi ích với Ngân hàng, CBNV phải báo cáo cấp lãnh đạo trực tiếp để được hướng dẫn cách thức xử lý phù hợp", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Khoản 3 Điều 6 Quyết định 16/QĐ-HĐQT-QLRRHĐ ngày 07/01/2021 của Hội đồng quản trị NHNT v/v ban hành Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên Ngân hàng TMCP Ngoại thương Việt Nam Quyết định 1942/QĐ-HĐQT-QLRRHĐ ngày 15/10/2024 của Hội đồng quản trị v/v sửa đổi Quyết định 16"}, {"id": "TD.05.005", "q": "Câu nào là mô tả đúng nhất về đối tượng phải tuân thủ Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên VCB?", "o": ["Toàn thể cán bộ nhân viên và cán bộ quản lý làm công tác bán lẻ tại Chi nhánh và TSC", "Toàn thể cán bộ nhân viên và cán bộ quản lý thực hiện hoạt động kinh doanh, hoạt động tác nghiệp và hỗ trợ tại Chi nhánh và TSC", "Toàn thể cán bộ nhân viên làm việc tại VCB, bao gồm TSC, Chi nhánh, Văn phòng đại diện, Đơn vị sự nghiệp, cán bộ nhân viên do VCB cử đi làm việc tại các đơn vị thành viên, không phân biệt loại và hình thức hợp đồng lao động, hợp đồng dịch vụ, kể cả trong thời gian thử việc, học việc", "Toàn thể cán bộ nhân viên đã ký Hợp đồng lao động chính thức không xác định thời hạn làm việc tại VCB (bao gồm TSC và chi nhánh)"], "a": 2, "g": "Khoản 2 Điều 1 Quyết định 16/QĐ-HĐQT-QLRRHĐ ngày 07/01/2021 của Hội đồng quản trị NHNT v/v ban hành Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên Ngân hàng TMCP Ngoại thương Việt Nam Quyết định 1942/QĐ-HĐQT-QLRRHĐ ngày 15/10/2024 của Hội đồng quản trị v/v sửa đổi Quyết định 16"}, {"id": "TD.05.008", "q": "Hành vi nào sau đây là không đúng quy định trong quan hệ với đồng nghiệp, khách hàng và đối tác tại Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên Ngân hàng TMCP Ngoại thương Việt Nam?", "o": ["Gièm pha, bè phái, lợi dụng, trù dập, phân biệt đối xử với đồng nghiệp.", "Lợi dụng các mối quan hệ là người có liên quan với đồng nghiệp để thực hiện hành vi gian lận.", "Tố giác thành viên BLĐ do mâu thuẫn cá nhân nhưng theo hình thức Thư nặc danh", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điều 8 Quyết định 16/QĐ-HĐQT-QLRRHĐ ngày 07/01/2021 của Hội đồng quản trị NHNT v/v ban hành Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên Ngân hàng TMCP Ngoại thương Việt Nam Quyết định 1942/QĐ-HĐQT-QLRRHĐ ngày 15/10/2024 của Hội đồng quản trị v/v sửa đổi Quyết định 16"}, {"id": "TD.05.012", "q": "Hành vi nào sau đây là vi phạm Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB?", "o": ["Cán bộ khách hàng thực hiện công việc cho doanh nghiệp bên ngoài trong giờ hành chính", "Cán bộ thẩm định thông đồng với cán bộ khách hàng thực hiện hồ sơ vay lập khống do lợi dụng mối quan hệ quen biết với khách hàng, không báo cáo lãnh đạo CN và TSC", "Cán bộ thấy đồng nghiệp gặp khó khăn tài chính nên cho đồng nghiệp vay ké từ khoản vay ưu đãi CBNV của mình tại VCB", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Khoản 2 Điều 3, Khoản 2 Điều 5 và Khoản 1 Điều 11 Quyết định 16/QĐ-HĐQT-QLRRHĐ ngày 07/01/2021 của Hội đồng quản trị NHNT v/v ban hành Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên Ngân hàng TMCP Ngoại thương Việt Nam Quyết định 1942/QĐ-HĐQT-QLRRHĐ ngày 15/10/2024 của Hội đồng quản trị v/v sửa đổi Quyết định 16"}, {"id": "TD.05.013", "q": "Cán bộ khách hàng nắm được thông tin khách hàng gặp khó khăn không trả được nợ đúng hạn nên tạo điều kiện \"đảo nợ\" cho khách hàng bằng khoản vay của một số khách hàng khác thân quen với cán bộ. Trường hợp này cán bộ có vi phạm Quy định ứng xử và đạo đức nghề nghiệp không và vi phạm nội dung nào?", "o": ["Cán bộ vi phạm Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB, cụ thể vi phạm Điều 4 Quyết định 16 - Quy định về cấp tín dụng", "Cán bộ không vi phạm Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB", "Cán bộ vi phạm quy định, quy trình tín dụng hiện hành của VCB, không vi phạm Quy định ứng xử và đạo đức nghề nghiệp của CBNV VCB", "Cán bộ vi phạm Quy định ứng xử và đạo đức nghề nghiệp của VCB, cụ thể vi phạm quy định về việc làm ngoài VCB"], "a": 0, "g": "Khoản 1 Điều 4 Quyết định 16/QĐ-HĐQT-QLRRHĐ ngày 07/01/2021 của Hội đồng quản trị NHNT v/v ban hành Quy định ứng xử và đạo đức nghề nghiệp của cán bộ nhân viên Ngân hàng TMCP Ngoại thương Việt Nam Quyết định 1942/QĐ-HĐQT-QLRRHĐ ngày 15/10/2024 của Hội đồng quản trị v/v sửa đổi Quyết định 16"}, {"id": "TD.05.014", "q": "Theo Quy trình Quản lý rủi ro gian lận của VCB, khi nghi ngờ có rủi ro gian lận, nhằm ngăn chặn tổn thất tiếp tục phát sinh, hỗ trợ quyền lợi của khách hàng/người bị hại các Đơn vị áp dụng các biện pháp xử lý khẩn cấp nào sau đây?", "o": ["Khóa quyền truy cập vào hệ thống của cán bộ liên quan", "Tư vấn cho khách hàng/người bị hại khóa/ngừng các dịch vụ có liên quan đến giao dịch gian lận trường hợp các dịch vụ đó có dấu hiệu bị kẻ gian lợi dụng để thực hiện giao dịch gian lận; và hướng dẫn khách hàng/người bị hại trình báo công an", "Thông báo giám sát quyền ra/vào của cán bộ ở Đơn vị", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Khoản 1c) Điều 13 Mục 5 Chương II Quyết định số 1710/QĐ-VCB-QLRRHĐ ngày 02/11/2017 v/v ban hành Quy trình quản lý rủi ro gian lận của NHNT"}, {"id": "TD.05.015", "q": "Theo bộ tiêu chí xác định mức độ ảnh hưởng của rủi ro hoạt động tại VCB, rủi ro \"Cán bộ tín dụng hỗ trợ khách hàng lập khống hồ sơ vay vốn và chiếm đoạt một phần tiền vay sau khi được giải ngân\", có mức độ ảnh hưởng nào?", "o": ["Tối thiểu có mức độ ảnh hưởng Đáng kể", "Tối thiểu có mức độ ảnh hưởng Lớn", "Tối thiểu có mức độ ảnh hưởng Nghiêm trọng", "Tối thiểu có mức độ ảnh hưởng Rất nghiêm trọng"], "a": 2, "g": "Phụ lục Tiêu chí xác định mức độ ảnh hưởng của rủi ro hoạt động, Quy định số 285/QyĐ-VCB-QLRRHĐ ngày 13/02/2026 v/v Phương pháp đánh giá rủi ro hoạt động của Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.016", "q": "Theo Quy trình Tự đánh giá rủi ro và các chốt kiểm soát tại VCB, hiệu quả của các chốt kiểm soát được đánh giá dựa trên (các) khía cạnh nào?", "o": ["Hiệu quả thiết kế của chốt kiểm soát (đánh giá mức độ đầy đủ và phù hợp của chốt kiểm soát)", "Hiệu quả thực hiện của chốt kiểm soát (đánh giá mức độ hiệu quả thực hiện của chốt kiểm soát được áp dụng trên thực tế)", "Tần suất thực hiện chốt kiểm soát và khả năng phòng ngừa, giảm thiểu rủi ro của chốt kiểm soát", "Hiệu quả thiết kế của chốt kiểm soát (đánh giá mức độ đầy đủ và phù hợp của chốt kiểm soát) và hiệu quả thực hiện của chốt kiểm soát (đánh giá mức độ hiệu quả thực hiện của chốt kiểm soát được áp dụng trên thực tế)"], "a": 3, "g": "Khoản 1 Điều 9 Quyết định 2678/QT-VCB-QLRRHĐ ngày 15/12/2023 v/v ban hành Quy trình Tự đánh giá rủi ro và các chốt kiểm soát tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.017", "q": "Câu nào sau đây mô tả không đúng về mục đích thực hiện Tự đánh giá rủi ro và các chốt kiểm soát (RCSA) tại VCB?", "o": ["Xác định và đánh giá các rủi ro tiềm ẩn, đánh giá hiệu quả của các chốt kiểm soát hiện hành, đánh giá các rủi ro còn lại, từ đó đề xuất cải tiến hoặc bổ sung những biện pháp kiểm soát rủi ro thích hợp nhằm phòng ngừa và giảm thiểu rủi ro hoạt động phát sinh.", "Tăng cường văn hóa QLRRHĐ. Nâng cao nhận thức về rủi ro hoạt động và QLRRHĐ cho các đơn vị, bộ phận nghiệp vụ. 14", "Tập trung vào rà soát, nhận diện các rủi ro tiềm ẩn chưa từng xảy ra tại VCB nhưng có thể xảy ra trong thời gian tới để xây dựng kế hoạch chủ động đối phó khi rủi ro xảy ra.", "Xây dựng báo cáo về hồ sơ rủi ro của VCB/đơn vị, nâng cao sự nhận biết và đảm bảo các rủi ro tiềm ẩn được xem xét và có biện pháp kiểm soát rủi ro phù hợp."], "a": 2, "g": "Điều 5 Quyết định 2678/QT-VCB-QLRRHĐ ngày 15/12/2023 v/v ban hành Quy trình Tự đánh giá rủi ro và các chốt kiểm soát tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.019", "q": "Theo Quy trình Tự đánh giá rủi ro và các chốt kiểm soát tại VCB hiện hành, chốt kiểm soát là:", "o": ["Kiểm soát viên hoặc Lãnh đạo phòng", "Là cơ chế kiểm tra, kiểm soát được thiết lập trong các chinh sách, quy chế, quy định, quy trình nội bộ, trong mô hình tổ chức, trong hệ thống công nghệ, trong cơ sở vật chất kỹ thuật nhằm đảm bảo các quy định và chuẩn mực được áp dụng, giảm thiểu khả năng xử lý không chinh xác hoặc không tuân thủ quy định, từ đó giảm thiểu tần suất xảy ra của rủi ro và/hoặc giảm nhẹ mức độ ảnh hưởng của rủi ro", "Là toàn bộ cá nhân thuộc cấp quản lý trong ngân hàng", "Là các chức năng trên hệ thống được thiết kế nhằm chặn các giao dịch vi phạm quy định của VCB"], "a": 1, "g": "Khoản 2.5 Điều 4 Quyết định 2678/QT-VCB-QLRRHĐ ngày 15/12/2023 v/v ban hành Quy trình Tự đánh giá rủi ro và các chốt kiểm soát tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.020", "q": "Các tình huống khẩn cấp cần xây dựng kế hoạch dự phòng bao gồm:", "o": ["Mất tài liệu, thông tin, dữ liệu quan trọng", "Hệ thống công nghệ thông tin bị sự cố dẫn đến gián đoạn kinh doanh", "Trụ sở làm việc bị ảnh hưởng (do cháy nổ, thiên tai, bạo động….), dẫn đến bị hỏng không thể sử dụng, hoặc không thể tiếp cận được để sử dụng, duy trì hoạt động kinh doanh", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Phụ lục 1 Quyết định 451/QĐ-HĐQT-QLRRHĐ ngày 01/03/2018 v/v ban hành Chính sách quản lý kinh doanh liên tục của Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.021", "q": "Theo Chính sách quản lý rủi ro gian lận của VCB, nhận định nào sau đây là đúng về cơ chế tố giác của VCB?", "o": ["Cơ chế tố giác đảm bảo người tố giác không bị trù dập", "Cơ chế tố giác đảm bảo người tố giác được giữ bí mật về danh tính", "Cơ chế tố giác được xây dựng và triển khai nhằm đảm bảo cán bộ VCB, khách hàng và bất kỳ bên thứ ba nào khác có thể báo cáo các dấu hiệu gian lận được nhận diện", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điều 8, Quyết định số 1364/QĐ-HĐQT-QLRRHĐ ngày 03/10/2017 v/v ban hành Chính sách quản lý rủi ro gian lận của NHNT"}, {"id": "TD.05.022", "q": "Theo Chính sách quản lý rủi ro gian lận của VCB, nội dung nào sau đây KHÔNG phải là nguyên tắc quản lý rủi ro gian lận của VCB?", "o": ["VCB không chấp nhận mọi hành vi gian lận. Mọi hành vi gian lận được phát hiện phải được xử lý theo quy định nội bộ của ngân hàng và quy định của pháp luật", "VCB xây dựng, triển khai thực hiện quy trình và công cụ để nhận diện, phòng ngừa, phát hiện, đánh giá, điều tra, xử lý, kiểm soát và báo cáo rủi ro gian lận, duy trì cơ cấu tổ chức và nguồn lực để thực hiện quản lý rủi ro gian lận hiệu quả theo quy định", "VCB xây dựng văn hóa phòng, chống gian lận trên toàn hệ thống VCB thông qua các chương trình đào tạo, truyền thông nhằm nâng cao nhận thức của toàn thể cán bộ VCB về quản lý rủi ro gian lận", "CBNV thực hiện hành vi gian lận không bị xử lý kỷ luật nếu không gây tổn thất cho VCB"], "a": 3, "g": "Điều 4, Quyết định số 1364/QĐ-HĐQT-QLRRHĐ ngày 03/10/2017 v/v ban hành Chính sách quản lý rủi ro gian lận của NHNT"}, {"id": "TD.05.023", "q": "Theo Chính sách quản lý rủi ro gian lận của VCB, hành vi gian lận là gì?", "o": ["Là hành vi cố ý lừa đảo, chiếm đoạt tài sản của ngân hàng của cán bộ ngân hàng", "Là hành vi cố ý vi phạm các quy định của pháp luật và/hoặc quy định nội bộ của ngân hàng của cán bộ ngân hàng và/hoặc đối tượng bên ngoài", "Là hành vi cố ý lừa đảo, chiếm đoạt tài sản của ngân hàng và/hoặc của khách hàng tại Ngân hàng, hoặc cố ý vi phạm các quy định của pháp luật và/hoặc quy định nội bộ của Ngân hàng của cán bộ Ngân hàng và/hoặc đối tượng bên ngoài", "Là gian lận nội bộ và gian lận bên ngoài"], "a": 2, "g": "Khoản 2b) Điều 3 Chương I, Quyết định số 1364/QĐ-HĐQT-QLRRHĐ ngày 03/10/2017 v/v ban hành Chính sách quản lý rủi ro gian lận của NHNT"}, {"id": "TD.05.024", "q": "Trường hợp nào sau đây KHÔNG tính vào Giá trị Tổn thất rủi ro hoạt động của VCB theo Quy định 286?", "o": ["Tổn thất phát sinh từ các sự cố rủi ro tín dụng có yếu tố rủi ro hoạt động", "Tiền VCB phải bồi thường cho các đối tượng bên ngoài và cán bộ do sự cố RRHĐ", "Chi phí pháp lý trực tiếp liên quan tới sự cố RRHĐ (chi phí thuê tư vấn, luật sư)", "Tiền không thu hồi được từ các tổ chức/cá nhân theo cam kết do hậu quả của sự cố RRHĐ"], "a": 0, "g": "Khoản 3.2.24 Quyết định số 286/QyĐ-VCB-QLRRHĐ ngày 13/02/2026 của Tổng Giám đốc v/v Quy định Báo cáo, xử lý, quản lý sự cố và tổn thất rủi ro hoạt động tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.025", "q": "Khi phát hiện sự cố rủi ro hoạt động rất nghiêm trọng hoặc sự cố nghiêm trọng, thời hạn báo cáo lần đầu của Đơn vị phát hiện được quy định như thế nào?", "o": ["Báo cáo qua chương trình QLRRHĐ trong vòng 03 ngày làm việc kể từ thời điểm phát hiện", "Báo cáo qua điện thoại không muộn hơn 04 giờ và qua email không muộn hơn 24 giờ kể từ thời điểm phát hiện", "Báo cáo qua điện thoại không muộn hơn 01 giờ kể từ thời điểm phát hiện tới Thành viên BĐH phụ trách trực tiếp Đơn vị/Hoạt động, Đơn vị chức năng và Phòng QLRRHĐ; đồng thời báo cáo qua email không muộn hơn 24 giờ về các thông tin ban đầu của sự cố theo Phụ lục 6 Quyết định số 286/QyĐ-VCB-QLRRHĐ ngày 13/02/2026 của Tổng Giám đốc về Quy định Báo cáo, xử lý, quản lý sự cố và tổn thất rủi ro hoạt động tại VCB", "Báo cáo qua email không muộn hơn 04 giờ kể từ thời điểm phát hiện"], "a": 2, "g": "Khoản 7.1.a Điều 7 Quyết định số 286/QyĐ-VCB-QLRRHĐ ngày 13/02/2026 của Tổng Giám đốc v/v Quy định Báo cáo, xử lý, quản lý sự cố và tổn thất rủi ro hoạt động tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.026", "q": "Khi phát hiện sự cố an toàn thông tin (ví dụ: tấn công mạng vào hệ thống VCB), bên cạnh việc báo cáo Phòng QLRRHĐ, Đơn vị phải đồng thời báo cáo tới đơn vị chức năng nào sau đây?", "o": ["Trưởng Ban Kiểm tra nội bộ hoặc Lãnh đạo thuộc Ban KTNB phụ trách nội dung liên quan đến sự cố", "Ban Marketing và Truyền thông", "Lãnh đạo Phòng KSANTT qua hòm thư infosec@vietcombank.com.vn hoặc điện thoại 2510-2514", "Đơn vị đầu mối quản lý quy định/sản phẩm liên quan đến sự cố"], "a": 2, "g": "Khoản 4.4.b Điều 4 Quyết định số 286/QyĐ-VCB-QLRRHĐ ngày 13/02/2026 của Tổng Giám đốc v/v Quy định Báo cáo, xử lý, quản lý sự cố và tổn thất rủi ro hoạt động tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.027", "q": "Theo Quy định Báo cáo, quản lý, xử lý sự cố và tổn thất rủi ro hoạt động tại Ngân hàng TMCP Ngoại thương Việt Nam, trách nhiệm của mọi cán bộ nhân viên của VCB là gì?", "o": ["Có trách nhiệm báo cáo sự cố ngay khi phát hiện cho lãnh đạo bộ phận nơi công tác để tập hợp báo cáo theo quy định", "Trường hợp sự cố xảy ra ngoài giờ làm việc và thuộc danh mục sự cố rất nghiêm trọng/sự cố nghiêm trọng, người phát hiện thông báo ngay cho VCC để kịp thời giải đáp cho khách hàng và/hoặc thông báo cho Đơn vị chức năng để xử lý sự cố.", "Không được cung cấp thông tin liên quan đến sự cố ra bên ngoài ngoài phạm vi thẩm quyền của mình (cung cấp thông tin cho các cơ quan truyền thông; đưa thông tin, bình luận trên mạng xã hội…)", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Điều 32 Quyết định số 286/QyĐ-VCB-QLRRHĐ ngày 13/02/2026 của Tổng Giám đốc v/v Quy định Báo cáo, xử lý, quản lý sự cố và tổn thất rủi ro hoạt động tại Ngân hàng TMCP Ngoại thương Việt Nam"}, {"id": "TD.05.028", "q": "Theo Quy trình Quản lý rủi ro gian lận của VCB, các thông tin ban đầu cần xác minh về dấu hiệu gian lận/sự cố rủi ro gian lận bao gồm những thông tin nào? Chọn đáp án đúng nhất.", "o": ["Đối tượng liên quan đến dấu hiệu gian lận, sự cố rủi ro gian lận", "Loại hành vi gian lận", "Mức độ ảnh hưởng của dấu hiệu gian lận, sự cố rủi ro gian lận", "Tất cả các đáp án trên đều đúng"], "a": 3, "g": "Khoản 1a) Điều 10 Mục 3 Chương II, Quyết định số 1710/QĐ-VCB-QLRRHĐ ngày 02/11/2017 v/v ban hành Quy trình quản lý rủi ro gian lận của NHNT"}, {"id": "TD.05.029", "q": "Theo Quy trình Quản lý rủi ro gian lận của VCB, người tố giác có thể là ai trong những đối tượng sau?", "o": ["Cán bộ của VCB, khách hàng của VCB", "Bất kỳ bên thứ 3 nào khác", "Cán bộ của VCB, khách hàng của VCB, bất kỳ bên thứ 3 nào khác", "Khách hàng của VCB, bất kỳ bên thứ 3 nào khác"], "a": 2, "g": "Khoản 3 Điều 5 Mục 1 Chương II Quyết định số 1710/QĐ-VCB-QLRRHĐ ngày 02/11/2017 v/v ban hành Quy trình quản lý rủi ro gian lận của NHNT"}, {"id": "TD.05.030", "q": "Theo quy định của VCB, hành vi nào sau đây bị coi là hành vi gian lận?", "o": ["Cán bộ thẩm định tín dụng cố tình đưa thông tin không chính xác về tình hình khách hàng trong báo cáo thẩm định tín dụng", "Cán bộ Quản lý nợ nhập sai lịch trả nợ của khách hàng lên hệ thống dẫn đến khoản vay của khách hàng bị quá hạn và chuyển nhóm nợ", "Cán bộ có sai sót khi giải ngân cho khách hàng vay vốn ưu đãi lãi suất ngoài thời hạn của chương trình.", "Cán bộ tham gia công tác cấp tín dụng chưa kịp thời bám sát, cập nhật tình hình khách hàng, dẫn đến việc chưa tuân thủ điều kiện phê duyệt cấp tín dụng của cấp có thẩm quyền"], "a": 0, "g": "Điều 4, khoản 1, Quyết định 1710/QĐ-VCB-QLRRHĐ ngày 02/11/2017 v/v ban hành Quy trình quản lý rủi ro gian lận của NHNT"}, {"id": "TD.06.001", "q": "Theo Quyết định 130/QĐ-VCB-CSSPBB ngày 09/02/2022, phối hợp giữa các Đơn vị cùng cấp tín dụng đối với một KHBB như thế nào?", "o": ["Tất cả các trường hợp nhiều Đơn vị cùng cấp tín dụng đối với một khách hàng đều phải được TSC phê duyệt chấp thuận chủ trương", "Tất cả các trường hợp nhiều Đơn vị cùng cấp tín dụng đối với một khách hàng thuộc phân khúc Vừa và Thương mại đều phải được TSC phê duyệt chấp thuận chủ trương", "Trường hợp cần thiết nhiều Đơn vị cùng cấp tín dụng đối với một khách hàng, các Đơn vị phải được sự chấp thuận chủ trương TSC, trừ trường hợp không bắt buộc xác định GHTD theo quy định của VCB", "Trường hợp cần thiết nhiều Đơn vị cùng cấp tín dụng đối với một khách hàng, các Đơn vị phải được sự chấp thuận chủ trương TSC, trừ trường hợp các Đơn vị cùng đồng thuận về việc phối hợp cấp tín dụng"], "a": 2, "g": "Quyết định 130/QĐ-VCB-CSSPBB ngày 09/02/2022 - Điều 3 điểm 3.1"}, {"id": "TD.06.002", "q": "Theo Quyết định 130/QĐ-VCB-CSSPBB ngày 09/02/2022 phối hợp giữa các Đơn vị cùng cấp tín dụng đối với một KHBB, trường hợp Chi nhánh tiếp cận cấp khoản bảo lãnh 04 tỷ VND đối với 01 khách hàng đã được Chi nhánh khác cấp thẻ tín dụng công ty với hạn mức 01 tỷ đồng và KH chưa có GHTD tại VCB:", "o": ["Chi nhánh được chủ động tiếp cận", "Chi nhánh chủ động tiếp cận trong trường hợp áp dụng biểu phí, lãi suất theo niêm yết", "Chi nhánh trình TSC phê duyệt chủ trương tiếp cận khách hàng", "Chi nhánh không được tiếp cận"], "a": 0, "g": "Điểm 3.1 Điều 3 Quyết định 130/QĐ-VCB-CSSPBB ngày 09/02/2022 quy định phối hợp cùng cấp tín dụng đối với KHBB. Quy định 715/QĐ-HĐQT-QLRRTD ngày 29/04/2020"}, {"id": "TD.06.003", "q": "Đối tượng khách hàng nào được áp dụng Quy định về Giải pháp cho vay trực tuyến trên các Kênh ngân hàng điện tử của VCB theo Quy định số 2779/QyĐ-VCB-CSSPBB.GPKSBB ngày 12/12/2025:", "o": ["Khách hàng doanh nghiệp lớn", "Khách hàng FDI", "Khách hàng tổ chức", "Khách hàng bán buôn"], "a": 3, "g": "Quy định số 2779/QyĐ-VCB-CSSPBB.GPKSBB ngày 12/12/2025- Điều I- Quy định chung"}, {"id": "TD.06.006", "q": "Khi đăng ký Giải pháp Cho vay trực tuyến cho KHBB, Khách hàng có thể thực hiện:", "o": ["Gửi đề nghị giải ngân đến ngân hàng", "Gửi đề nghị thu nợ/tất toán trước hạn đến ngân hàng", "Truy vấn hạn mức Hợp đồng tín dụng tại Ngân hàng", "Tất cả phương án trên"], "a": 3, "g": "Điều 16, Điều 28 - Quy định số 2779/QyĐ-VCB-CSSPBB.GPKSBB ngày 12/12/2025 quy định về Giải pháp cho vay trực tuyến dành cho KHBB và Hướng dẫn sử dụng hệ thống dành cho KHBB"}, {"id": "TD.06.012", "q": "Theo Sản phẩm thẻ tín dụng công ty dành cho KHTC đã có GHTD theo Quy định số 2168/QĐ-VCB-CSSPBB.PTSPBL ngày 26/09/2025, thẩm quyền phê duyệt Hạn mức thẻ theo sản phẩm là?", "o": ["Cấp thẩm quyền phê duyệt Giới hạn thẻ tín dụng", "Giám đốc Khách hàng (đối với Khách hàng tại TSC) hoặc Giám đốc Chi nhánh (đối với Khách hàng tại Chi nhánh)", "Giám đốc Chi nhánh", "Cấp thẩm quyền phê duyệt cấp tín dụng thẻ"], "a": 1, "g": "Điều 10 - Quy định số 2168/QĐ-VCB-CSSPBB.PTSPBL ngày 26/09/2025"}, {"id": "TD.06.013", "q": "Theo Quy định Sản phẩm tài trợ NPP các Hãng xe ô tô tại VCB ban hành kèm Quyết định số 1437/QĐ-VCB-CSSPBB ngày 09/08/2024, Tần suất kiểm tra thực tế TSBĐ là Lô xe định kỳ?", "o": ["Tối thiểu 01 lần/01 tháng và/hoặc đột xuất", "Tối thiểu 01 lần/03 tháng và/hoặc đột xuất", "Tối thiểu 01 lần/06 tháng và/hoặc đột xuất", "Tối thiểu 01 lần/12 tháng và/hoặc đột xuất"], "a": 0, "g": "Mục 8.5.2 - Phụ lục 01 QĐ số 1437/QĐ-VCB-CSSPBB ngày 09/08/2024"}, {"id": "TD.06.016", "q": "Hệ thống Online Lending đã hỗ trợ tra cứu tự động đối với các chứng từ nào?", "o": ["Hóa đơn điện tử", "Tờ khai hải quan", "A và B đều đúng", "Hệ thống Online Lending chưa hỗ trợ tra cứu tự động hồ sơ chứng từ"], "a": 0, "g": "Điều 18 - Quy định số 2779/QyĐ-VCB-CSSPBB.GPKSBB ngày 12/12/2025 quy định về Giải pháp cho vay trực tuyến dành cho KHBB"}, {"id": "TD.06.018", "q": "Dư nợ thấu chi sẽ chuyển nợ quá hạn trong các trường hợp nào?", "o": ["Khách hàng không trả được dư nợ gốc thấu chi đến hạn và/hoặc lãi thấu chi đến hạn vào Ngày đến hạn trả nợ gốc thấu chi", "Khách hàng không trả được lãi thấu chi sau 10 ngày tính từ ngày cuối cùng của Thời hạn trả lãi thấu chi", "Khách hàng không trả được lãi thấu chi sau 30 ngày tính từ ngày cuối cùng của Thời hạn trả lãi thấu chi", "Cả A và B đều đúng"], "a": 3, "g": "Điều 19 - Quy định số 2009/QyĐ-VCB-CSSPBB ngày 9/9/2025 sản phẩm thấu chi dành cho KHBB"}, {"id": "TD.06.019", "q": "Điều kiện nào
